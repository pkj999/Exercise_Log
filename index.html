<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동일지">
<meta name="theme-color" content="#F4F5F7">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 운동일지 — Hevy 참고 재설계 (2026-11)
   색은 액센트(파랑) 하나 + 완료(초록)·위험(빨강)·PR(금색) 기능색만 쓴다. 모든 색은 아래 토큰으로만. */
:root {
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --card-2: #F0F1F4;
  --text: #111318;
  --muted: #6B7280;
  --line: #E5E7EB;
  --accent: #2F7BF6;
  --accent-soft: #E6EFFE;
  --on-accent: #FFFFFF;
  --good: #1FA863;
  --good-soft: #E3F6EC;
  --danger: #E5484D;
  --danger-soft: #FDEBEC;
  --gold: #C98A0C;
  --gold-soft: #FFF3D6;
  --warm: #E8890C;
  --shadow: 0 1px 2px rgba(17, 19, 24, .05);
  --radius: 14px;
  --tabbar-h: 62px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0E0F11;
  --card: #1A1B1F;
  --card-2: #24262B;
  --text: #F2F3F5;
  --muted: #9097A1;
  --line: #2C2E34;
  --accent: #4D8DFF;
  --accent-soft: #1A2740;
  --good: #34C77B;
  --good-soft: #15291F;
  --danger: #FF6369;
  --danger-soft: #3A1B1D;
  --gold: #F2B53A;
  --gold-soft: #3A2E12;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { flex-shrink: 0; }

.loading { padding: 40vh 0 0; text-align: center; color: var(--muted); }
#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 84px); }
.top h1 { font-size: 26px; font-weight: 800; margin: 8px 0 14px; letter-spacing: -.02em; }

/* ---------- 공통 요소 ---------- */
.card { display: block; width: 100%; text-align: left; background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-head b { font-size: 16px; font-weight: 700; }
.card-actions { display: flex; align-items: center; flex-shrink: 0; margin-right: -8px; }
.icon-btn.fav.on { color: var(--gold); }
.month-head svg { color: var(--gold); vertical-align: -2px; }
.muted { color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.hint { color: var(--muted); font-size: 14px; text-align: center; margin: 18px 0; }
.hint.left { text-align: left; margin: 0 0 12px; }
.sec-title { font-size: 17px; font-weight: 700; margin: 22px 0 10px; }
.sec-title:first-child { margin-top: 4px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec-head .sec-title { margin-bottom: 10px; }
.count { color: var(--muted); font-weight: 600; font-size: .85em; margin-left: 2px; }
.month-head { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 2px 8px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty p { margin: 10px 0 14px; font-size: 14px; line-height: 1.6; }
.version { text-align: center; color: var(--muted); font-size: 12px; margin: 24px 0 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: transform .08s, opacity .15s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--card-2); color: var(--text); }
.btn-secondary.danger, .btn-text-danger { color: var(--danger); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { color: var(--accent); }
.btn-text-danger { background: none; }
.btn-block { display: flex; width: 100%; margin: 10px 0; }
.btn-lg { min-height: 52px; font-size: 16px; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row .btn { flex: 1; }
.icon-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--muted); }
.icon-btn:active { background: var(--card-2); }

.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); outline: none; font-size: 16px; }
.input:focus { border-color: var(--accent); }
.field { display: block; margin: 0 0 12px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field-note { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
.field-row { display: flex; gap: 8px; }
.field-row .field { flex: 1; min-width: 0; }
.field-row .field.narrow { flex: 0 0 84px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex-shrink: 0; padding: 7px 13px; border-radius: 999px; background: var(--card-2); font-size: 14px; font-weight: 600; color: var(--muted); }
.chip.on { background: var(--accent); color: var(--on-accent); }

.search { position: relative; margin-bottom: 10px; }
.search.grow { flex: 1; margin-bottom: 0; }
.search .input { padding-left: 38px; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; }

.list-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); background: var(--card); }
.list .list-row:last-child { border-bottom: 0; }
.list:not(.card) { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); margin-bottom: 10px; }
.list-row.on { background: var(--accent-soft); }
.list-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list-main b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-main small { color: var(--muted); font-size: 13px; }
.ex-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--card-2); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.list-row.on .ex-avatar { background: var(--accent); color: var(--on-accent); }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
.list-row.on .tick { background: var(--accent); border-color: var(--accent); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.row + .row { border-top: 1px solid var(--line); }
.seg { display: flex; background: var(--card-2); border-radius: 10px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; background: var(--card-2); font-size: 18px; font-weight: 700; }
.stepper b { min-width: 64px; text-align: center; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--good); }
.switch.on::after { transform: translateX(20px); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.badge.ok { background: var(--good-soft); color: var(--good); }
.row-label { font-weight: 400; white-space: normal; }
.warn-note { font-size: 13px; font-weight: 600; color: var(--warm); background: var(--gold-soft); border-radius: 10px; padding: 9px 12px; margin: -4px 0 12px; }

/* ---------- 운동 탭 ---------- */
.routine-body { display: block; width: 100%; text-align: left; border-radius: 10px; }
.routine-body .wk-lines { border-top: 0; padding-top: 2px; }
.routine-body .meta { display: flex; align-items: center; margin-bottom: 12px; }
.more-link { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 600; }
.fav-mark { color: var(--gold); margin-right: 6px; vertical-align: 1px; }
.prev-line { font-size: 13px; color: var(--muted); margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.card.routine .btn-block { margin-bottom: 0; }
.card.resume { display: flex; align-items: center; gap: 12px; border-color: var(--accent); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 1.6s infinite; flex-shrink: 0; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,168,99,.5); } 100% { box-shadow: 0 0 0 10px rgba(31,168,99,0); } }

/* ---------- 기록 탭 ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-grid.four { grid-template-columns: repeat(4, 1fr); }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; }
.stat b { font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b i { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 1px; }
.bars-wrap { position: relative; padding-top: 18px; }
.bars-max { position: absolute; top: 0; left: 0; font-size: 11px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 96px; border-bottom: 1px solid var(--line); }
.bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; border-radius: 4px 4px 0 0; }
.bar.sel { box-shadow: 0 0 0 2px var(--text); }
.week-card { touch-action: pan-y; }
.week-title { display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
.week-title small { font-size: 12px; }
.dbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 150px; margin-top: 6px; }
.dcol { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; border-radius: 10px; padding: 2px 0; }
.dcol:not(.empty):active { background: var(--card-2); }
.dval { font-size: 11px; font-weight: 700; color: var(--text); height: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dbar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); }
.dbar { width: 62%; max-width: 28px; background: var(--accent); border-radius: 4px 4px 0 0; }
.dnone { width: 5px; height: 5px; border-radius: 50%; background: var(--line); margin-bottom: 4px; }
.dlab { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.3; font-variant-numeric: tabular-nums; }
.dlab.today { color: var(--accent); font-weight: 800; }
.week-hint { font-size: 11px; color: var(--muted); text-align: center; margin: 8px 0 0; }
.bar { width: 100%; background: var(--accent-soft); border-radius: 4px 4px 0 0; }
.bar.now { background: var(--accent); }
[data-theme="dark"] .bar:not(.now) { background: #2A3A5C; }
.bar-labels { display: flex; gap: 5px; margin-top: 4px; }
.bar-labels span { flex: 1; font-size: 10px; color: var(--muted); text-align: center; white-space: nowrap; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-dow { font-size: 12px; color: var(--muted); padding: 2px 0; }
.cal-day { aspect-ratio: 1; max-height: 42px; border-radius: 50%; font-size: 14px; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; margin: 0 auto; width: 100%; max-width: 42px; }
.cal-day.today { font-weight: 800; color: var(--accent); }
.cal-day.has { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.cal-day.sel { box-shadow: 0 0 0 2px var(--text); }
.cal-clear { display: flex; margin: 8px auto 0; }
.card.workout .card-head b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.wk-stats span { display: inline-flex; align-items: center; gap: 4px; }
.pr { color: var(--gold) !important; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; }
.wk-lines { border-top: 1px solid var(--line); padding-top: 8px; }
.wk-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 2px 0; }
.wk-line span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-line span:last-child { flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ---------- 상세 / 페이지 ---------- */
#pages .page { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; transform: translateX(100%); transition: transform .22s ease; overscroll-behavior: contain; }
#pages .page.in { transform: none; }
.page-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 8px) max(10px, calc(50% - 286px)) 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.page-title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-right { display: flex; align-items: center; gap: 4px; }
.page-body { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom) + 96px); }
.detail-title { font-size: 22px; font-weight: 800; margin: 0; }
.note-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; margin: 0 0 12px; }
.set-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.set-line { display: flex; align-items: center; gap: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.set-line .e1 { margin-left: auto; font-size: 12px; }
.hist-item .set-list { margin-top: 2px; }

/* 오른쪽 56px은 y축 눈금 자리 — 선·점과 겹치지 않게 */
.chart { position: relative; padding: 4px 56px 20px 0; }
.chart-svg { width: 100%; height: 150px; display: block; overflow: visible; }
.chart-y { position: absolute; top: 4px; right: 0; width: 52px; height: 150px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--muted); pointer-events: none; text-align: right; }
.chart-dots { position: absolute; left: 0; right: 56px; top: 4px; height: 150px; pointer-events: none; }
.chart-dots i { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent); }
.chart-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); position: absolute; left: 0; right: 56px; bottom: 0; }

/* ---------- 편집기 ---------- */
.editor .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stats-bar div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.stats-bar small, .finish-stats small { display: block; font-size: 12px; color: var(--muted); }
.stats-bar b, .finish-stats b { font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; }
.stats-bar .js-elapsed { color: var(--accent); }
.title-input { width: 100%; border: 0; background: none; outline: none; font-size: 22px; font-weight: 800; padding: 4px 0; margin-bottom: 6px; }
.title-input::placeholder { color: var(--muted); font-weight: 600; }
.note-input { width: 100%; resize: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; outline: none; font-size: 15px; margin-bottom: 12px; min-height: 40px; overflow: hidden; }
.note-input:focus { border-color: var(--accent); }

.block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 10px 4px; margin-bottom: 12px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-left: 4px; }
.block-name { color: var(--accent); font-weight: 750; font-size: 16px; text-align: left; padding: 4px 0; }
.block-note { width: 100%; border: 0; background: none; outline: none; font-size: 14px; color: var(--muted); padding: 2px 4px 6px; }
.rest-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--accent); padding: 2px 4px 8px; }
.set-table { margin: 0 -4px; }
.set-row { display: grid; align-items: center; gap: 6px; padding: 4px; border-radius: 8px; }
.set-row.head { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-top: 0; padding-bottom: 2px; }
.set-row.head span { text-align: center; display: flex; justify-content: center; }
.set-row.head span:nth-child(2) { justify-content: flex-start; padding-left: 4px; }
.set-row.done { background: var(--good-soft); }
.set-badge { width: 28px; height: 28px; border-radius: 8px; background: var(--card-2); font-weight: 750; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.set-row.done .set-badge { background: transparent; }
.set-badge.t-w { color: var(--warm); }
.set-badge.t-d { color: var(--accent); }
.set-badge.t-f { color: var(--danger); }
.prev { text-align: left; font-size: 13px; color: var(--muted); padding: 6px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.prev svg { color: var(--gold); }
.set-input { width: 100%; height: 36px; border: 0; border-radius: 8px; background: var(--card-2); text-align: center; font-weight: 700; font-size: 16px; outline: none; padding: 0 2px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.set-input::-webkit-outer-spin-button, .set-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set-input::placeholder { color: var(--muted); opacity: .7; font-weight: 600; }
.set-input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.set-row.done .set-input { background: transparent; }
.check { width: 36px; height: 36px; border-radius: 8px; background: var(--card-2); color: var(--muted); display: flex; align-items: center; justify-content: center; }
.check.on { background: var(--good); color: #fff; }
.add-set { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; min-height: 38px; margin: 6px 0; border-radius: 8px; background: var(--card-2); font-weight: 650; font-size: 14px; color: var(--text); }

.rest-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 10px max(12px, calc(50% - 280px)) calc(env(safe-area-inset-bottom) + 10px); background: var(--card); border-top: 1px solid var(--line); overflow: hidden; }
.rest-progress { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); transition: width .5s linear; }
.rest-main { flex: 1; display: flex; align-items: center; gap: 6px; color: var(--accent); }
.rest-main b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
.rest-btn { min-height: 38px; padding: 0 12px; border-radius: 10px; background: var(--card-2); font-weight: 700; font-size: 14px; }
.rest-btn.strong { background: var(--accent); color: var(--on-accent); }

/* ---------- 미니바 · 탭바 ---------- */

<script>

// 순번만으로 맞추면 이번에 워밍업을 하나 더 넣었을 때 워밍업 줄에 지난 본세트 무게가 보이는 문제가 있었다.

  var n = 0;
  data.workouts.forEach(function (w) { if (w.exercises.some(function (b) { return b.exId === exId; })) n++; });

  pages.push(page);

  if (sheetOpen && !direct && pages.length > depth) {

    afterPop = [];

  }

var sheetOpen = false;
// items: [{ label, icon, danger, onClick }]
function actionSheet(title, items) {
  var html = (title ? '<div class="sheet-title">' + esc(title) + '</div>' : '') +
    items.map(function (it, i) {
      return '<button class="sheet-item' + (it.danger ? ' danger' : '') + (it.active ? ' active' : '') + '" data-i="' + i + '">' +
        (it.icon ? icon(it.icon, 18) : '') + '<span>' + esc(it.label) + '</span>' + (it.active ? icon('check', 16) : '') + '</button>';
    }).join('') +
    '<button class="sheet-item cancel" data-i="-1">취소</button>';
  showSheet(html, function (box) {
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-i]');
      if (!b) return;
      var i = Number(b.getAttribute('data-i'));
      hideSheet();
      if (i >= 0 && items[i].onClick) items[i].onClick();
    });
  });
}
function confirmSheet(msg, okLabel, onOk, opts) {
  opts = opts || {};

    '<div class="sheet-row"><button class="btn btn-secondary" data-c="0">' + esc(opts.cancelLabel || '취소') + '</button>' +
    '<button class="btn ' + (opts.danger === false ? 'btn-primary' : 'btn-danger') + '" data-c="1">' + esc(okLabel) + '</button></div>',
  function (box) {
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-c]');

  });
}
function showSheet(html, bind) {
  var box = $('sheet-box');

  box.parentNode.replaceChild(fresh, box);

    } else {
      text = null;
    }
    return { value: text, sha: json.sha, tokenExpiresAt: tokenExpiresAt };
  }

  async function ghTestConnection(cfg) {
    var res = await ghFetch(cfg, { query: '?ref=' + (cfg.branch || 'main') });
    if (res.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
    if (res.status === 403) throw new Error('접근이 거부되었습니다. 토큰 권한(Contents: Read and write)을 확인해주세요.');
    var tokenExpiresAt = res.headers.get('github-authentication-token-expiration') || null;
    if (res.status === 404) {
      if (!(await ghRepoExists(cfg))) throw new Error('저장소 "' + cfg.owner + '/' + cfg.repo + '"를 찾을 수 없습니다. 계정명과 저장소 이름을 확인해주세요.');
      return { tokenExpiresAt: tokenExpiresAt }; // 저장소는 있지만 아직 기록 파일이 없음 — 처음 연결할 때는 정상
    }
    if (!res.ok) {
      var body = await res.json().catch(function () { return {}; });
      throw new Error(body.message || '연결 실패 (' + res.status + ')');
    }
    return { tokenExpiresAt: tokenExpiresAt };
  }

  async function ghPutData(cfg, valueStr, sha) {
    var body = { message: 'update exercise log', content: utf8ToBase64(valueStr), branch: cfg.branch || 'main' };
    if (sha) body.sha = sha;
    var res = await ghFetch(cfg, { method: 'PUT', body: body });
    if (!res.ok) {
      var err = await res.json().catch(function () { return {}; });
      var e = new Error(err.message || 'GitHub 저장 실패 (' + res.status + ')');
      e.status = res.status;
      throw e;
    }
    var json = await res.json();
    return json.content.sha;
  }

  // ---------- [저장] 저장소 어댑터 (클로드 앱 storage / 브라우저 localStorage / GitHub) ----------
  var store = (function () {
    var hasClaude = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
    var baseStore;
    if (hasClaude) {
      baseStore = {
        mode: 'claude',
        get: function (k) { return window.storage.get(k, false); },
        set: function (k, v) { return window.storage.set(k, v, false); }
      };
    } else {
      baseStore = {
        mode: 'local',
        get: function (k) {
          return new Promise(function (resolve, reject) {
            try {
              var v = window.localStorage.getItem(k);
              if (v === null) reject(new Error('not found')); else resolve({ key: k, value: v });
            } catch (e) { reject(e); }
          });
        },
        set: function (k, v) {
          return new Promise(function (resolve, reject) {
            try { window.localStorage.setItem(k, v); resolve({ key: k, value: v }); }
            catch (e) { reject(e); }
          });
        }
      };
    }

    // 운동 기록 본문(STORAGE_KEY)만 GitHub로 라우팅한다. 임시저장(draft)·타이머 같은 건
    // 기기마다 다르고 자주 바뀌는 값이라 그대로 이 기기 로컬에만 둔다(매번 GitHub에 커밋하면
    // API 호출도 과하고 커밋 기록도 지저분해짐).

    // 기록을 연달아 빠르게 지우거나 추가하면 persist()가 짧은 간격으로 여러 번 겹쳐 불릴 수
    // 있는데, 그때마다 store.set이 곧바로 PUT을 쏘면 서로 다른 요청이 같은(오래된) ghSha를
    // 들고 동시에 시작돼서 뒤늦게 도착한 쪽이 충돌(409)로 실패할 수 있다(1회 재시도로도 세
    // 번째 이상 겹치면 못 따라잡음). 그래서 실제 GitHub 쓰기는 한 번에 하나씩만, 앞선 쓰기가
    // 끝난 뒤에 이어서 실행되도록 큐로 순서를 강제한다 — 화면/로컬 반영은 이미 즉시 끝나
    // 있으므로 사용자 입장에서 느려지는 건 없고, 뒤에서 GitHub에 순서대로 쌓이기만 한다.
    var ghWriteQueue = Promise.resolve();
    function queueGhWrite(fn) {
      var result = ghWriteQueue.then(fn, fn);
      ghWriteQueue = result.catch(function () {});
      return result;
    }

    return {
      get mode() { return getGhConfig() ? 'github' : baseStore.mode; },
      get: function (k) {
        var cfg = getGhConfig();
        if (!cfg || k !== STORAGE_KEY) return baseStore.get(k);
        try {
          // 아직 GitHub에 못 올린 이 기기만의 변경사항이 있으면(GH_PENDING_KEY), 네트워크에서
          // 새로 읽어와서 그걸 덮어쓰는 사고를 막기 위해 무조건 로컬 사본을 그대로 믿는다.
          var pending = !!window.localStorage.getItem(GH_PENDING_KEY);
          var cachedAt = Number(window.localStorage.getItem(GH_CACHE_AT_KEY) || 0);
          var cached = window.localStorage.getItem(GH_CACHE_KEY);
          if (cached && (pending || (cachedAt && (Date.now() - cachedAt) < GH_WRITE_GRACE_MS))) {
            return Promise.resolve({ key: k, value: cached });
          }
        } catch (e) {}
        return ghGetData(cfg).then(function (r) {
          if (r.value == null) return baseStore.get(k);
          ghSha = r.sha;
          try { window.localStorage.setItem(GH_CACHE_KEY, r.value); } catch (e) {}
          return { key: k, value: r.value };
        }).catch(function (err) {
          try {
            var cached = window.localStorage.getItem(GH_CACHE_KEY);
            if (cached) return { key: k, value: cached };
          } catch (e) {}
          throw err;
        });
      },
      set: function (k, v) {
        var cfg = getGhConfig();
        if (!cfg || k !== STORAGE_KEY) return baseStore.set(k, v);
        try { window.localStorage.setItem(GH_CACHE_KEY, v); } catch (e) {}
        // PUT을 시도하기 전에 먼저 "아직 안 올라갔다"고 표시해둔다 — 이 시도가 실패로
        // 끝나면(그 사이 앱이 꺼지거나 오프라인이 되는 경우 포함) 이 표시가 남아있어서,
        // 다음에 GitHub에서 다시 읽어올 때 이 변경사항이 예전 것으로 취급되어 사라지지 않는다.
        try { window.localStorage.setItem(GH_PENDING_KEY, '1'); } catch (e) {}
        function markWritten() {
          try { window.localStorage.setItem(GH_CACHE_AT_KEY, String(Date.now())); } catch (e) {}
          try { window.localStorage.removeItem(GH_PENDING_KEY); } catch (e) {}
        }
        return queueGhWrite(function () {
          // ghSha는 메모리 변수라 새로고침/앱 재실행 시 null로 초기화되는데, "아직 못 올린
          // 변경사항이 있다(pending)" 표시 때문에 store.get()이 네트워크 조회를 건너뛰면
          // ghSha가 계속 null로 남는다. null인 채로 PUT하면 "파일이 이미 있는데 sha가
          // 없다"며 GitHub가 거부하고, 실패하니 pending도 안 꺼져서 — 영원히 같은 이유로
          // 실패만 반복하는 고리에 빠진다(실제로 겪은 사고). 그래서 쓰기 전에 ghSha가 없으면
          // 먼저 최신 sha만 확인해서 채워둔다.
          var ensureSha = ghSha ? Promise.resolve(ghSha) : ghGetData(cfg).then(function (r) { ghSha = r.sha; return ghSha; });
          return ensureSha.then(function () {
            return ghPutData(cfg, v, ghSha);
          }).then(function (sha) {
            ghSha = sha;
            markWritten();
            return { key: k, value: v };
          }).catch(function (err) {
            if (err.status === 409 || err.status === 422) {
              // sha가 어긋남(충돌) — 최신 sha로 다시 한 번만 시도. 쓰기가 이제 큐로 한 번에
              // 하나씩만 실행되므로, 남은 충돌 가능성은 사실상 다른 기기가 동시에 저장한
              // 경우뿐이라 재시도 한 번이면 충분하다.
              return ghGetData(cfg).then(function (r) {
                ghSha = r.sha;
                return ghPutData(cfg, v, ghSha).then(function (sha) { ghSha = sha; markWritten(); return { key: k, value: v }; });
              });
            }
            throw err;
          });
        });
      }
    };
  })();

// ===================================================================== [editor]
// =========================================================================
// 운동 편집기 — 세 가지 모드를 한 화면에서 처리
//   live    : 진행 중인 운동 (세트 완료 체크 · 휴식 타이머 · 경과 시간)
//   edit    : 지난 운동 추가/수정 (날짜·시작 시각·소요 시간 직접 입력)
//   routine : 루틴 편집 (목표 무게/횟수 템플릿)
// =========================================================================

// ---------- 진행 중인 운동 (이 기기 로컬에만 저장) ----------
var active = null;
function loadActive() {
  try {
    var raw = localStorage.getItem(ACTIVE_KEY);
    active = raw ? JSON.parse(raw) : null;
    if (active && !Array.isArray(active.exercises)) active = null;
  } catch (e) { active = null; }
}
function saveActive() {
  try {
    if (active) localStorage.setItem(ACTIVE_KEY, JSON.stringify(active));
    else localStorage.removeItem(ACTIVE_KEY);
  } catch (e) {}
}
function defaultWorkoutName(ms) {
  var h = new Date(ms || Date.now()).getHours();
  return (h < 5 ? '새벽' : h < 11 ? '아침' : h < 14 ? '점심' : h < 18 ? '오후' : '저녁') + ' 운동';
}
// usePrev: 루틴으로 시작할 때 각 세트 값을 그 종목의 지난 기록(같은 순번 세트)으로 채운다 —
// 루틴에 적어둔 무게가 예전 값이어도 지난번에 한 무게부터 바로 시작할 수 있게. 세트 종류(W/D/F)는 루틴을 따른다.
function liveBlocksFrom(blocks, usePrev) {
  return (blocks || []).map(function (b) {
    var sets = b.sets.length ? b.sets : [{ t: 'n' }];
    var prev = usePrev ? previousSets(b.exId, Date.now(), '') : null;
    return {
      exId: b.exId, note: b.note || '', rest: b.rest,
      sets: sets.map(function (s, i) {
        var c = cleanSet(s);
        var p = prevFor(prev, sets, i);
        if (p) ['w', 'r', 's', 'd'].forEach(function (k) { if (p[k] != null) c[k] = p[k]; else delete c[k]; });
        c.done = false;
        return c;
      })
    };
  });
}
// routine: 루틴으로 시작 / blocks: 지난 운동 구성 그대로 다시 하기
function startWorkout(routine, blocks, name) {
  function go() {
    active = {
      id: uid(), name: name || (routine ? routine.name : defaultWorkoutName()),
      routineId: routine ? routine.id : '', start: Date.now(), note: '',
      exercises: liveBlocksFrom(routine ? routine.exercises : blocks, !!routine && data.settings.prefillPrev),
      restEnd: 0, restTotal: 0
    };
    saveActive();
    openEditor('live');
  }
  if (active) {
    actionSheet('진행 중인 운동이 있습니다', [
      { label: '진행 중인 운동 이어하기', icon: 'play', onClick: function () { openEditor('live'); } },
      { label: '버리고 새로 시작', icon: 'trash', danger: true, onClick: go }
    ]);
  } else go();
}

// ---------- 열 정의 (종목 type별 입력 칸) ----------
var COLS = {
  wr: [{ k: 'w', h: 'kg', im: 'decimal' }, { k: 'r', h: '횟수', im: 'numeric' }],
  r: [{ k: 'r', h: '횟수', im: 'numeric' }],
  t: [{ k: 's', h: '초', im: 'numeric' }],
  dt: [{ k: 'd', h: 'km', im: 'decimal' }, { k: 'm', h: '분', im: 'decimal' }]
};
// 세트 입력 상한 (오타 방지) — k: w(kg) r(회) s(초) m(분) d(km)
var SET_LIMITS = { w: 500, r: 300, s: 36000, m: 600, d: 300 };
var SET_LIMIT_MSG = { w: '무게는 500kg까지 입력할 수 있어요', r: '횟수는 300회까지 입력할 수 있어요', s: '시간은 10시간(36000초)까지 입력할 수 있어요', m: '시간은 600분까지 입력할 수 있어요', d: '거리는 300km까지 입력할 수 있어요' };
function valOf(s, k) {
  if (!s) return '';
  if (k === 'm') return s.s != null ? Math.round(s.s / 6) / 10 : '';
  return s[k] != null ? s[k] : '';
}
function setVal(s, k, v) {
  if (k === 'm') { if (v == null) delete s.s; else s.s = Math.round(v * 60); }
  else if (v == null) delete s[k];
  else s[k] = v;
}
function fmtSetShort(s, type) {
  if (!s) return '—';
  if (type === 'r') return '×' + (s.r || 0);
  if (type === 't') return fmtDur(s.s);
  if (type === 'dt') return (s.d ? fmtNum(s.d) + 'km ' : '') + (s.s ? Math.round(s.s / 60) + '분' : '');
  return fmtNum(s.w || 0) + '×' + (s.r || 0);
}
function hasValue(s) { return !!(s.w || s.r || s.s || s.d); }
function setValid(s, type) {
  if (type === 'wr' || type === 'r') return s.r > 0;
  if (type === 't') return s.s > 0;
  return s.s > 0 || s.d > 0;
}

// ---------- 편집기 열기 ----------
function newPastWorkout(dateStr) {
  var start;
  if (dateStr) start = new Date(dateStr + 'T18:00').getTime();
  else { var d = new Date(); d.setMinutes(0, 0, 0); start = d.getTime() - 3600000; }
  return { id: uid(), name: defaultWorkoutName(start), routineId: '', start: start, end: start + 3600000, note: '', exercises: [] };
}
function openEditor(mode, src, opts) {
  opts = opts || {};
  var ed = { mode: mode, isNew: !src, dirty: false, opts: opts };
  if (mode === 'live') ed.obj = active;
  else if (mode === 'edit') ed.obj = src ? clone(src) : newPastWorkout(opts.date);
  else ed.obj = src ? clone(src) : { id: uid(), name: '', exercises: [] };
  var page = pushPage(function (el) { renderEditor(el, ed); });
  page.isLive = mode === 'live';
  if (mode !== 'live') {
    page.guard = function () {
      if (!ed.dirty) return false;
      confirmSheet('저장하지 않은 변경사항이 있습니다. 버릴까요?', '버리기', function () {
        page.forceClose = true; closePage();
      });
      return true;
    };
  }
  bindEditor(page.el, ed, page);
  refreshChrome();
  return page;
}

// ---------- 그리기 ----------
function renderEditor(el, ed) {
  var o = ed.obj, live = ed.mode === 'live', routine = ed.mode === 'routine';
  if (live && !active) { el.innerHTML = ''; return; }
  var title = live ? '운동 중' : routine ? (ed.isNew ? '새 루틴' : '루틴 편집') : (ed.isNew ? '지난 운동 추가' : '기록 수정');
  var right = '<button class="btn btn-primary btn-sm" data-e="' + (live ? 'finish' : 'save') + '">' + (live ? '완료' : '저장') + '</button>';
  var h = pageHeader({ backIcon: live ? 'down' : 'back', backAttr: 'data-e="back"', title: title, right: right });
  h += '<div class="page-body editor">';
  if (live) {
    h += '<div class="stats-bar"><div><small>시간</small><b class="js-elapsed">' + fmtTimer((Date.now() - o.start) / 1000) + '</b></div>' +
      '<div><small>볼륨</small><b class="js-vol">0kg</b></div><div><small>세트</small><b class="js-sets">0</b></div></div>';
  }
  h += '<input class="title-input" data-f="name" maxlength="40" value="' + esc(o.name) + '" placeholder="' + (routine ? '루틴 이름 (예: 상체 A)' : '운동 이름') + '">';
  if (ed.mode === 'edit') {
    var sd = new Date(o.start);
    h += '<div class="field-row">' +
      '<label class="field"><span>날짜</span><input type="date" class="input" data-f="date" value="' + fmtDate(sd) + '"></label>' +
      '<label class="field"><span>시작</span><input type="time" class="input" data-f="time" value="' + fmtClock(o.start) + '"></label>' +
      '<label class="field narrow"><span>소요(분)</span><input type="number" class="input" inputmode="numeric" data-f="dur" value="' + Math.round(workoutDuration(o) / 60) + '"></label></div>' +
      '<p class="warn-note js-future"' + (o.start > Date.now() ? '' : ' hidden') + '>오늘 이후의 날짜·시각이에요. 맞는지 확인해 주세요.</p>';
  }
  if (!routine) h += '<textarea class="note-input" data-f="note" rows="1" maxlength="1000" placeholder="메모 (선택)">' + esc(o.note || '') + '</textarea>';

  if (!o.exercises.length) {
    h += '<div class="empty">' + icon('dumbbell', 30) + '<p>' + (routine ? '루틴에 넣을 종목을 추가하세요' : '종목을 추가해 기록을 시작하세요') + '</p></div>';
  }
  o.exercises.forEach(function (b, i) { h += blockHtml(b, i, ed); });
  h += '<button class="btn btn-primary btn-block" data-e="add-ex">' + icon('plus', 18) + '종목 추가</button>';
  if (live) h += '<button class="btn btn-text-danger btn-block" data-e="discard">운동 취소</button>';
  else if (!ed.isNew) h += '<button class="btn btn-text-danger btn-block" data-e="delete">' + (routine ? '루틴 삭제' : '기록 삭제') + '</button>';
  h += '</div>';
  if (live) {
    h += '<div class="rest-bar js-restbar" hidden><div class="rest-progress js-restprog"></div>' +
      '<div class="rest-main">' + icon('clock', 16) + '<b class="js-resttime">0:00</b></div>' +
      '<button class="rest-btn" data-e="rest-minus">−15</button><button class="rest-btn" data-e="rest-plus">+15</button>' +
      '<button class="rest-btn strong" data-e="rest-skip">건너뛰기</button></div>';
  }
  el.innerHTML = h;
  autosize(el.querySelector('.note-input'));
  if (live) { updateStats(el, o); tickTimers(); }
}

// 메모 칸이 비어 있으면 지난번 메모를 회색 안내로 보여준다 (저장되지는 않음)
function notePlaceholder(exId, ed) {
  var n = lastNote(exId, ed.mode === 'routine' ? Infinity : ed.obj.start, ed.obj.id);
  return n ? '지난 메모: ' + n : '메모 추가';
}
function blockHtml(b, i, ed) {
  var live = ed.mode === 'live', o = ed.obj;
  var ex = exById(b.exId), type = ex ? ex.type : 'wr', cols = COLS[type];
  var prev = previousSets(b.exId, ed.mode === 'routine' ? Infinity : o.start, o.id);
  var grid = '34px minmax(0,1fr) ' + cols.map(function () { return '64px'; }).join(' ') + (live ? ' 40px' : '');
  var h = '<section class="block" data-b="' + i + '">' +
    '<div class="block-head"><button class="block-name" data-e="ex-detail">' + esc(ex ? ex.name : '(삭제된 종목)') + '</button>' +
    '<button class="icon-btn" data-e="block-menu" aria-label="종목 메뉴">' + icon('more', 20) + '</button></div>' +
    '<input class="block-note" data-bn maxlength="200" value="' + esc(b.note || '') + '" placeholder="' + esc(notePlaceholder(b.exId, ed)) + '">';
  if (ed.mode !== 'edit') {
    var rest = b.rest != null ? b.rest : data.settings.rest;
    h += '<button class="rest-chip" data-e="rest">' + icon('clock', 14) + '휴식 ' + fmtRest(rest) + (b.rest == null ? ' (기본)' : '') + '</button>';
  }
  h += '<div class="set-table">' +
    '<div class="set-row head" style="grid-template-columns:' + grid + '"><span>세트</span><span>이전</span>' +
    cols.map(function (c) { return '<span>' + c.h + '</span>'; }).join('') + (live ? '<span>' + icon('check', 14) + '</span>' : '') + '</div>';
  var workNo = 0;
  b.sets.forEach(function (s, j) {
    if (s.t !== 'w') workNo++;
    var badge = setBadge(s.t, workNo);
    var p = prevFor(prev, b.sets, j);
    h += '<div class="set-row' + (s.done ? ' done' : '') + '" data-s="' + j + '" style="grid-template-columns:' + grid + '">' +
      '<button class="set-badge t-' + s.t + '" data-e="set-type">' + badge + '</button>' +
      '<button class="prev" data-e="fill-prev"' + (p ? '' : ' disabled') + '>' + (s.pr ? icon('trophy', 13) : '') + esc(fmtSetShort(p, type)) + '</button>' +
      cols.map(function (c) {
        return '<input class="set-input" data-k="' + c.k + '" type="number" inputmode="' + c.im + '" step="any" min="0" value="' + valOf(s, c.k) + '" placeholder="' + (p ? valOf(p, c.k) : '') + '">';
      }).join('') +
      (live ? '<button class="check' + (s.done ? ' on' : '') + '" data-e="check" aria-label="세트 완료">' + icon('check', 16) + '</button>' : '') +
      '</div>';
  });
  h += '</div><button class="add-set" data-e="add-set">' + icon('plus', 15) + '세트 추가</button></section>';
  return h;
}

function autosize(ta) {
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.max(40, ta.scrollHeight) + 'px';
}
function liveTotals(o) {
  var vol = 0, sets = 0;
  o.exercises.forEach(function (b) {
    b.sets.forEach(function (s) { if (s.done) { sets++; vol += setVolume(s); } });
  });
  return { vol: vol, sets: sets };
}
function updateStats(el, o) {
  var t = liveTotals(o);
  var v = el.querySelector('.js-vol'), s = el.querySelector('.js-sets');
  if (v) v.textContent = fmtNum(t.vol) + 'kg';
  if (s) s.textContent = t.sets;
}

// ---------- 이벤트 ----------
function bindEditor(el, ed, page) {
  var o = ed.obj;
  function changed() {
    ed.dirty = true;
    if (ed.mode === 'live') { saveActive(); updateStats(el, o); }
  }
  function rerender() { page.render(); }
  function ctx(target) {
    var bEl = target.closest('[data-b]'), sEl = target.closest('[data-s]');
    var b = bEl ? o.exercises[Number(bEl.getAttribute('data-b'))] : null;
    return { bi: bEl ? Number(bEl.getAttribute('data-b')) : -1, b: b, j: sEl ? Number(sEl.getAttribute('data-s')) : -1, row: sEl };
  }

  el.addEventListener('input', function (e) {
    var t = e.target;
    var f = t.getAttribute('data-f');
    if (f === 'name') o.name = t.value;
    else if (f === 'note') { o.note = t.value; autosize(t); }
    else if (f === 'date' || f === 'time' || f === 'dur') {
      var dateV = el.querySelector('[data-f="date"]').value, timeV = el.querySelector('[data-f="time"]').value || '18:00';
      var dur = Math.max(0, Math.min(1440, Number(el.querySelector('[data-f="dur"]').value) || 0));
      var st = new Date(dateV + 'T' + timeV).getTime();
      if (isFinite(st)) { o.start = st; o.end = st + dur * 60000; }
      var fn = el.querySelector('.js-future');
      if (fn) fn.hidden = !(o.start > Date.now());
    } else if (t.hasAttribute('data-bn')) {
      ctx(t).b.note = t.value;
    } else if (t.hasAttribute('data-k')) {
      var c = ctx(t), s = c.b.sets[c.j], k = t.getAttribute('data-k');
      var v = num(t.value);
      if (v != null && v > SET_LIMITS[k]) v = SET_LIMITS[k];
      setVal(s, k, v != null && v >= 0 ? v : null);
    } else return;
    changed();
  });
  // 입력칸을 벗어나면 실제 저장된 값으로 다시 표시 — 음수·범위 밖 값이 화면에만 남아 있지 않게
  el.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-k');
    if (!k) return;
    var c = ctx(t), s = c.b.sets[c.j];
    var shown = num(t.value), stored = valOf(s, k);
    if (String(stored) !== String(t.value)) {
      t.value = stored;
      if (shown != null && shown > SET_LIMITS[k]) toast(SET_LIMIT_MSG[k]);
      else if (shown != null && shown < 0) toast('0 이상의 값을 입력하세요');
    }
  });

  el.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-e]');
    if (!btn || btn.disabled) return;
    var act = btn.getAttribute('data-e');
    var c = ctx(btn);
    switch (act) {
      case 'back': closePage(); break;
      case 'finish': finishLive(el, ed); break;
      case 'save': ed.mode === 'routine' ? saveRoutine(ed, page) : saveEdited(ed, page); break;
      case 'discard':
        confirmSheet('운동을 취소할까요? 이번 기록은 저장되지 않습니다.', '운동 취소', function () {
          active = null; saveActive(); closePage();
        });
        break;
      case 'delete':
        confirmSheet(ed.mode === 'routine' ? '이 루틴을 삭제할까요?' : '이 운동 기록을 삭제할까요?', '삭제', function () {
          var list = ed.mode === 'routine' ? data.routines : data.workouts;
          var idx = list.findIndex(function (x) { return x.id === o.id; });
          if (idx >= 0) list.splice(idx, 1);
          save();
          page.forceClose = true;
          closePage(ed.opts.closeCount || 1, function () { toast('삭제했습니다'); });
        });
        break;
      case 'add-ex':
        openPicker({
          multi: true,
          onPick: function (ids) {
            ids.forEach(function (id) { o.exercises.push(newBlock(id, ed)); });
            changed();
          }
        });
        break;
      case 'ex-detail': if (exById(c.b.exId)) openExerciseDetail(c.b.exId); break;
      case 'block-menu': blockMenu(c.bi, ed, changed, rerender); break;
      case 'rest':
        var cur = c.b.rest;
        actionSheet('휴식 타이머', [{ label: '기본값 따르기 (' + fmtRest(data.settings.rest) + ')', active: cur == null, onClick: function () { c.b.rest = null; changed(); rerender(); } }]
          .concat(REST_OPTIONS.map(function (sec) {
            return { label: fmtRest(sec), active: cur === sec, onClick: function () { c.b.rest = sec; changed(); rerender(); } };
          })));
        break;
      case 'set-type':
        var s0 = c.b.sets[c.j];
        actionSheet(c.j + 1 + '번째 세트', SET_TYPES.map(function (t) {
          return { label: t.label + (t.badge ? ' (' + t.badge + ')' : ''), active: s0.t === t.key, onClick: function () { s0.t = t.key; changed(); rerender(); } };
        }).concat([{ label: '세트 삭제', icon: 'trash', danger: true, onClick: function () { c.b.sets.splice(c.j, 1); changed(); rerender(); } }]));
        break;
      case 'fill-prev':
        var prev = previousSets(c.b.exId, ed.mode === 'routine' ? Infinity : o.start, o.id);
        var p = prevFor(prev, c.b.sets, c.j);
        if (p) {
          var tgt = c.b.sets[c.j];
          ['w', 'r', 's', 'd'].forEach(function (k) { if (p[k] != null) tgt[k] = p[k]; });
          changed(); rerender();
        }
        break;
      case 'add-set':
        var last = c.b.sets[c.b.sets.length - 1];
        var ns = { t: last && last.t !== 'w' ? last.t : 'n' };
        if (last) ['w', 'r', 's', 'd'].forEach(function (k) { if (last[k] != null) ns[k] = last[k]; });
        if (ed.mode === 'live') ns.done = false;
        c.b.sets.push(ns);
        changed(); rerender();
        break;
      case 'check': toggleCheck(c, ed, el, changed); break;
      case 'rest-minus': adjustRest(-15); break;
      case 'rest-plus': adjustRest(15); break;
      case 'rest-skip': stopRest(); break;
    }
  });
}

function newBlock(exId, ed) {
  var prev = previousSets(exId, ed.mode === 'routine' ? Infinity : ed.obj.start, ed.obj.id);
  var n = prev ? prev.length : (ed.mode === 'routine' ? 3 : 1);
  var sets = [];
  for (var i = 0; i < n; i++) {
    var s = { t: prev ? prev[i].t : 'n' };
    if (ed.mode === 'routine' && prev) ['w', 'r', 's', 'd'].forEach(function (k) { if (prev[i][k] != null) s[k] = prev[i][k]; });
    if (ed.mode === 'live') s.done = false;
    sets.push(s);
  }
  return { exId: exId, note: '', rest: null, sets: sets };
}

function blockMenu(bi, ed, changed, rerender) {
  var list = ed.obj.exercises;
  var items = [];
  var prev = previousSets(list[bi].exId, ed.mode === 'routine' ? Infinity : ed.obj.start, ed.obj.id);
  if (prev && prev.length) {
    items.push({ label: '빈 칸을 지난 기록으로 채우기', icon: 'copy', onClick: function () {
      fillFromPrev(list[bi], prev, ed.mode === 'live');
      changed(); rerender();
    } });
  }
  items.push(
    { label: '종목 교체', icon: 'swap', onClick: function () {
      openPicker({ multi: false, title: '종목 교체', onPick: function (ids) { list[bi].exId = ids[0]; changed(); } });
    } }
  );
  if (bi > 0) items.push({ label: '위로 이동', icon: 'up', onClick: function () { list.splice(bi - 1, 0, list.splice(bi, 1)[0]); changed(); rerender(); } });
  if (bi < list.length - 1) items.push({ label: '아래로 이동', icon: 'dn', onClick: function () { list.splice(bi + 1, 0, list.splice(bi, 1)[0]); changed(); rerender(); } });
  items.push({ label: '종목 삭제', icon: 'trash', danger: true, onClick: function () { list.splice(bi, 1); changed(); rerender(); } });
  actionSheet(exName(list[bi].exId), items);
}

// 지난 기록과 세트 수를 맞추고(모자라면 추가), 비어 있는 칸만 지난 값으로 채운다 — 직접 입력한 값은 그대로 둔다
function fillFromPrev(b, prev, live) {
  while (b.sets.length < prev.length) {
    var ns = { t: prev[b.sets.length].t };
    if (live) ns.done = false;
    b.sets.push(ns);
  }
  b.sets.forEach(function (s, j) {
    var p = prevFor(prev, b.sets, j);
    if (p) ['w', 'r', 's', 'd'].forEach(function (k) { if (s[k] == null && p[k] != null) s[k] = p[k]; });
  });
}
function toggleCheck(c, ed, el, changed) {
  var o = ed.obj, s = c.b.sets[c.j], type = exType(c.b.exId);
  if (s.done) {
    s.done = false; delete s.pr;
  } else {
    // 비어 있는 칸은 이전 기록(placeholder) 값으로 채운다 — 같은 무게로 반복할 때 바로 체크만 하면 되게
    var prev = previousSets(c.b.exId, o.start, o.id);
    var p = prevFor(prev, c.b.sets, c.j);
    COLS[type].forEach(function (col) {
      var k = col.k === 'm' ? 's' : col.k;
      if (s[k] == null && p && p[k] != null) s[k] = p[k];
    });
    if (!setValid(s, type)) {
      toast(type === 't' ? '시간을 입력하세요' : type === 'dt' ? '거리나 시간을 입력하세요' : '횟수를 입력하세요');
      return;
    }
    s.done = true;
    // PR 판정 — 이전 기록이 있는 종목만 (처음 하는 종목은 표시 안 함)
    if (isWork(s)) {
      var hist = bestBefore(c.b.exId, o.start, o.id);
      var cur = 0, curW = 0;
      o.exercises.forEach(function (b) {
        if (b.exId !== c.b.exId) return;
        b.sets.forEach(function (x) { if (x !== s && x.done && isWork(x)) { cur = Math.max(cur, setScore(x, type)); curW = Math.max(curW, x.w || 0); } });
      });
      var sc = setScore(s, type);
      var isPr = hist.score > 0 && (sc > Math.max(hist.score, cur) || (type === 'wr' && (s.w || 0) > Math.max(hist.w, curW)));
      if (isPr) { s.pr = true; toast('🏆 개인 기록! ' + exName(c.b.exId) + ' ' + fmtSet(s, type), 3000); }
    }
    var rest = c.b.rest != null ? c.b.rest : data.settings.rest;
    if (rest > 0) startRest(rest);
  }
  changed();
  // 행만 다시 그리기 (포커스/스크롤 유지)
  var row = c.row;
  row.classList.toggle('done', !!s.done);
  row.querySelector('.check').classList.toggle('on', !!s.done);
  COLS[type].forEach(function (col) { var inp = row.querySelector('[data-k="' + col.k + '"]'); if (inp) inp.value = valOf(s, col.k); });
  var pv = row.querySelector('.prev');
  var prevS = previousSets(c.b.exId, o.start, o.id);
  pv.innerHTML = (s.pr ? icon('trophy', 13) : '') + esc(fmtSetShort(prevFor(prevS, c.b.sets, c.j), type));
}

// ---------- 휴식 타이머 ----------
function startRest(sec) {
  if (!active) return;
  active.restEnd = Date.now() + sec * 1000;
  active.restTotal = sec;
  saveActive();
  tickTimers();
}
function adjustRest(delta) {
  if (!active || !active.restEnd) return;
  active.restEnd += delta * 1000;
  active.restTotal = Math.max(1, active.restTotal + delta);
  if (active.restEnd <= Date.now()) { stopRest(); return; }
  saveActive(); tickTimers();
}
function stopRest() {
  if (!active) return;
  active.restEnd = 0; saveActive(); tickTimers();
}
function tickTimers() {
  var now = Date.now();
  var els = document.querySelectorAll('.js-elapsed');
  for (var i = 0; i < els.length; i++) els[i].textContent = active ? fmtTimer((now - active.start) / 1000) : '0:00';
  var resting = !!(active && active.restEnd);
  var remain = resting ? (active.restEnd - now) / 1000 : 0;
  if (resting && remain <= 0) {
    active.restEnd = 0; saveActive(); resting = false;
    restAlert();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.js-restbar'), function (b) { b.hidden = !resting; });
  Array.prototype.forEach.call(document.querySelectorAll('.js-resttime'), function (t) { t.textContent = fmtTimer(Math.ceil(remain)); });
  Array.prototype.forEach.call(document.querySelectorAll('.js-restprog'), function (p) {
    p.style.width = resting ? Math.max(0, Math.min(100, remain / active.restTotal * 100)) + '%' : '0';
  });
}
var audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep() {
  if (!audioCtx) return;
  try {
    [0, 0.25, 0.5].forEach(function (t) {
      var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.frequency.value = 880; osc.connect(g); g.connect(audioCtx.destination);
      var at = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
      osc.start(at); osc.stop(at + 0.2);
    });
  } catch (e) {}
}
function restAlert() {
  if (data.settings.sound) beep();
  if (data.settings.vibrate && navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
  toast('휴식 끝! 다음 세트를 시작하세요');
}

// ---------- 저장 ----------
function structureChanged(routine, blocks) {
  if (routine.exercises.length !== blocks.length) return true;
  return routine.exercises.some(function (b, i) { return b.exId !== blocks[i].exId || b.sets.length !== blocks[i].sets.length; });
}
function finishLive(el, ed) {
  var o = ed.obj;
  var done = 0, skipped = 0;
  o.exercises.forEach(function (b) { b.sets.forEach(function (s) { if (s.done) done++; else if (hasValue(s)) skipped++; }); });
  if (!done) {
    toast('완료(✓) 체크한 세트가 없습니다');
    return;
  }
  var blocks = o.exercises.map(function (b) {
    return { exId: b.exId, note: (b.note || '').trim(), rest: b.rest, sets: b.sets.filter(function (s) { return s.done; }).map(cleanSet) };
  }).filter(function (b) { return b.sets.length && exById(b.exId); });
  var routine = o.routineId ? data.routines.find(function (r) { return r.id === o.routineId; }) : null;
  var t = liveTotals(o);
  var elapsedMin = Math.max(1, Math.round((Date.now() - o.start) / 60000));
  var h = '<div class="sheet-title">운동 완료</div>' +
    '<div class="finish-stats"><div><small>시간</small><b>' + fmtDur((Date.now() - o.start) / 1000) + '</b></div>' +
    '<div><small>볼륨</small><b>' + fmtNum(t.vol) + 'kg</b></div><div><small>세트</small><b>' + t.sets + '</b></div></div>' +
    '<div class="field-row"><label class="field"><span>운동 이름</span><input class="input" id="fin-name" maxlength="40" value="' + esc(o.name) + '"></label>' +
    '<label class="field narrow"><span>소요(분)</span><input class="input" id="fin-dur" type="number" inputmode="numeric" min="0" max="1440" value="' + elapsedMin + '"></label></div>' +
    (elapsedMin > 180 ? '<p class="warn-note">시작한 지 3시간이 넘었어요. 운동을 마친 시간에 맞게 소요 시간을 고쳐 주세요.</p>' : '') +
    (skipped ? '<p class="sheet-note">완료 체크하지 않은 세트 ' + skipped + '개는 저장되지 않아요.</p>' : '') +
    (routine
      ? '<label class="check-line"><input type="checkbox" id="fin-routine"' + (structureChanged(routine, o.exercises) ? ' checked' : '') + '><span>루틴 ‘' + esc(routine.name) + '’에 이번 구성·무게 반영</span></label>'
      : '<label class="check-line"><input type="checkbox" id="fin-routine"><span>이 구성을 새 루틴으로도 저장</span></label>') +
    '<div class="sheet-row"><button class="btn btn-secondary" data-c="0">계속 운동</button><button class="btn btn-primary" data-c="1">저장</button></div>';
  showSheet(h, function (box) {
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-c]');
      if (!b) return;
      if (b.getAttribute('data-c') === '0') { hideSheet(); return; }
      var name = box.querySelector('#fin-name').value.trim() || defaultWorkoutName(o.start);
      var toRoutine = box.querySelector('#fin-routine').checked;
      var durMin = Math.max(0, Math.min(1440, Math.round(Number(box.querySelector('#fin-dur').value) || 0)));
      hideSheet();
      var w = { id: o.id, name: name, routineId: o.routineId || '', start: o.start, end: o.start + durMin * 60000, note: (o.note || '').trim(), exercises: blocks };
      data.workouts.push(w);
      if (toRoutine) {
        // 루틴에는 편집기에 보이는 구성 그대로(이번에 건너뛴 종목·세트 포함) 반영한다 — 하루 빼먹었다고 루틴에서 사라지지 않게
        var tpl = o.exercises.filter(function (b) { return exById(b.exId); }).map(function (b) {
          return { exId: b.exId, note: (b.note || '').trim(), rest: b.rest, sets: b.sets.map(cleanSet) };
        });
        if (routine) routine.exercises = tpl;
        else { var nr = { id: uid(), name: name, exercises: tpl }; data.routines.push(nr); w.routineId = nr.id; }
      }
      active = null; saveActive();
      save();
      closePage(1, function () {
        switchTab('history');
        openWorkoutDetail(w.id);
        toast('운동을 저장했습니다 💪');
      });
    });
  });
}
function saveEdited(ed, page, ghost) {
  var o = ed.obj;
  // 회색 글자(지난 기록)만 보이고 실제로는 비어 있는 세트 — 그냥 저장하면 빠지므로 먼저 물어본다
  if (ghost == null) {
    var ghosts = 0;
    o.exercises.forEach(function (b) {
      var prev = previousSets(b.exId, o.start, o.id);
      b.sets.forEach(function (st, j) { var p = prevFor(prev, b.sets, j); if (!hasValue(st) && p && hasValue(p)) ghosts++; });
    });
    if (ghosts) {
      actionSheet('회색으로 보이는 지난 기록 ' + ghosts + '세트가 비어 있어요', [
        { label: '지난 값으로 채워서 저장', icon: 'copy', onClick: function () { saveEdited(ed, page, true); } },
        { label: '직접 입력한 세트만 저장', icon: 'check', onClick: function () { saveEdited(ed, page, false); } }
      ]);
      return;
    }
  }
  if (ghost) o.exercises.forEach(function (b) {
    var prev = previousSets(b.exId, o.start, o.id);
    b.sets.forEach(function (st, j) {
      var p = prevFor(prev, b.sets, j);
      if (!hasValue(st) && p) ['w', 'r', 's', 'd'].forEach(function (k) { if (p[k] != null) st[k] = p[k]; });
    });
  });
  var blocks = o.exercises.map(function (b) {
    return { exId: b.exId, note: (b.note || '').trim(), rest: b.rest, sets: b.sets.filter(hasValue).map(cleanSet) };
  }).filter(function (b) { return b.sets.length && exById(b.exId); });
  if (!blocks.length) { toast('세트를 하나 이상 입력하세요'); return; }
  var w = { id: o.id, name: (o.name || '').trim() || defaultWorkoutName(o.start), routineId: o.routineId || '', start: o.start, end: Math.max(o.start, o.end), note: (o.note || '').trim(), exercises: blocks };
  var idx = data.workouts.findIndex(function (x) { return x.id === w.id; });
  if (idx >= 0) data.workouts[idx] = w; else data.workouts.push(w);
  save();

function normName(v) { return String(v || '').toLowerCase().replace(/\s+/g, ''); }
function lastUsedMap() {
  var m = {};
  data.workouts.forEach(function (w) { w.exercises.forEach(function (b) { if (!m[b.exId] || m[b.exId] < w.start) m[b.exId] = w.start; }); });

}
function filterExercises(q, muscle) {

  return data.exercises.filter(function (e) {
    return (!muscle || e.muscle === muscle) && (!nq || normName(e.name).indexOf(nq) >= 0);
  }).sort(function (a, b) {

// opts: { multi, title, onPick(ids) }

function renderPickerList(el, st, opts) {

// 종목 삭제 — 기록에 쓰인 종목은 지울 수 없고, 루틴에서는 함께 빠진다
function deleteExercise(ex, onDone) {
  var used = exerciseUseCount(ex.id), inRoutine = routineUseCount(ex.id);
  if (used) { toast('운동 기록 ' + used + '개에 쓰인 종목이라 삭제할 수 없어요', 3000); return; }
  confirmSheet('\u2018' + ex.name + '\u2019 종목을 삭제할까요?' + (inRoutine ? ' 루틴 ' + inRoutine + '개에서도 빠집니다.' : ''), '삭제', function () {
    data.routines.forEach(function (r) { r.exercises = r.exercises.filter(function (b) { return b.exId !== ex.id; }); });
    data.exercises = data.exercises.filter(function (e2) { return e2.id !== ex.id; });
    save();
    if (onDone) onDone();

}
// 종목 만들기/수정 시트. ex가 있으면 수정, 없으면 새로 만들기
function openExerciseForm(ex, presetName, onSaved, presetMuscle) {
  var used = ex ? exerciseUseCount(ex.id) : 0;
  var inRoutine = ex ? routineUseCount(ex.id) : 0;
  var cur = { muscle: ex ? ex.muscle : (presetMuscle || ''), type: ex ? ex.type : 'wr' };
  function chips(list, key, labels) {
    return list.map(function (v) {
      var dis = key === 'type' && used > 0 && v !== cur.type;
      return '<button class="chip' + (cur[key] === v ? ' on' : '') + '" data-' + key + '="' + v + '"' + (dis ? ' disabled' : '') + '>' + (labels ? labels[v] : v) + '</button>';
    }).join('');
  }
  var h = '<div class="sheet-title">' + (ex ? '종목 수정' : '새 종목') + '</div>' +
    '<label class="field"><span>이름</span><input class="input" id="exf-name" maxlength="40" placeholder="예: 벤치프레스" value="' + esc(ex ? ex.name : presetName || '') + '"></label>' +
    '<div class="field"><span>부위</span><div class="chips wrap js-muscle">' + chips(MUSCLES, 'muscle') + '</div></div>' +
    '<div class="field"><span>기록 방식</span><div class="chips wrap js-type">' + chips(Object.keys(TYPES), 'type', TYPES) + '</div>' +
    (used ? '<small class="field-note">기록이 있는 종목이라 기록 방식은 바꿀 수 없어요.</small>' : '') + '</div>' +
    '<p class="sheet-note js-exf-err" hidden></p>' +
    '<div class="sheet-row"><button class="btn btn-secondary" data-x="cancel">취소</button><button class="btn btn-primary" data-x="save">' + (ex ? '저장' : '만들기') + '</button></div>' +
    (ex ? '<button class="btn btn-text-danger btn-block" data-x="delete">종목 삭제</button>' : '');
  showSheet(h, function (box) {
    var err = box.querySelector('.js-exf-err');
    function fail(msg) { err.textContent = msg; err.hidden = false; }
    box.addEventListener('click', function (e) {
      var m = e.target.closest('[data-muscle]'), t = e.target.closest('[data-type]'), x = e.target.closest('[data-x]');
      if (m) { cur.muscle = m.getAttribute('data-muscle'); box.querySelector('.js-muscle').innerHTML = chips(MUSCLES, 'muscle'); return; }
      if (t && !t.disabled) { cur.type = t.getAttribute('data-type'); box.querySelector('.js-type').innerHTML = chips(Object.keys(TYPES), 'type', TYPES); return; }
      if (!x) return;
      var act = x.getAttribute('data-x');
      if (act === 'cancel') { hideSheet(); return; }
      if (act === 'delete') {
        if (used) { fail('운동 기록 ' + used + '개에 쓰인 종목이라 삭제할 수 없어요. 이름은 바꿀 수 있어요.'); return; }

        deleteExercise(ex, function () { if (onSaved) onSaved(null); });

      if (!cur.muscle) { fail('부위를 선택하세요.'); return; }
      var dup = data.exercises.some(function (e2) { return (!ex || e2.id !== ex.id) && normName(e2.name) === normName(name); });
      if (dup) { fail('같은 이름의 종목이 이미 있어요.'); return; }
      var target = ex;

      else { target = { id: uid(), name: name, muscle: cur.muscle, type: cur.type }; data.exercises.push(target); }
      save();
      hideSheet();
      if (onSaved) onSaved(target);

    if (!ex && !presetName) setTimeout(function () { nameInp.focus(); }, 250);
  });

// ---------- 운동 탭 ----------
// 즐겨찾기 켜고 끄기 — 카드가 목록 위/아래로 자리를 옮기므로 화면도 그 카드를 따라간다
function toggleRoutineFav(r, page) {
  r.fav = !r.fav; save(); refreshTab();
  if (page) page.render();
  else {
    var card = document.querySelector('.card.routine[data-rid="' + r.id + '"]');
    if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  toast(r.fav ? '즐겨찾기에 추가했어요' : '즐겨찾기에서 뺐어요');
}
// 루틴 종목 한 줄 요약: "4세트 · 50–55kg × 8–10" (워밍업 제외, 값이 없으면 세트 수만)
function routineSummary(b) {
  var type = exType(b.exId), ws = b.sets.filter(isWork), warm = b.sets.length - ws.length;
  function range(vals, f) {
    vals = vals.filter(function (v) { return v != null; });
    if (!vals.length) return '';
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    return lo === hi ? f(lo) : f(lo) + '–' + f(hi);
  }
  var head = (warm ? 'W' + warm + ' + ' : '') + ws.length + '세트';
  var val = '';
  if (type === 'wr') {
    var wv = range(ws.map(function (x) { return x.w; }), fmtNum), rv = range(ws.map(function (x) { return x.r; }), String);
    val = wv && rv ? wv + 'kg × ' + rv : wv ? wv + 'kg' : rv ? rv + '회' : '';
  } else if (type === 'r') val = range(ws.map(function (x) { return x.r; }), function (v) { return v + '회'; });
  else if (type === 't') val = range(ws.map(function (x) { return x.s; }), fmtDur);
  else val = range(ws.map(function (x) { return x.d; }), function (v) { return fmtNum(v) + 'km'; }) || range(ws.map(function (x) { return x.s; }), fmtDur);
  return val ? head + ' · ' + val : head;
}
// 루틴 ⋯ 메뉴 — 운동 탭 카드와 루틴 상세에서 같이 쓴다 (page: 상세에서 열었을 때)

// 루틴 상세 — 시작하지 않고도 어떤 종목을 어떻게 하는지(세트·무게·휴식·메모, 지난 기록) 확인

  return d.getTime();
}

  } else if (!list.length) {

  var lastMonth = '';

  }

function workoutCardHtml(w) {
  var prs = workoutPRs(w);
  var h = '<button class="card workout" data-a="open-workout" data-wid="' + w.id + '">' +
    '<div class="card-head"><b>' + esc(w.name) + '</b><small class="muted">' + fmtKoDate(w.start) + '</small></div>' +

    '<div class="wk-lines">';

    var type = exType(b.exId), best = bestSet(b.sets, type);
    h += '<div class="wk-line"><span>' + b.sets.length + ' × ' + esc(exName(b.exId)) + '</span><span class="muted">' + (best ? esc(fmtSet(best, type)) : '') + '</span></div>';

// 이 운동에서 세운 PR — 그 이전 운동들의 최고 기록과 비교
function workoutPRs(w) {
  var marks = {}, count = 0;
  w.exercises.forEach(function (b, bi) {
    var type = exType(b.exId), hist = bestBefore(b.exId, w.start, w.id);
    if (!hist.score) return;
    var bs = hist.score, bw = hist.w;
    b.sets.forEach(function (s, si) {
      if (!isWork(s)) return;
      var sc = setScore(s, type);
      if (sc > bs || (type === 'wr' && (s.w || 0) > bw)) { marks[bi + ':' + si] = true; count++; }
      bs = Math.max(bs, sc); if (type === 'wr') bw = Math.max(bw, s.w || 0);
    });
  });
  return { marks: marks, count: count };
}
function weeklyChart() {
  var ws = weekStart(Date.now()), W = 7 * 86400000, weeks = [];
  for (var i = 11; i >= 0; i--) weeks.push({ start: ws - i * W, vol: 0 });
  data.workouts.forEach(function (w) {
    var k = weekStart(w.start);
    weeks.forEach(function (x) { if (x.start === k) x.vol += workoutVolume(w); });
  });
  var max = Math.max.apply(null, weeks.map(function (x) { return x.vol; })) || 1;
  var bw = 100 / 12;
  var bars = weeks.map(function (x, i) {
    var hgt = x.vol ? Math.max(3, x.vol / max * 100) : 0;
    var d0 = new Date(x.start);
    return '<button class="bar-col" data-a="wk-jump" data-ws="' + x.start + '" aria-label="' + (d0.getMonth() + 1) + '월 ' + d0.getDate() + '일 주 ' + fmtNum(x.vol) + 'kg, 이 주 보기">' +
      '<div class="bar' + (i === 11 ? ' now' : '') + (x.start === (weekCursor || ws) ? ' sel' : '') + '" style="height:' + hgt + '%" title="' + fmtNum(x.vol) + 'kg"></div></button>';
  }).join('');
  var labels = weeks.map(function (x, i) {
    var d = new Date(x.start);
    return '<span>' + (i % 3 === 0 || i === 11 ? (d.getMonth() + 1) + '/' + d.getDate() : '') + '</span>';
  }).join('');
  return '<div class="bars-wrap"><div class="bars-max">' + fmtNum(max === 1 && !weeks.some(function (x) { return x.vol; }) ? 0 : max) + 'kg</div><div class="bars">' + bars + '</div><div class="bar-labels">' + labels + '</div></div>';
}
// ---------- 주간 막대 (요일별) — 옆으로 넘겨 주 단위 이동, 막대를 누르면 그날 기록으로 ----------
var weekCursor = null;   // 보고 있는 주의 월요일 0시 (null이면 이번 주)
function fmtVolShort(v) { return v >= 1000 ? (Math.round(v / 100) / 10) + 't' : Math.round(v) + 'kg'; }
function dayChartHtml() {
  var cur = weekStart(Date.now()), ws = weekCursor || cur, DAY = 86400000;
  var days = [];
  for (var i = 0; i < 7; i++) {

    if (x.list.length) {

        '<span class="dval">' + fmtVolShort(x.vol) + '</span><span class="dbar-wrap"><span class="dbar" style="height:' + hgt + '%"></span></span>' + lab + '</button>';

function lineChart(pts, unit) {
  if (pts.length < 2) return '<p class="hint">기록이 2회 이상 쌓이면 추이 그래프가 보여요.' + (pts.length ? ' (현재 ' + fmtNum(pts[0].v) + unit + ')' : '') + '</p>';
  var W = 320, H = 150, P = 8;
  var vs = pts.map(function (p) { return p.v; });
  var min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
  if (max === min) { max += 1; min = Math.max(0, min - 1); }
  var t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  var xy = pts.map(function (p) {
    var x = P + (t1 === t0 ? 0 : (p.t - t0) / (t1 - t0)) * (W - 2 * P);
    var y = P + (1 - (p.v - min) / (max - min)) * (H - 2 * P);
    return [x.toFixed(1), y.toFixed(1)];
  });
  var fmtV = function (v) { return unit === '초' ? fmtDur(v) : fmtNum(v) + unit; };
  return '<div class="chart"><div class="chart-y"><span>' + fmtV(max) + '</span><span>' + fmtV(min) + '</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="chart-svg">' +
    '<polyline points="' + xy.map(function (p) { return p.join(','); }).join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '</svg><div class="chart-dots">' + xy.map(function (p) { return '<i style="left:' + (p[0] / W * 100) + '%;top:' + (p[1] / H * 100) + '%"></i>'; }).join('') + '</div>' +
    '<div class="chart-x"><span>' + fmtKoDate(t0) + '</span><span>' + fmtKoDate(t1) + '</span></div></div>';
}

function hasAnyData(d) { return d.workouts.length || d.exercises.length || d.routines.length; }
async function ghConnect() {
  var cfg = {
    owner: $('gh-owner').value.trim(), repo: $('gh-repo').value.trim(),
    branch: $('gh-branch').value.trim() || 'main', token: $('gh-token').value.trim()
  };

  show('연결 확인 중...');
  try {
    var test = await ghTestConnection(cfg);
    cfg.tokenExpiresAt = test.tokenExpiresAt || null;
    var remote = await ghGetData(cfg);
    var finish = async function (useRemote) {
      setGhConfig(cfg);
      ghSha = remote.sha;
      try { localStorage.removeItem(GH_PENDING_KEY); localStorage.removeItem(GH_CACHE_AT_KEY); } catch (e) {}
      if (useRemote) {
        data = normalize(JSON.parse(remote.value));
        try { localStorage.setItem(GH_CACHE_KEY, remote.value); } catch (e) {}
        applyTheme();
      } else {
        await persist();
      }
      toast('GitHub에 연결했습니다');
      refreshTab();
    };
    if (remote.value && hasAnyData(data)) {
      actionSheet('GitHub에 이미 데이터가 있습니다', [
        { label: 'GitHub 데이터 불러오기 (이 기기 데이터 대체)', icon: 'refresh', onClick: function () { finish(true).catch(function (e) { show(e.message); }); } },
        { label: '이 기기 데이터로 GitHub 덮어쓰기', icon: 'up', danger: true, onClick: function () { finish(false).catch(function (e) { show(e.message); }); } }
      ]);
    } else {
      await finish(!!remote.value);
    }
  } catch (e) { show(e.message || '연결에 실패했습니다.'); }
}
function exportData() {

  try {

    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));

// 백업 합치기 — 지금 데이터는 그대로 두고 파일에만 있는 것을 더한다. 설정은 지금 것을 유지.
//   종목: 같은 id 또는 같은 이름(공백·대소문자 무시)이면 기존 종목으로 연결, 없으면 추가
//   운동: 같은 id이거나, 시작 시각(분 단위)과 내용이 같으면 이미 있는 것으로 보고 건너뜀
//   루틴: 같은 id나 같은 이름이 있으면 건너뜀
function mergeData(d) {
  var res = { workouts: 0, exercises: 0, routines: 0, skipped: 0 };
  // 종목은 새로 추가되는 운동·루틴이 실제로 쓰는 것만 더한다 — 예전 백업을 합쳐도 이미 정리(합치기)한 종목이 되살아나지 않게
  var byId = {}, byName = {}, fileEx = {};
  data.exercises.forEach(function (e) { byId[e.id] = e; byName[normName(e.name)] = e; });
  d.exercises.forEach(function (e) { fileEx[e.id] = e; });
  function exFor(id) {
    var e = fileEx[id];
    var hit = byId[id] || (e && byName[normName(e.name)]);
    if (hit) return hit.id;
    if (!e) return id;
    var ne = clone(e);
    data.exercises.push(ne); byId[ne.id] = ne; byName[normName(ne.name)] = ne; res.exercises++;
    return ne.id;
  }
  function remap(blocks) { return blocks.map(function (b) { var c = clone(b); c.exId = exFor(b.exId); return c; }); }
  function sig(w) { return Math.floor(w.start / 60000) + JSON.stringify(w.exercises.map(function (b) { return [b.exId, b.sets]; })); }
  var rIds = {}, rNames = {}, rmap = {};
  data.routines.forEach(function (r) { rIds[r.id] = r.id; rNames[r.name.trim()] = r.id; });
  d.routines.forEach(function (r) {
    var hit = rIds[r.id] || rNames[r.name.trim()];
    if (hit) { rmap[r.id] = hit; return; }
    var nr = clone(r); nr.exercises = remap(r.exercises);
    data.routines.push(nr); rIds[nr.id] = nr.id; rNames[nr.name.trim()] = nr.id; rmap[r.id] = nr.id; res.routines++;
  });
  var ids = {}, sigs = {};
  data.workouts.forEach(function (w) { ids[w.id] = 1; sigs[sig(w)] = 1; });
  d.workouts.forEach(function (w) {
    if (ids[w.id]) { res.skipped++; return; }
    var probe = { start: w.start, exercises: w.exercises.map(function (b) {
      var e = fileEx[b.exId], hit = byId[b.exId] || (e && byName[normName(e.name)]);
      return { exId: hit ? hit.id : b.exId, sets: b.sets };
    }) };
    if (sigs[sig(probe)]) { res.skipped++; return; }
    var nw = clone(w); nw.exercises = remap(w.exercises); if (nw.routineId) nw.routineId = rmap[nw.routineId] || nw.routineId;
    data.workouts.push(nw); ids[nw.id] = 1; sigs[sig(nw)] = 1; res.workouts++;
  });
  return res;
}
function importData(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('JSON 파일이 아닙니다'); return; }
    if (!obj || !Array.isArray(obj.workouts) || !Array.isArray(obj.exercises)) { toast('이 앱의 백업 파일 형식이 아닙니다'); return; }
    var d = normalize(obj);
    actionSheet('백업 파일: 운동 ' + d.workouts.length + '회 · 종목 ' + d.exercises.length + '개 · 루틴 ' + d.routines.length + '개', [
      { label: '합치기 (지금 기록은 두고 새 기록만 추가)', icon: 'plus', onClick: function () {
        var r = mergeData(d);
        save(); refreshTab();
        toast('운동 ' + r.workouts + '회 · 종목 ' + r.exercises + '개 · 루틴 ' + r.routines + '개를 추가했어요' + (r.skipped ? ' (겹치는 운동 ' + r.skipped + '회는 건너뜀)' : ''), 4000);
      } },
      { label: '대체 (지금 데이터를 파일 내용으로 바꾸기)', icon: 'refresh', danger: true, onClick: function () {
        confirmSheet('지금 앱의 기록(운동 ' + data.workouts.length + '회)이 모두 지워지고 파일 내용으로 바뀝니다. 대체할까요?', '대체', function () {
          data = d; applyTheme(); save(); refreshTab(); toast('불러왔습니다');
        });
      } }
    ]);
  };
  reader.readAsText(file);
}

  b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
});
$('minibar').addEventListener('click', function () { if (active) openEditor('live'); });
['touchstart', 'click'].forEach(function (ev) {
  document.addEventListener(ev, unlockAudio, { passive: true, once: true });
});
setInterval(tickTimers, 500);
document.addEventListener('visibilitychange', function () { if (!document.hidden) tickTimers(); });

(async function init() {
  try { OLD_KEYS.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
  loadActive();
  await loadData();
  applyTheme();
  $('loading').hidden = true;
  $('app').hidden = false;
  switchTab('workout');
  refreshChrome();
  if ('serviceWorker' in navigator) {
    try {
      // updateViaCache:'none' — sw.js 자체를 브라우저 HTTP 캐시에서 꺼내 "안 바뀜"으로 오판하지 않게.
      // 새 서비스워커가 넘겨받으면 한 번 자동 새로고침해서 최신 코드가 바로 반영되게 한다.
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        reg.update().catch(function () {});
      }).catch(function () {});
      var reloading = false;
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading || !hadController) return;
        reloading = true;
        window.location.reload();
      });
    } catch (e) {}
  }
})();
</script>
</body>
