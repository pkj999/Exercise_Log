<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동일지">
<meta name="theme-color" content="#F4F5F7">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css">
<title>운동일지</title>
</head>
<body>

<div id="loading" class="loading">불러오는 중...</div>

<div id="app" hidden>
  <header class="top"><h1 id="tab-title">운동</h1></header>
  <main id="view"></main>

  <button id="minibar" class="minibar" hidden>
    <span class="pulse"></span>
    <span class="list-main"><b id="minibar-name">운동 중</b><small><span class="js-elapsed">0:00</span><span class="js-restbar" hidden> · 휴식 <span class="js-resttime">0:00</span></span></small></span>
    <span class="minibar-go">이어하기</span>
  </button>

  <nav class="tabbar">
    <button class="tab-btn on" data-tab="workout"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg><span>운동</span></button>
    <button class="tab-btn" data-tab="history"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M3.5 10.5h17M8.5 3v5M15.5 3v5"/></svg><span>기록</span></button>
    <button class="tab-btn" data-tab="exercises"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/></svg><span>종목</span></button>
    <button class="tab-btn" data-tab="settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>설정</span></button>
  </nav>
</div>

<div id="pages"></div>

<div id="sheet" class="sheet">
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="sheet-box" class="sheet-box"></div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/editor.js"></script>
<script src="js/picker.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
