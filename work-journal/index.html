  // Babel 변환이 끝나기 전에도 바로 동작해야 해서 이 부분만 순수 JS로 먼저 실행해둠.
  // (참고: 예전엔 여기에 "홈 화면에서 뒤로가기로는 종료 안 되게 막는" 가드도 있었는데,
  //  세 가지 다른 방식으로 시도해봐도 이 기기/환경에서는 전혀 효과가 없어서 걷어냈음.
  //  대신 각 작성 화면의 임시저장 기능으로 "혹시 꺼져도 쓰던 내용은 안 날아가게" 보완함.)
  window.wjOverlayStack = []; // [{ id, onClose }] — 가장 나중에 연 오버레이가 배열 끝
  window.wjSuppressNextPop = 0; // 버튼으로 닫으면서 직접 history.back()을 부를 때, 그로 인한 popstate는 한 번 무시
  window.wjOverlayIdSeq = 0;

  window.addEventListener('popstate', function () {
    if (window.wjSuppressNextPop > 0) { window.wjSuppressNextPop--; return; }
    var top = window.wjOverlayStack.pop();
    if (top) top.onClose();
  });
</script>

   이 지도에서 섹션 이름으로 먼저 훑고, Ctrl+F로 그 섹션 제목을 검색하면 빠릅니다.

   ── 데이터가 저장되는 곳 ──────────────────────────────────────────────
   실제 기록은 이 파일 안이 아니라 GitHub의 "데이터 저장소"(비공개 레포)에
   JSON 파일로 저장됩니다 (data/entries.json, data/quick-notes.json 등 —
   PATH_* 상수 목록 참고). 이 파일은 그 저장소를 읽고 쓰는 "화면"일 뿐입니다.

   ── 섹션 순서 (위에서 아래로) ─────────────────────────────────────────
   1. 아이콘            — 아이콘 이름 → SVG 경로 매핑 (ICON_PATHS), 컴포넌트별 상수
   2. 상수/설정          — 저장 경로(PATH_*), 기본 카테고리, 중요도 등급 등
   3. GitHub API 연동    — ghFetch/ghGetJSON/ghPutJSON/ghPutImage 등 저장소 읽고 쓰는 저수준 함수들
   4. 다중 저장소(보관) 헬퍼 — 저장소 로테이션(전환) 시 예전 저장소를 읽기 전용으로 다루는 유틸
   5. 이미지 유틸        — 파일→base64 변환, 확장자 판별, uploadNewImages(공용 업로드 함수)
   6. 작은 공용 컴포넌트  — Toast, 뱃지, 아이콘 버튼, HighlightText(검색어 강조) 등
   7. 빠른 기록 탭 컴포넌트 — QuickNoteCard, NoteEditModal, QuickCaptureTab
   8. 할 일 탭 컴포넌트   — TodoTab
   9. 업무일지 탭 컴포넌트 — EntryCard, EntryFormModal, EntriesTab, 달력/타임라인/하이라이트 뷰
   10. 설정 탭 컴포넌트   — SettingsPanel(계정 연결), RepoUsagePanel, RepoArchivePanel,
                          DataExportPanel(백업/엑셀), CategoryManager, PhraseManager
   11. App 루트 컴포넌트  — 모든 상태(entries/notes/todos 등)를 들고 있는 최상위 컴포넌트.

                          더 세분화되어 있으니, App 안에서 뭔가 찾을 땐 그 번호 주석을 따라가면 됨.

   ── 데이터 흐름을 한 줄로 ────────────────────────────────────────────
   화면에서 뭔가 저장/수정/삭제 → App의 handle* 함수가 mutateX/removeX/writeActiveX 같은

=============================================================================== */

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) { /* 무시 */ }
}
function uid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${days[d.getDay()]})`;
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

// Date 객체 → 'YYYY-MM-DD' (달력에서 날짜별로 기록을 묶을 때 사용)
function dateKeyFromDate(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// 달력 그리드용 — 해당 연/월(month는 0부터 시작)을 앞뒤 빈 칸까지 포함해 7일씩 묶은 주 배열로 반환
function buildCalendarWeeks(year, month) {
  const firstOfMonth = new Date(year, month, 1);
  const startDay = firstOfMonth.getDay(); // 0=일요일
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) {
    cells.push({ date: new Date(year, month - 1, daysInPrevMonth - i), inMonth: false });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: new Date(year, month, d), inMonth: true });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].date;
    const next = new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1);
    cells.push({ date: next, inMonth: false });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

function downloadICS(title, dateStr) {
  if (!dateStr) return;
  const dt = dateStr.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const esc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//WorkJournal//KO', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid()}@workjournal`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${dt}`,
    `SUMMARY:${esc(title)}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(title || '할일').slice(0, 40)}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ===========================================================
   GitHub Contents API 헬퍼
=========================================================== */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghFetch(cfg, path, opts = {}) {
  const url = `${GH_API}/repos/${cfg.owner}/${cfg.repo}/contents/${path}${opts.query || ''}`;
  // 네트워크가 불안정할 때 요청이 응답도 실패도 없이 무한정 걸려있는 걸 막기 위한 타임아웃
  // (이게 없으면 "저장 중…"이 화면에서 영원히 안 사라지는 버그가 생김)
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), opts.timeoutMs || 20000);
  try {
    const res = await fetch(url, {
      method: opts.method || 'GET',
      headers: {
        Authorization: `Bearer ${cfg.token}`,
        Accept: opts.accept || 'application/vnd.github+json',
        ...(opts.method === 'PUT' || opts.method === 'DELETE' ? { 'Content-Type': 'application/json' } : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: controller.signal,
    });
    // 토큰이 만료·무효화되면 모든 요청이 401로 실패하는데, 그냥 두면 호출한 곳마다 제각각
    // "저장 실패", "읽기 실패" 같은 뭉뚱그린 메시지만 뜨고 진짜 원인(토큰 문제)은 안 보임.
    // 여기 한 곳에서 잡아서 모든 요청에 공통으로 명확한 안내가 뜨게 함.
    if (res.status === 401) throw new Error('GitHub 토큰이 만료됐거나 더 이상 유효하지 않아요. 설정 탭 → 계정 연결에서 토큰을 다시 확인해주세요.');
    return res;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('요청 시간이 초과됐어요. 네트워크 상태를 확인하고 다시 시도해주세요.');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}

async function ghGetJSON(cfg, path) {
  const res = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}` });
  if (res.status === 404) return { data: [], sha: null };
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `GitHub 읽기 실패 (${res.status})`);
  }
  const json = await res.json();
  let text;
  if (json.content != null) {
    // 보통 이 경로 — 1MB 이하 파일은 GitHub이 base64로 내용을 바로 담아서 돌려줌
    text = base64ToUtf8(json.content);
  } else if (json.size > 0) {
    // 파일이 1MB를 넘으면 GitHub이 content를 비워서 돌려줌(공식 문서에 명시된 동작) —
    // 이걸 그냥 빈 배열로 처리하면, 그 위에 새 기록을 저장하는 순간 기존 기록 전체가 사라짐.
    // 그래서 크기가 있는데 content가 없으면 원본(raw) 형식으로 다시 요청해서 내용을 확실히 받아옴.
    const rawRes = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}`, accept: 'application/vnd.github.raw' });
    if (!rawRes.ok) throw new Error(`기록 파일이 커서(1MB 이상) 읽는 데 실패했어요 (${rawRes.status}). 안전을 위해 저장을 중단했어요.`);
    text = await rawRes.text();
  } else {
    text = '[]';
  }
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    // 파싱 실패를 조용히 빈 배열로 넘기지 않음 — 그렇게 하면 "읽기 실패 = 기록 0건"처럼 보여서
    // 그 상태로 뭔가 저장하는 순간 기존 기록을 통째로 덮어쓰는 사고로 이어질 수 있음
    throw new Error('기록 파일을 정상적으로 읽지 못했어요. 안전을 위해 저장을 중단했어요.');
  }
  return { data: Array.isArray(data) ? data : [], sha: json.sha };
}

async function ghPutJSON(cfg, path, dataArr, sha, message) {
  const body = {
    message: message || `update ${path}`,
    content: utf8ToBase64(JSON.stringify(dataArr, null, 2)),
    branch: cfg.branch || 'main',
  };
  if (sha) body.sha = sha;
  const res = await ghFetch(cfg, path, { method: 'PUT', body });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const e = new Error(err.message || `GitHub 저장 실패 (${res.status})`);
    e.status = res.status; // 409(다른 곳에서 먼저 바뀜) 등을 호출부에서 구분할 수 있도록
    throw e;
  }
  const json = await res.json();
  return json.content.sha;
}

async function ghPutImage(cfg, path, base64Content, message) {
  const body = { message: message || `add ${path}`, content: base64Content, branch: cfg.branch || 'main' };
  // 원본 화질 그대로 올리기로 했으니 파일이 꽤 클 수 있음(특히 느린 네트워크) — 20초로는 부족해서
  // 용량 1MB당 30초씩, 최소 90초는 기다려주도록 여유 있게 잡음
  const timeoutMs = Math.max(90000, Math.ceil(base64Content.length / (1024 * 1024)) * 30000);
  const res = await ghFetch(cfg, path, { method: 'PUT', body, timeoutMs });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `이미지 업로드 실패 (${res.status})`);
  }
  return path;
}

/* ===========================================================
   다중 레포(보관/archive) 헬퍼
   — 레포를 전환(로테이션)해도 예전 레포를 읽기 전용으로 함께 보여주고,
     예외적으로 수정할 때는 그 항목이 원래 있던 레포에만 정확히 다시 쓰기 위한 유틸들
=========================================================== */
async function ghDeleteFile(cfg, path, message) {
  // 삭제하려면 현재 파일의 sha가 필요해서 먼저 조회
  const getRes = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}` });
  if (getRes.status === 404) return; // 이미 없음 — 조용히 넘어감
  if (!getRes.ok) throw new Error(`파일 조회 실패 (${getRes.status})`);
  const json = await getRes.json();
  const res = await ghFetch(cfg, path, {
    method: 'DELETE',
    body: { message: message || `delete ${path}`, sha: json.sha, branch: cfg.branch || 'main' },
  });
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `파일 삭제 실패 (${res.status})`);
  }
}

async function ghGetRepoInfo(cfg) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  let res;
  try {
    res = await fetch(`${GH_API}/repos/${cfg.owner}/${cfg.repo}`, {
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
      signal: controller.signal,
    });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('요청 시간이 초과됐어요.');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
  if (!res.ok) throw new Error(`레포 정보 조회 실패 (${res.status})`);
  const json = await res.json();
  return { sizeKB: json.size || 0 }; // GitHub API가 KB 단위로 보고 (실제 반영까지 약간의 지연 있을 수 있음)
}

// 보관된(archive) 레포 정보로 접근할 때 쓸 cfg를 만들어줌 (토큰은 공유, owner/repo/branch만 교체)
function repoCfgFor(cfg, repoTag) {
  if (!repoTag) return cfg;
  return { ...cfg, owner: repoTag.owner, repo: repoTag.repo, branch: repoTag.branch || 'main' };
}
function repoKeyOf(repoTag) {
  return repoTag ? `${repoTag.owner}/${repoTag.repo}` : '';
}
// 같은 파일(entries.json 등)에 대한 쓰기 요청이 동시에 여러 개 나가지 않게, 한 번에 하나씩만 실행되도록 줄 세우는 헬퍼.
// 예전엔 삭제를 연달아 여러 번 누르면 저장 요청들이 거의 동시에 나갔고, sha 충돌(409)이 나면 재시도를 1번만 하는데
// 그 재시도끼리도 서로 부딪히면 결국 몇 개는 실패로 끝나는 문제가 있었음.
// 이제 한 번에 하나씩만 나가게 줄을 세워서, 뒤에 나가는 요청은 항상 앞선 요청이 끝난 뒤의 상태를 기준으로 하므로
// 최악의 경우에도 충돌이 1번만 나고, 기존의 1회 재시도로 정상적으로 해결됨.
function createSerialQueue() {
  let tail = Promise.resolve();
  const run = task => {
    const result = tail.then(task, task);
    tail = result.then(() => {}, () => {}); // 하나가 실패해도 큐 자체는 끊기지 않고 이어짐
    return result;
  };
  return run;
}
// 레코드에 붙여둔 _repo/_readonly/_repoLabel 태그는 앱 내부 표시용이라, 실제 저장 전엔 반드시 제거
function stripMeta(item) {
  const { _repo, _readonly, _repoLabel, ...rest } = item;
  return rest;
}

// entries/quickNotes 전체를 훑어서 현재 사용 중인 이미지 경로 집합을 만듦.
// (opts로 지금 삭제하려는 항목 자신은 제외하고 계산)
function collectImagePaths(entriesArr, notesArr, opts = {}) {
  const set = new Set();
  (entriesArr || []).forEach(e => {
    if (opts.excludeEntryId && e.id === opts.excludeEntryId) return;
    (e.images || []).forEach(r => { const { thumb, original } = imgPaths(r); if (thumb) set.add(thumb); if (original) set.add(original); });
  });
  (notesArr || []).forEach(n => {
    if (opts.excludeNoteId && n.id === opts.excludeNoteId) return;
    (n.imageRefs || []).forEach(r => { const { thumb, original } = imgPaths(r); if (thumb) set.add(thumb); if (original) set.add(original); });
  });
  return set;
}

// imageRefs 중 다른 곳에서 더 이상 참조하지 않는 것만 실제로 레포에서 삭제.
// 개별 파일 삭제가 실패해도 나머지는 계속 진행 (사진 삭제 실패로 전체 작업이 막히지 않도록).
async function deleteOrphanedImages(cfg, imageRefs, inUseSet, messagePrefix) {
  const paths = new Set();
  (imageRefs || []).forEach(ref => { const { thumb, original } = imgPaths(ref); if (thumb) paths.add(thumb); if (original) paths.add(original); });
  for (const p of paths) {
    if (!inUseSet.has(p)) {
      try { await ghDeleteFile(cfg, p, `${messagePrefix} (사진 정리): ${p}`); } catch (e) { /* 개별 실패는 무시하고 계속 */ }
    }
  }
}

async function ghGetImageBlobUrl(cfg, path) {
  const res = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}`, accept: 'application/vnd.github.raw+json' });
  if (!res.ok) throw new Error('이미지 로드 실패');
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

async function ghTestConnection(cfg) {
  const res = await ghFetch(cfg, '', { query: '' });
  if (res.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
  if (res.status === 404) throw new Error('레포지토리를 찾을 수 없습니다. 계정명·레포 이름을 확인해주세요. (레포가 완전히 비어있으면 404가 뜰 수 있어요 — README와 함께 생성했는지 확인)');
  if (res.status === 403) throw new Error('접근이 거부되었습니다. 토큰 권한(Contents: Read and write)을 확인해주세요.');
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `연결 실패 (${res.status})`);
  }
  return true;
}

/* ===========================================================
   이미지 파일 처리 유틸 (base64 변환)
   — 압축 썸네일은 만들지 않음: 목록에서는 사진을 아예 안 불러오고
     "사진 보기"를 눌렀을 때만 원본 화질 그대로 불러오는 방식으로 바뀌어서
     (PhotoReveal 컴포넌트 참고) 압축본이 더 이상 필요 없어짐.
=========================================================== */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.onload = e => resolve(e.target.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

function extFromFile(file) {
  const byType = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'image/gif': 'gif' };
  if (byType[file.type]) return byType[file.type];
  const parts = (file.name || '').split('.');
  return parts.length > 1 ? parts.pop().toLowerCase() : 'jpg';
}

/* 사진 파일 목록을 하나씩 원본 화질 그대로 레포에 올리고, 저장에 쓸 경로 배열을 돌려줌.
   (빠른 기록 작성/수정, 업무일지 작성/수정 — 총 4곳에서 똑같이 하던 걸 하나로 모은 것.
    사진 하나당 파일명은 "시각-랜덤값.확장자"로 지어서 겹칠 일이 없게 함) */
async function uploadNewImages(writeCfg, files, message) {
  const paths = [];
  for (const file of files) {
    const id = `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
    const base64Content = await fileToBase64(file);
    const path = `images/${id}.${extFromFile(file)}`;
    await ghPutImage(writeCfg, path, base64Content, message);
    paths.push(path);
  }
  return paths;
}

/* 이미지 참조 형식 호환 — 새 데이터는 문자열 경로 하나(원본 화질 파일 1개, 목록 미리보기와 원본이 동일 파일).
   {thumb, original} 객체 형식(과거 압축 썸네일+원본 분리 구조)도 혹시 있으면 그대로 읽을 수 있게 남겨둠. */
function imgPaths(ref) {
  if (typeof ref === 'string') return { thumb: ref, original: ref };
  return { thumb: ref.thumb, original: ref.original || ref.thumb };
}

/* ===========================================================
   모바일 "뒤로가기" 버튼으로 모달만 닫히게 하는 훅 (전역 오버레이 스택 방식)
   — 예전 방식(모달마다 독립적으로 처리)은 두 가지 문제가 있었음:
     1) 모달을 열고 뒤로가기를 연타하면, 첫 번째는 모달을 닫지만 그다음부턴 쌓인 히스토리가 없어서 앱이 꺼짐
     2) 모달 안에서 사진 확대(라이트박스)처럼 겹쳐 열렸을 때, 뒤로가기 한 번에 위/아래 모달이 같이 닫힘
   지금 방식은 열려있는 오버레이를 "스택"으로 관리해서, 열 때마다 히스토리를 하나씩 더 쌓고,
   뒤로가기 한 번은 정확히 "가장 최근에 연 오버레이 하나만" 닫는다.
   (오버레이 스택 자체는 body 맨 위의 순수 JS 스크립트에서 미리 만들어둠 — Babel 변환이 끝나기 전에도
   즉시 동작해야 해서 이 스크립트보다 먼저 실행되게 분리함. 여기서는 그때 만들어진 전역값
   (window.wjOverlayStack 등)을 그대로 이어받아 씀.)
=========================================================== */
function useBackButtonClose(open, onClose) {
  const idRef = useRef(null);
  if (idRef.current === null) idRef.current = ++wjOverlayIdSeq;
  const wasOpenRef = useRef(false);
  const onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;

  useEffect(() => {
    const id = idRef.current;
    if (open && !wasOpenRef.current) {
      wjOverlayStack.push({ id, onClose: () => onCloseRef.current() });
      window.history.pushState({ wjModal: true }, '');
      wasOpenRef.current = true;
    } else if (!open && wasOpenRef.current) {
      wasOpenRef.current = false;
      const idx = wjOverlayStack.findIndex(o => o.id === id);
      if (idx !== -1) {
        wjOverlayStack.splice(idx, 1);
        // 버튼으로 닫힌 것 — 아직 우리가 쌓아둔 더미 히스토리 위에 있다면 그걸 정리 (이때 발생하는 popstate는 무시해야 함)
        if (window.history.state && window.history.state.wjModal) {
          wjSuppressNextPop++;
          window.history.back();
        }
      }
    }
  }, [open]);
}

/* ===========================================================
   GitHub 이미지 캐시 훅
=========================================================== */
const imageUrlCache = new Map();
function useGhImage(cfg, path) {
  const [url, setUrl] = useState(() => imageUrlCache.get(path) || null);
  useEffect(() => {
    let cancelled = false;
    if (!path || !cfg) return;
    if (imageUrlCache.has(path)) { setUrl(imageUrlCache.get(path)); return; }
    ghGetImageBlobUrl(cfg, path).then(u => {
      if (!cancelled) { imageUrlCache.set(path, u); setUrl(u); }
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [path, cfg]);
  return url;
}
function GhImage({ cfg, path, originalPath, className }) {
  const url = useGhImage(cfg, path);
  if (!url) return <div className={`bg-slate-200 dark:bg-slate-800 animate-pulse ${className}`} />;
  return (
    <img src={url} className={`${className} cursor-zoom-in`}
      onClick={() => window.dispatchEvent(new CustomEvent('wj-lightbox-open', { detail: { cfg, path: originalPath || path } }))} />
  );
}

/* ===========================================================
   목록에서 사진을 곧바로 불러오지 않고, "사진 N장 보기"를 눌렀을 때만
   그 시점에 GhImage를 마운트해서 불러오는 컴포넌트 (목록 로딩 속도 개선용)
=========================================================== */
function PhotoReveal({ cfg, refs, thumbClassName, limit }) {
  const [open, setOpen] = useState(false);
  if (!refs || refs.length === 0) return null;
  const shown = limit ? refs.slice(0, limit) : refs;
  if (!open) {
    return (
      <button type="button" onClick={e => { e.stopPropagation(); setOpen(true); }}
        className="inline-flex items-center gap-1.5 text-[12px] font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all">
        <ImageIcon size={13} /> 사진 {refs.length}장 보기
      </button>
    );
  }
  return (
    <div className="flex items-center gap-1.5 flex-wrap">
      {shown.map((ref, i) => {
        const { thumb, original } = imgPaths(ref);
        return <GhImage key={thumb + i} cfg={cfg} path={thumb} originalPath={original} className={thumbClassName} />;
      })}
    </div>
  );
}

function GlobalLightbox() {
  const [state, setState] = useState(null);
  const [url, setUrl] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const closeLightbox = useCallback(() => setState(null), []);
  useBackButtonClose(!!state, closeLightbox);

  useEffect(() => {
    const handler = e => { setState(e.detail); setUrl(null); setError(''); };
    window.addEventListener('wj-lightbox-open', handler);
    return () => window.removeEventListener('wj-lightbox-open', handler);
  }, []);

  useEffect(() => {
    if (!state) return;
    let cancelled = false;
    setLoading(true);
    ghGetImageBlobUrl(state.cfg, state.path)
      .then(u => { if (!cancelled) { setUrl(u); setLoading(false); } })
      .catch(() => { if (!cancelled) { setError('원본을 불러오지 못했습니다.'); setLoading(false); } });
    return () => { cancelled = true; };
  }, [state]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') setState(null); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  if (!state) return null;

  const handleDownload = () => {
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = state.path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  return (
    <div className="fixed inset-0 z-[80] flex flex-col items-center justify-center bg-black/90 p-4 wj-modal-pop gap-3" onClick={() => setState(null)}>
      <button onClick={() => setState(null)} className="absolute top-4 right-4 p-2 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-90 transition-all">
        <X size={20} />
      </button>
      {loading && <LoaderCircle size={26} className="text-white/70 wj-spin" />}
      {error && <p className="text-white/80 text-[13px]">{error}</p>}
      {url && (
        <React.Fragment>
          <img src={url} className="max-w-full max-h-[78vh] object-contain rounded-lg" onClick={e => e.stopPropagation()} />
          <button onClick={e => { e.stopPropagation(); handleDownload(); }}
            className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white/10 text-white text-[13px] font-medium hover:bg-white/20 active:scale-95 transition-all">
            <Download size={14} /> 원본 다운로드
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

function SettingsPanel({ initial, onSave, onDisconnect, embedded }) {
  const [owner, setOwner] = useState(initial?.owner || '');

  const [branch, setBranch] = useState(initial?.branch || 'main');

  const [editing, setEditing] = useState(!embedded);

  const handleRepoChange = v => { setRepo(v); invalidate(); };

  const handleTokenChange = v => { setToken(v); invalidate(); };

  const startEdit = () => {
    // 그사이 다른 곳(저장소 전환 등)에서 연결 정보가 바뀌었을 수도 있으니, 펼칠 때 항상 최신 값으로 다시 채움
    setOwner(initial?.owner || ''); setRepo(initial?.repo || ''); setBranch(initial?.branch || 'main'); setToken(initial?.token || '');
    setVerified(true); setTestMsg(null); // 값을 안 바꾸고 그냥 보기만 하고 취소할 수도 있으니, 열자마자 저장 버튼을 막지는 않음

        )}
      </div>
    </div>
  );
}

const REPO_SIZE_MAX_MB = 1024;   // GitHub 권장 상한(약 1GB)
const REPO_SIZE_WARN_MB = 800;   // 이 이상이면 경고 표시

// 설정 탭 — 활성 저장소의 GitHub 용량(size)을 보여주는 카드 (1GB 권장 상한 기준 경고 표시)
function RepoUsagePanel({ cfg }) {
  const [sizeKB, setSizeKB] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    setError('');
    try {
      const info = await ghGetRepoInfo(cfg);
      setSizeKB(info.sizeKB);
    } catch (err) {
      setError(err.message || '조회 실패');
    } finally {
      setLoading(false);
    }
  }, [cfg]);

  useEffect(() => { load(); }, [load]);

  const usedMB = sizeKB != null ? sizeKB / 1024 : null;
  const pct = usedMB != null ? Math.min(100, (usedMB / REPO_SIZE_MAX_MB) * 100) : 0;
  const isWarn = usedMB != null && usedMB >= REPO_SIZE_WARN_MB;
  const barColor = isWarn ? '#F0654A' : '#45C4B0';

  return (
    <div className="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <div className="flex items-center justify-between mb-2.5">
        <div className="flex items-center gap-2 text-[13px] text-slate-600 dark:text-slate-300">
          <DatabaseIcon size={14} /> 데이터 저장소 용량
        </div>
        <button onClick={load} disabled={loading} title="새로고침"
          className="p-2 rounded-md text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all disabled:opacity-50">
          <RefreshCw size={12.5} className={loading ? 'wj-spin' : ''} />
        </button>
      </div>

      {error ? (
        <p className="text-[11px] text-red-400">{error}</p>
      ) : usedMB == null ? (
        <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 animate-pulse" />
      ) : (
        <React.Fragment>
          <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: barColor }} />
          </div>
          <div className="flex items-center justify-between mt-1.5">
            <span className="text-[12px] font-mono text-slate-500 dark:text-slate-400">
              {usedMB < 1 ? `${sizeKB} KB` : `${usedMB.toFixed(1)} MB`} / {REPO_SIZE_MAX_MB} MB
            </span>
            <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500">{pct.toFixed(1)}%</span>
          </div>
          {isWarn && (
            <div className="mt-2 flex items-start gap-1.5 text-[11px] text-amber-500">
              <AlertTriangle size={13} className="shrink-0 mt-[1px]" />
              <span>용량이 {REPO_SIZE_WARN_MB}MB를 넘었어요. 새 데이터 저장소로 옮길 준비를 해두는 게 좋아요.</span>
            </div>
          )}
          <p className="text-[11px] text-slate-400 dark:text-slate-600 mt-1.5 leading-relaxed">
            GitHub이 집계한 값이라 실제 반영까지 약간 지연될 수 있어요.
          </p>
        </React.Fragment>
      )}
    </div>
  );
}

// 설정 탭 — 보관된 저장소 목록 표시 + 새 데이터 저장소로 전환(로테이션)하는 폼
function RepoArchivePanel({ cfg, onRotate }) {
  const [expanded, setExpanded] = useState(false);
  const [newRepo, setNewRepo] = useState('');
  const [newBranch, setNewBranch] = useState('main');
  const [label, setLabel] = useState('');
  const [testing, setTesting] = useState(false);
  const [testMsg, setTestMsg] = useState(null);
  const [verified, setVerified] = useState(false);

  const archives = cfg.archives || [];
  const invalidate = () => { setVerified(false); setTestMsg(null); };

  const handleTest = async () => {
    if (!newRepo.trim()) return;
    setTesting(true); setTestMsg(null); setVerified(false);
    try {
      await ghTestConnection({ owner: cfg.owner, repo: newRepo.trim(), branch: newBranch.trim() || 'main', token: cfg.token });
      setTestMsg({ ok: true, msg: '연결 성공! 이 저장소로 전환할 수 있어요.' });
      setVerified(true);
    } catch (err) {
      setTestMsg({ ok: false, msg: err.message });
    } finally {
      setTesting(false);
    }
  };

  const handleRotate = () => {
    if (!verified) return;
    if (!window.confirm(`지금 저장소를 "${newRepo.trim()}"(으)로 전환할까요?\n\n현재 저장소(${cfg.repo})는 보관 처리되어 계속 읽을 수 있고, 앞으로 새로 쓰는 기록만 새 저장소에 저장돼요.`)) return;
    const archivedEntry = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch || 'main', label: label.trim() || cfg.repo, archivedAt: Date.now() };
    onRotate({ ...cfg, repo: newRepo.trim(), branch: newBranch.trim() || 'main', archives: [archivedEntry, ...archives] });
    setNewRepo(''); setLabel(''); setVerified(false); setTestMsg(null); setExpanded(false);
  };

  return (
    <div className="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <button onClick={() => setExpanded(v => !v)} className="w-full flex items-center justify-between text-[13px] text-slate-600 dark:text-slate-300 active:scale-[0.98] transition-transform">
        <span className="flex items-center gap-2"><DatabaseIcon size={14} /> 데이터 저장소 관리{archives.length > 0 ? ` (보관 ${archives.length}개)` : ''}</span>
        <ChevronDown size={14} className={expanded ? 'rotate-180 transition-transform' : 'transition-transform'} />
      </button>

      {expanded && (
        <div className="mt-3 space-y-4">
          <div>
            <p className="text-[12px] text-slate-500 dark:text-slate-400 mb-1.5">
              현재 쓰는 중: <span className="font-mono text-slate-700 dark:text-slate-200">{cfg.owner}/{cfg.repo}</span>
            </p>
            {archives.length > 0 && (
              <div className="space-y-1 mt-2">
                {archives.map((a, i) => (
                  <a key={i} href={`https://github.com/${a.owner}/${a.repo}`} target="_blank" rel="noopener noreferrer"
                    className="flex items-center justify-between text-[12px] px-2.5 py-1.5 rounded-md bg-slate-50 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors">
                    <span className="font-mono truncate">{a.owner}/{a.repo}</span>
                    <span className="text-slate-400 dark:text-slate-600 shrink-0 ml-2">보관됨 · {a.label}</span>
                  </a>
                ))}
              </div>
            )}
          </div>

          <div className="border-t border-slate-100 dark:border-slate-800 pt-3">
            <p className="text-[12px] font-medium text-slate-600 dark:text-slate-300 mb-2">새 데이터 저장소로 전환</p>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 leading-relaxed mb-2.5">
              GitHub에서 새 비공개 저장소를 먼저 만들고(README 포함), 지금 쓰는 토큰의 "저장소 접근" 목록에 그 저장소도 추가해주세요. 그다음 아래에 이름을 입력하고 연결 테스트 후 전환하면 돼요. 전환해도 지금 저장소는 그대로 남고, 목록에서 계속 읽기 전용으로 보여요.
            </p>
            <div className="grid grid-cols-2 gap-2 mb-2">
              <input value={newRepo} onChange={e => { setNewRepo(e.target.value); invalidate(); }} placeholder="새 저장소 이름"
                className="min-w-0 px-2.5 py-1.5 rounded-md text-[13px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
              <input value={newBranch} onChange={e => { setNewBranch(e.target.value); invalidate(); }} placeholder="main"
                className="min-w-0 px-2.5 py-1.5 rounded-md text-[13px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
            </div>
            <input value={label} onChange={e => setLabel(e.target.value)} placeholder="지금 저장소에 붙일 라벨 (예: 2026-09, 비워두면 저장소 이름 사용)"
              className="w-full min-w-0 px-2.5 py-1.5 rounded-md text-[13px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 mb-2" />

            {testMsg && (
              <div className={`text-[11px] px-2.5 py-1.5 rounded-md mb-2 leading-relaxed ${testMsg.ok ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-400'}`}>{testMsg.msg}</div>
            )}

            <div className="flex items-center gap-2">
              <button onClick={handleTest} disabled={!newRepo.trim() || testing}
                className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
                {testing ? <LoaderCircle size={12} className="wj-spin" /> : <Link2 size={12} />} 연결 테스트
              </button>
              <button onClick={handleRotate} disabled={!verified}
                title={!verified ? '먼저 연결 테스트를 통과해야 전환할 수 있어요' : ''}
                className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] font-semibold bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-700 dark:hover:bg-slate-300 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
                <ArrowRight size={12} /> 이 저장소로 전환
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// 스와이프해서 삭제 — 모바일 터치로 왼쪽으로 밀면 삭제, 데스크탑에선 그냥 감싸기만 함 (기존 삭제 버튼은 그대로 유지)
function SwipeToDelete({ onDelete, disabled, children }) {
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startRef = useRef(null);
  const axisRef = useRef(null);
  const armedRef = useRef(false); // 임계값을 이미 넘어서 "놓으면 삭제됨" 상태인지 — 진동을 한 번만 울리기 위한 플래그
  const THRESHOLD = -84;

  const onTouchStart = e => {
    if (disabled) return;
    const t = e.touches[0];
    startRef.current = { x: t.clientX, y: t.clientY };
    axisRef.current = null;
    armedRef.current = false;
    setDragging(true);
  };
  const onTouchMove = e => {
    if (disabled || !startRef.current) return;
    const t = e.touches[0];
    const dx = t.clientX - startRef.current.x;
    const dy = t.clientY - startRef.current.y;
    if (!axisRef.current) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      axisRef.current = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axisRef.current === 'x') {
      const next = Math.max(-110, Math.min(0, dx));
      if (next <= THRESHOLD && !armedRef.current) { armedRef.current = true; vibrate(18); } // 삭제가 "발동"되는 순간 한 번 탁
      else if (next > THRESHOLD && armedRef.current) { armedRef.current = false; }
      setDragX(next);
    }
  };
  const onTouchEnd = () => {
    if (disabled || !startRef.current) return;
    setDragging(false);
    if (dragX <= THRESHOLD) onDelete();
    setDragX(0);
    startRef.current = null;
    axisRef.current = null;
  };

  return (
    <div className="relative">
      {(dragging || dragX !== 0) && (
        <div className="absolute inset-0 rounded-lg flex items-center justify-end pr-5 bg-red-500 text-white">
          <Trash2 size={17} />
        </div>
      )}
      <div
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{ transform: `translateX(${dragX}px)`, transition: dragging ? 'none' : 'transform 0.2s ease' }}>
        {children}
      </div>
    </div>
  );
}

function QuickCaptureTab({ cfg, notes, phrases, editingNote, onEditNote, onAdd, onDelete, onRestore, onPermanentDelete, onEditSave, onPromote, onViewEntry, uploading, savingEdit, hasArchives, archivesLoaded, archiveLoading, onLoadArchives }) {
  // 빠른 기록 입력창 임시저장 — 사진 파일은 로컬 저장이 안 돼서 텍스트만 대상으로 함
  const QUICK_DRAFT_KEY = 'wj-draft-quick-note';
  const [text, setText] = useState(() => { try { return localStorage.getItem(QUICK_DRAFT_KEY) || ''; } catch (e) { return ''; } });
  const [files, setFiles] = useState([]);
  const [showTrash, setShowTrash] = useState(false);
  const [showProcessed, setShowProcessed] = useState(false);
  const [leavingNoteId, setLeavingNoteId] = useState(null);

  useEffect(() => {
    const t = setTimeout(() => {
      try { if (text) localStorage.setItem(QUICK_DRAFT_KEY, text); else localStorage.removeItem(QUICK_DRAFT_KEY); } catch (e) {}
    }, 800);
    return () => clearTimeout(t);
  }, [text]);

  const handleDeleteAnimated = note => {
    // 이미 업무일지로 옮겨간 기록은 실수로 지우면 아쉬우니 한 번 더 확인. 아직 정리 안 한 단발성 메모는 그냥 바로 삭제(빠르게 쓰고 치우는 용도라 확인창이 오히려 번거로움)
    if (note.processed && !window.confirm('이 빠른 기록은 이미 업무일지로 작성됐어요. 그래도 휴지통으로 옮길까요?')) return;
    setLeavingNoteId(note.id);
    setTimeout(() => { onDelete(note); setLeavingNoteId(null); }, 220);
  };
  const fileInputRef = useRef(null);

  const handleFiles = e => {
    const list = Array.from(e.target.files || []);
    setFiles(prev => [...prev, ...list].slice(0, 4));
    e.target.value = '';
  };
  const removeFile = idx => setFiles(prev => prev.filter((_, i) => i !== idx));

  const handleSend = () => {
    if (!text.trim() && files.length === 0) return;
    onAdd(text.trim(), files);
    setText(''); setFiles([]);
    try { localStorage.removeItem(QUICK_DRAFT_KEY); } catch (e) {}
  };
  const insertPhrase = t => setText(prev => {
    if (!prev) return t;
    const sep = /[\n ]$/.test(prev) ? '' : ' ';
    return prev + sep + t;
  });

  const active = useMemo(() => notes.filter(n => !n.deleted).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), [notes]);
  const trashed = useMemo(() => notes.filter(n => n.deleted).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0)), [notes]);
  const unprocessed = useMemo(() => active.filter(n => !n.processed), [active]);
  const processed = useMemo(() => active.filter(n => n.processed), [active]);

  const handleEditSave = (note, newText, keepImages, newFiles) => {
    onEditSave(note, newText, keepImages, newFiles);
    onEditNote(null);
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3 focus-within:border-slate-400 dark:focus-within:border-slate-500 transition-all">
        {phrases && phrases.length > 0 && (
          <div className="flex items-center gap-1.5 overflow-x-auto pb-2 mb-1 -mx-1 px-1" style={{ scrollbarWidth: 'none' }}>
            {phrases.map(p => (
              <button key={p.id} type="button" onClick={() => insertPhrase(p.text)}
                className="shrink-0 inline-flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all whitespace-nowrap">
                <Quote size={10} /> {p.text}
              </button>
            ))}
          </div>
        )}
        <textarea
          value={text}
          onChange={e => setText(e.target.value)}
          placeholder="보고 들은 걸 바로 적어두세요…"
          rows={2}
          className="w-full px-1 py-1 text-[14px] bg-transparent text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 resize-none"
        />
        {files.length > 0 && (
          <div className="flex items-center gap-2 flex-wrap mt-1 mb-2 px-1">
            {files.map((f, i) => (
              <div key={i} className="relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700">
                <img src={URL.createObjectURL(f)} className="w-full h-full object-cover" />
                <button onClick={() => removeFile(i)} className="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center active:scale-90 transition-transform">
                  <X size={10} />
                </button>
              </div>
            ))}
          </div>
        )}
        <div className="flex items-center justify-between pt-1.5 border-t border-slate-100 dark:border-slate-800">
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()}
            className="p-2 rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all">
            <Camera size={17} />
          </button>
          <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
          <button onClick={handleSend} disabled={uploading || (!text.trim() && files.length === 0)}
            className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-[13px] font-semibold bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-700 dark:hover:bg-slate-300 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
            {uploading ? <LoaderCircle size={13} className="wj-spin" /> : <Send size={13} />}
            {uploading ? '저장 중…' : '기록'}
          </button>
        </div>
      </div>

      {hasArchives && !archivesLoaded && (
        <button onClick={onLoadArchives} disabled={archiveLoading}
          className="flex items-center justify-center gap-1.5 text-[12px] font-medium px-3 py-2 rounded-lg border border-dashed border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 disabled:opacity-50 transition-all">
          {archiveLoading ? <LoaderCircle size={13} className="wj-spin" /> : <DatabaseIcon size={13} />}
          {archiveLoading ? '보관된 레포 불러오는 중…' : '보관된 레포의 지난 기록도 함께 보기'}
        </button>
      )}

      {(active.length > 0 || trashed.length > 0 || showTrash) && (
        <div className="flex items-center justify-between px-0.5">
          <span className="text-[12px] text-slate-400 dark:text-slate-500 font-mono">
            {showTrash ? `휴지통 ${trashed.length}건` : `${active.length}건`}
          </span>
          <button onClick={() => setShowTrash(v => !v)}
            className="text-[12px] font-medium text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 inline-flex items-center gap-1">
            {showTrash ? <ArrowLeft size={11} /> : <TrashIcon size={11} />} {showTrash ? '목록으로' : `휴지통${trashed.length > 0 ? ` (${trashed.length})` : ''}`}
          </button>
        </div>
      )}

      {showTrash ? (
        trashed.length === 0 ? (
          <div className="text-center py-14 text-slate-400 dark:text-slate-500 text-[13px]">휴지통이 비어 있습니다.</div>
        ) : (
          <div className="space-y-2.5">
            {trashed.map(note => {
              const readonly = !!note._readonly;
              return (
              <div key={note.id} className="wj-enter rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/40 p-3.5 opacity-80">
                <div className="flex items-start justify-between gap-2">
                  <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
                    삭제됨 · {fmtDateShort(dateKeyFromDate(note.deletedAt ? new Date(note.deletedAt) : new Date()))}
                    {readonly && <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500">보관 레포</span>}
                  </span>
                  <div className="flex items-center gap-1">
                    <button onClick={() => onRestore(note)} title="복원" className="p-2 rounded text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-slate-100 active:scale-90 transition-all"><Undo2 size={15} /></button>
                    <button onClick={() => onPermanentDelete(note)} title="영구 삭제" className="p-2 rounded text-slate-400 dark:text-slate-500 hover:text-red-500 active:scale-90 transition-all"><Trash2 size={15} /></button>
                  </div>
                </div>
                {note.text && <p className="text-[13px] text-slate-500 dark:text-slate-400 leading-relaxed mt-1.5 line-clamp-2 break-words">{note.text}</p>}
              </div>
              );
            })}
          </div>
        )
      ) : active.length === 0 ? (
        <div className="text-center py-14 text-slate-400 dark:text-slate-500 text-[13px]">
          아직 빠른 기록이 없습니다. 위에서 바로 적어보세요.
        </div>
      ) : (
        <React.Fragment>
          {unprocessed.length === 0 ? (
            <div className="text-center py-10 text-slate-400 dark:text-slate-500 text-[13px]">미처리 빠른 기록이 없습니다.</div>
          ) : (
            <div className="space-y-2.5">
              {unprocessed.map(note => (
                <QuickNoteCard key={note.id} cfg={cfg} note={note} leaving={leavingNoteId === note.id}
                  onEdit={() => onEditNote(note)} onDelete={() => handleDeleteAnimated(note)} onPromote={() => onPromote(note)} onViewEntry={() => onViewEntry(note)} />
              ))}
            </div>
          )}

          {processed.length > 0 && (
            <div className="pt-1">
              <button onClick={() => setShowProcessed(v => !v)} className="text-[12px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center gap-1 active:scale-95 transition-transform">
                <ChevronDown size={12} className={showProcessed ? 'rotate-180 transition-transform' : 'transition-transform'} /> 정리됨 {processed.length}건
              </button>
              {showProcessed && (
                <div className="space-y-2.5 mt-2">
                  {processed.map(note => (
                    <QuickNoteCard key={note.id} cfg={cfg} note={note} leaving={leavingNoteId === note.id}
                      onEdit={() => onEditNote(note)} onDelete={() => handleDeleteAnimated(note)} onPromote={() => onPromote(note)} onViewEntry={() => onViewEntry(note)} />
                  ))}
                </div>
              )}
            </div>
          )}
        </React.Fragment>
      )}

      <NoteEditModal open={!!editingNote} note={editingNote} cfg={editingNote ? repoCfgFor(cfg, editingNote._repo) : cfg} onClose={() => onEditNote(null)} onSave={handleEditSave} saving={savingEdit} />
    </div>
  );
}

/* ===========================================================
   할 일 탭
=========================================================== */
function TodoTab({ todos, onAdd, onToggle, onDelete, onEdit, onClearDone }) {
  const [text, setText] = useState('');
  const [due, setDue] = useState('');
  const [showDone, setShowDone] = useState(false);
  const [completingId, setCompletingId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');
  const [editDue, setEditDue] = useState('');

  const handleToggleAnimated = t => {
    if (t.done) { onToggle(t); return; } // 완료 취소는 바로 처리
    vibrate(15);
    setCompletingId(t.id);
    setTimeout(() => {
      onToggle(t);
      setCompletingId(null);
    }, 260);
  };

  const startEdit = t => { setEditingId(t.id); setEditText(t.text); setEditDue(t.due || ''); };
  const cancelEdit = () => setEditingId(null);
  const saveEdit = t => {
    if (!editText.trim()) return;
    onEdit(t, { text: editText.trim(), due: editDue || null });
    setEditingId(null);
  };

  // 오늘/이번 주/다음 주 이후/기한 없음으로 묶어서 보여줌 — 기한 없이 쌓아둔 것과 당장 급한 것이 섞여 안 보이게
  const BUCKETS = [
    { key: 'overdue', label: '기한 지남' },
    { key: 'today', label: '오늘' },
    { key: 'week', label: '이번 주' },
    { key: 'later', label: '다음 주 이후' },
    { key: 'none', label: '기한 없음' },
  ];
  const bucketOf = t => {
    if (!t.due) return 'none';
    const diff = daysUntil(t.due);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    const day = new Date().getDay(); // 0=일요일
    const daysLeftInWeek = day === 0 ? 0 : 7 - day;
    return diff <= daysLeftInWeek ? 'week' : 'later';
  };

  const { pending, done, overdueCount, todayCount, grouped } = useMemo(() => {
    const p = todos.filter(t => !t.done).sort((a, b) => (a.due || '9999-99-99').localeCompare(b.due || '9999-99-99'));
    const d = todos.filter(t => t.done).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    let od = 0, tc = 0;
    const g = { overdue: [], today: [], week: [], later: [], none: [] };
    p.forEach(t => {
      const b = bucketOf(t);
      g[b].push(t);
      if (b === 'overdue') od++; else if (b === 'today') tc++;
    });
    return { pending: p, done: d, overdueCount: od, todayCount: tc, grouped: g };
  }, [todos]);

  const handleAdd = () => {
    if (!text.trim()) return;
    onAdd({ text: text.trim(), due: due || null });
    setText(''); setDue('');
  };

  const renderTodoRow = t => {
    const diff = daysUntil(t.due);
    let badge = null;
    if (t.due) {
      if (diff < 0) badge = { txt: `${-diff}일 지남`, cls: 'text-[#F0654A] bg-[#F0654A]/10' };
      else if (diff === 0) badge = { txt: '오늘', cls: 'text-[#E8A93B] bg-[#E8A93B]/10' };
      else badge = { txt: `D-${diff}`, cls: 'text-slate-400 bg-slate-100 dark:bg-slate-800' };
    }
    if (editingId === t.id) {
      return (
        <div key={t.id} className="rounded-lg border border-slate-400 dark:border-slate-500 bg-white dark:bg-slate-900/60 px-3 py-2.5 flex items-center gap-2">
          <input value={editText} onChange={e => setEditText(e.target.value)} onKeyDown={e => e.key === 'Enter' && saveEdit(t)} autoFocus
            className="flex-1 min-w-0 px-2 py-1 text-[13px] bg-slate-50 dark:bg-slate-800 rounded-md border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200" />
          <input type="date" value={editDue} onChange={e => setEditDue(e.target.value)}
            className="w-[118px] shrink-0 px-2 py-1 rounded-md text-[12px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" />
          <button onClick={() => saveEdit(t)} className="shrink-0 p-1.5 rounded-md bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 active:scale-90 transition-all"><CircleCheckBig size={14} /></button>
          <button onClick={cancelEdit} className="shrink-0 p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 active:scale-90 transition-all"><X size={14} /></button>
        </div>
      );
    }
    return (
      <div key={t.id} className={`flex items-center gap-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 px-3 py-2.5 hover:border-slate-300 dark:hover:border-slate-700 transition-colors ${completingId === t.id ? 'wj-item-leaving' : ''}`}>
        <button onClick={() => handleToggleAnimated(t)} disabled={completingId === t.id}
          className={`shrink-0 -m-1.5 p-1.5 transition-all active:scale-90 ${completingId === t.id ? 'text-emerald-500 wj-check-bounce' : 'text-slate-300 dark:text-slate-600 hover:text-slate-900 dark:hover:text-slate-100'}`}>
          {completingId === t.id ? <CircleCheckBig size={20} /> : <CircleIcon size={20} />}
        </button>
        <span onClick={() => startEdit(t)} className="flex-1 min-w-0 text-[14px] text-slate-700 dark:text-slate-200 break-words cursor-pointer">{t.text}</span>
        {badge && <span className={`text-[11px] font-mono px-1.5 py-0.5 rounded shrink-0 ${badge.cls}`}>{badge.txt}</span>}
        {t.due && (
          <button onClick={() => downloadICS(t.text, t.due)} title="캘린더에 추가" className="p-1.5 text-slate-300 dark:text-slate-600 hover:text-[#5B9DF9] active:scale-90 transition-all shrink-0">
            <CalendarPlus size={14} />
          </button>
        )}
        <button onClick={() => startEdit(t)} title="수정" className="p-1.5 text-slate-300 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-300 active:scale-90 transition-all shrink-0">
          <Pencil size={15} />
        </button>
        <button onClick={() => onDelete(t)} className="p-1.5 text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all shrink-0">
          <X size={15} />
        </button>
      </div>
    );
  };

  return (
    <div className="flex flex-col gap-3">
      {(overdueCount > 0 || todayCount > 0) && (
        <div className="flex items-center gap-2 rounded-lg border border-[#F0654A]/25 bg-[#F0654A0D] px-3 py-2 text-[12px] text-[#F0654A]">
          <BellIcon size={13} />
          {overdueCount > 0 && <span>지난 항목 {overdueCount}건</span>}
          {overdueCount > 0 && todayCount > 0 && <span>·</span>}
          {todayCount > 0 && <span>오늘 마감 {todayCount}건</span>}
        </div>
      )}

      <div className="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3 flex items-center gap-2">
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdd()}
          placeholder="할 일 입력…" className="flex-1 min-w-0 px-2 py-1.5 text-[13px] bg-transparent text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
        <input type="date" value={due} onChange={e => setDue(e.target.value)}
          className="w-[118px] shrink-0 px-2 py-1.5 rounded-md text-[12px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" />
        <button onClick={handleAdd} disabled={!text.trim()}
          className="shrink-0 p-2 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 active:scale-90 disabled:opacity-40 disabled:active:scale-100 transition-all">
          <Plus size={15} strokeWidth={2.5} />
        </button>
      </div>

      {pending.length === 0 ? (
        <div className="text-center py-10 text-slate-400 dark:text-slate-500 text-[13px]">할 일이 모두 처리됐습니다.</div>
      ) : (
        <div className="space-y-4">
          {BUCKETS.map(b => grouped[b.key].length > 0 && (
            <div key={b.key}>
              <div className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 mb-1.5 px-0.5">{b.label} · {grouped[b.key].length}</div>
              <div className="space-y-1.5">{grouped[b.key].map(renderTodoRow)}</div>
            </div>
          ))}
        </div>
      )}

      {done.length > 0 && (
        <div className="pt-1">
          <div className="flex items-center justify-between">
            <button onClick={() => setShowDone(v => !v)} className="text-[12px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center gap-1 active:scale-95 transition-transform">
              <ChevronDown size={12} className={showDone ? 'rotate-180 transition-transform' : 'transition-transform'} /> 완료 {done.length}건
            </button>
            {showDone && (
              <button onClick={onClearDone} className="text-[11px] text-slate-400 dark:text-slate-500 hover:text-red-500 flex items-center gap-1 active:scale-95 transition-transform">
                <Trash2 size={11} /> 완료된 항목 전체 삭제
              </button>
            )}
          </div>
          {showDone && (
            <div className="space-y-1.5 mt-2">
              {done.map(t => (
                <div key={t.id} className="flex items-center gap-2.5 rounded-lg border border-slate-100 dark:border-slate-800/60 px-3 py-2 opacity-60">
                  <button onClick={() => onToggle(t)} className="text-emerald-500 shrink-0 -m-1.5 p-1.5 active:scale-90 transition-transform"><CircleCheckBig size={18} /></button>
                  <div className="flex-1 min-w-0">
                    <span className="block text-[13px] text-slate-500 dark:text-slate-400 line-through break-words">{t.text}</span>
                    {t.completedAt && <span className="block text-[10px] font-mono text-slate-400 dark:text-slate-500 mt-0.5">완료 {fmtDateShort(dateKeyFromDate(new Date(t.completedAt)))} {fmtTime(t.completedAt)}</span>}
                  </div>
                  <button onClick={() => onDelete(t)} className="p-2 text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all shrink-0"><X size={15} /></button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ===========================================================
   업무일지 탭 (통계 / 필터 / 카드 / 작성폼)
=========================================================== */
function StatsStrip({ entries, hasFilters, monthFilter, importanceFilter, onSelectAll, onSelectMonth, onSelectImportance }) {
  const stats = useMemo(() => {
    const now = new Date();
    const key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    return {
      total: entries.length,
      month: entries.filter(e => (e.date || '').startsWith(key)).length,
      high: entries.filter(e => e.importance === '상').length,
      mid: entries.filter(e => e.importance === '중').length,
      low: entries.filter(e => e.importance === '하').length,
    };
  }, [entries]);
  const items = [
    { key: 'all', label: '전체 기록', value: stats.total, active: !hasFilters, onClick: onSelectAll },
    { key: 'month', label: '이번 달', value: stats.month, active: monthFilter, onClick: onSelectMonth },
    { key: '상', label: '중요도 상', value: stats.high, active: importanceFilter === '상', onClick: () => onSelectImportance('상') },
    { key: '중', label: '중요도 중', value: stats.mid, active: importanceFilter === '중', onClick: () => onSelectImportance('중') },
    { key: '하', label: '중요도 하', value: stats.low, active: importanceFilter === '하', onClick: () => onSelectImportance('하') },
  ];
  return (
    <div className="flex items-stretch rounded-lg border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 overflow-hidden">
      {items.map((s, i) => (
        <button key={s.key} onClick={s.onClick}
          className={`flex-1 min-w-0 px-2 sm:px-3 py-3 text-left transition-colors active:scale-[0.98] ${i !== 0 ? 'border-l border-slate-200 dark:border-slate-800' : ''} ${s.active ? 'bg-slate-100 dark:bg-slate-800' : 'hover:bg-slate-50 dark:hover:bg-slate-800/60'}`}>
          <div className="text-lg font-semibold text-slate-800 dark:text-slate-100 tabular-nums leading-none">{s.value}</div>
          <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5 whitespace-nowrap">{s.label}</div>
        </button>
      ))}
    </div>
  );
}

// 자유 입력은 그대로 허용하면서, 기존에 썼던 값들을 밑에 후보로 보여주는 콤보박스.
// 프로젝트명 같은 "웬만하면 기존 걸 재사용해야 하는" 필드의 오타로 인한 데이터 분산을 줄이기 위한 용도.
function ComboBoxInput({ value, onChange, suggestions, placeholder, autoFocus, inputRef }) {
  const [focused, setFocused] = useState(false);
  const filtered = useMemo(() => {
    const q = value.trim().toLowerCase();
    return (suggestions || [])
      .filter(s => s !== value && (!q || s.toLowerCase().includes(q)))
      .slice(0, 6);
  }, [suggestions, value]);
  const showDropdown = focused && filtered.length > 0;

  return (
    <div className="relative">
      <input type="text" ref={inputRef} autoFocus={autoFocus} value={value}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => setTimeout(() => setFocused(false), 120)} // 후보 클릭이 blur보다 먼저 먹히게 살짝 지연
        placeholder={placeholder}
        className="w-full px-3 py-2 rounded-lg text-[14px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:border-slate-400 dark:focus:border-slate-500 transition-colors" />
      {showDropdown && (
        <div className="absolute z-20 left-0 right-0 mt-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-lg overflow-hidden max-h-48 overflow-y-auto">
          {filtered.map(s => (
            <button key={s} type="button" onMouseDown={() => onChange(s)}
              className="w-full text-left px-3 py-2 text-[13px] text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/60 truncate">
              {s}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// 태그 입력 — 칩으로 보여주고, Enter/쉼표로 추가, 기존에 썼던 태그를 자동완성 후보로 보여줌 (오타로 태그 흩어지는 것 방지)
function TagInput({ tags, onChange, suggestions, placeholder }) {
  const [text, setText] = useState('');
  const [focused, setFocused] = useState(false);
  const filtered = useMemo(() => {
    const q = text.trim().toLowerCase();
    return (suggestions || [])
      .filter(s => !tags.includes(s) && (!q || s.toLowerCase().includes(q)))
      .slice(0, 6);
  }, [suggestions, text, tags]);

  const commit = raw => {
    const v = raw.trim();
    if (v && !tags.includes(v)) onChange([...tags, v]);
    setText('');
  };
  const handleKeyDown = e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(text); }
    else if (e.key === 'Backspace' && !text && tags.length > 0) onChange(tags.slice(0, -1));
  };
  const removeTag = t => onChange(tags.filter(x => x !== t));

  return (
    <div className="relative">
      <div className="flex flex-wrap items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus-within:border-slate-400 dark:focus-within:border-slate-500 transition-colors">
        {tags.map(t => (
          <span key={t} className="inline-flex items-center gap-1 text-[12px] px-2 py-0.5 rounded-full bg-slate-200/70 dark:bg-slate-700 text-slate-600 dark:text-slate-300 shrink-0">
            {t}
            <button type="button" onClick={() => removeTag(t)} className="hover:text-red-500 active:scale-90 transition-all"><X size={10} /></button>
          </span>
        ))}
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={handleKeyDown}
          onFocus={() => setFocused(true)} onBlur={() => { commit(text); setTimeout(() => setFocused(false), 120); }}
          placeholder={tags.length ? '' : placeholder}
          className="flex-1 min-w-[100px] py-0.5 bg-transparent text-[13px] text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none" />
      </div>
      {focused && filtered.length > 0 && (
        <div className="absolute z-20 left-0 right-0 mt-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-lg overflow-hidden max-h-48 overflow-y-auto">
          {filtered.map(s => (
            <button key={s} type="button" onMouseDown={() => commit(s)}
              className="w-full text-left px-3 py-2 text-[13px] text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/60 truncate">
              {s}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function SelectPill({ value, onChange, options, placeholder, icon: Ico }) {
  return (
    <div className="relative w-full">
      <select value={value} onChange={e => onChange(e.target.value)}
        className="w-full appearance-none pl-8 pr-7 py-2 rounded-lg text-xs font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-slate-300 dark:hover:border-slate-600 cursor-pointer transition-colors">
        <option value="">{placeholder}</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
      {Ico && <Ico size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 pointer-events-none" />}
      <ChevronDown size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 pointer-events-none" />
    </div>
  );
}

// 검색어와 겹치는 부분만 다른 색으로 표시해주는 컴포넌트 (대소문자 구분 없이, 텍스트 안에서 검색어가 나오는 곳마다 전부 표시)
function HighlightText({ text, query }) {
  const s = text == null ? '' : String(text);
  const q = (query || '').trim();
  if (!q) return s;
  const lowerS = s.toLowerCase();
  const lowerQ = q.toLowerCase();
  const parts = [];
  let i = 0;
  while (i < s.length) {
    const hit = lowerS.indexOf(lowerQ, i);
    if (hit === -1) { parts.push(s.slice(i)); break; }
    if (hit > i) parts.push(s.slice(i, hit));
    parts.push(<mark key={hit} className="bg-[#E8A93B]/40 text-slate-900 dark:text-[#FDE9C4] rounded-[2px] px-0.5">{s.slice(hit, hit + q.length)}</mark>);
    i = hit + q.length;
  }
  return parts;
}

// 사내망 경로처럼 클릭으로는 잘 안 열리는 값을 클립보드로 복사해주는 버튼 — 복사 성공하면 잠깐 "복사됨"으로 바뀜
function CopyPathButton({ path }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async e => {
    e.stopPropagation();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(path);
      } else {
        // 클립보드 API를 못 쓰는 환경(구형 브라우저 등)을 위한 대체 방법
        const ta = document.createElement('textarea');
        ta.value = path;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (err) { /* 복사 실패하면 그냥 아무 표시도 안 함 */ }
  };
  return (
    <button type="button" onClick={handleCopy}
      className={`shrink-0 inline-flex items-center gap-1 text-[11px] font-medium px-2 py-1 rounded-md active:scale-90 transition-all ${copied ? 'text-emerald-500' : 'text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
      {copied ? <Check size={12} strokeWidth={2.5} /> : <CopyIcon size={12} />} {copied ? '복사됨' : '복사'}
    </button>
  );
}

const EMPTY_FORM = { date: todayStr(), title: '', category: '개발', importance: '중', bullets: [''], overview: '', problem: '', solution: '', lesson: '', tags: [], links: [], dataPath: '' };

function EntryFormModal({ open, initial, prefillNote, cfg, existingProjects, existingTags, categories, onClose, onSave }) {
  const [form, setForm] = useState(EMPTY_FORM);
  const [saving, setSaving] = useState(false);
  const [keepImages, setKeepImages] = useState([]);
  const [newFiles, setNewFiles] = useState([]);
  const [draftRestored, setDraftRestored] = useState(false);
  const firstFieldRef = useRef(null);
  const photoInputRef = useRef(null);
  const draftKeyRef = useRef(null); // 지금 열려있는 폼에 대응하는 임시저장 키 (수정 중인 일지 id, 또는 'new'/'note:노트id')
  const baselineRef = useRef(null); // 열었을 때의 원본 상태 — 이것과 달라지면 "변경됨"으로 간주
  useBackButtonClose(open, onClose);

  // 입력 중인 내용을 저장하지 않고 닫으려 하면(배경 클릭, X, 취소) 확인 한 번 거치도록 —
  // PC에서 실수로 다른 곳을 눌러 작성 중이던 내용이 그냥 날아가는 걸 막기 위함
  const isDirty = () => {
    try { return JSON.stringify({ form, keepImages }) !== baselineRef.current || newFiles.length > 0; } catch (e) { return true; }
  };
  const attemptClose = () => {
    if (isDirty() && !window.confirm('저장하지 않은 내용이 있어요. 닫을까요?\n(작성 중이던 내용은 잠시 후 다시 열면 이어서 쓸 수 있어요)')) return;
    onClose();
  };

  useEffect(() => {
    if (!open) return;
    setSaving(false); // 모달을 새로 열 때는 항상 저장 잠금을 풀어둠
    setNewFiles([]);
    setDraftRestored(false);
    draftKeyRef.current = 'wj-draft-entry:' + (initial ? initial.id : prefillNote ? ('note:' + prefillNote.id) : 'new');

    let baseForm, baseImages;
    if (initial) {
      baseForm = {
        date: initial.date || todayStr(), title: initial.title || '', category: initial.category || '개발',
        importance: initial.importance || '중', bullets: initial.bullets && initial.bullets.length > 0 ? [...initial.bullets] : [''],
        overview: initial.overview || '',
        problem: initial.problem || '', solution: initial.solution || '', lesson: initial.lesson || '',
        tags: initial.tags || [],
        links: initial.links && initial.links.length > 0 ? initial.links.map(l => ({ ...l })) : [],
        dataPath: initial.dataPath || '',
      };
      baseImages = initial.images || [];
    } else if (prefillNote) {
      // 빠른 기록은 보통 줄바꿈으로 항목을 구분해서 쭉 적어두는 경우가 많아서, 한 줄에 다 뭉쳐 넣지 않고
      // 줄바꿈 기준으로 나눠서 "주요 성과 및 한 일" 각 줄로 넣어줌 (빈 줄은 건너뜀)
      const noteLines = (prefillNote.text || '').split('\n').map(s => s.trim()).filter(Boolean);
      baseForm = { ...EMPTY_FORM, bullets: noteLines.length > 0 ? noteLines : [''], links: [] };
      baseImages = prefillNote.imageRefs || [];
    } else {
      baseForm = { ...EMPTY_FORM, bullets: [''], links: [] };
      baseImages = [];
    }
    baselineRef.current = JSON.stringify({ form: baseForm, keepImages: baseImages });

    // 임시저장된 내용이 있으면 이어서 쓸지 물어봄 (사진 파일 자체는 localStorage에 못 담아서 새로 골라야 함)
    let draft = null;
    try { const raw = localStorage.getItem(draftKeyRef.current); if (raw) draft = JSON.parse(raw); } catch (e) {}
    if (draft && draft.form && window.confirm('작성 중이던 내용이 남아있어요. 이어서 작성할까요?\n("취소"를 누르면 새로 시작하고 임시저장 내용은 지워집니다)')) {
      setForm(draft.form);
      setKeepImages(draft.keepImages || baseImages);
      setDraftRestored(true);
    } else {
      if (draft) { try { localStorage.removeItem(draftKeyRef.current); } catch (e) {} }
      setForm(baseForm);
      setKeepImages(baseImages);
    }
  }, [open, initial, prefillNote]);

  // 입력하는 동안 잠깐씩 멈추면(0.8초) 자동으로 임시저장 — 저장 버튼을 누르기 전에 창이 꺼져도 안전하도록
  useEffect(() => {
    if (!open || !draftKeyRef.current) return;
    const t = setTimeout(() => {
      try { localStorage.setItem(draftKeyRef.current, JSON.stringify({ form, keepImages, ts: Date.now() })); } catch (e) {}
    }, 800);
    return () => clearTimeout(t);
  }, [open, form, keepImages]);

  useEffect(() => { if (open && firstFieldRef.current) setTimeout(() => firstFieldRef.current.focus(), 30); }, [open]);
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape' && open) onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!open) return null;

  const imgCfg = repoCfgFor(cfg, (initial && initial._repo) || (prefillNote && prefillNote._repo));
  const totalImages = keepImages.length + newFiles.length;
  const handlePhotoFiles = e => {
    const list = Array.from(e.target.files || []);
    setNewFiles(prev => [...prev, ...list].slice(0, Math.max(0, 4 - keepImages.length)));
    e.target.value = '';
  };
  const removeKeepImage = ref => setKeepImages(prev => prev.filter(p => p !== ref));
  const removeNewFile = idx => setNewFiles(prev => prev.filter((_, i) => i !== idx));

  const updateBullet = (idx, value) => setForm(f => { const next = [...f.bullets]; next[idx] = value; return { ...f, bullets: next }; });
  const addBullet = () => setForm(f => ({ ...f, bullets: [...f.bullets, ''] }));
  const removeBullet = idx => setForm(f => ({ ...f, bullets: f.bullets.filter((_, i) => i !== idx) }));
  const updateLink = (idx, field, value) => setForm(f => { const next = [...f.links]; next[idx] = { ...next[idx], [field]: value }; return { ...f, links: next }; });
  const addLink = () => setForm(f => ({ ...f, links: [...f.links, { label: '', url: '' }] }));
  const removeLink = idx => setForm(f => ({ ...f, links: f.links.filter((_, i) => i !== idx) }));
  const canSave = form.title.trim().length > 0 && form.date;

  const handleSubmit = async e => {
    e.preventDefault();
    if (!canSave || saving) return; // 저장 중 연타 방지
    setSaving(true);
    try {
      const ok = await onSave({
        date: form.date, title: form.title.trim(), category: form.category, importance: form.importance,
        bullets: form.bullets.map(b => b.trim()).filter(Boolean),
        overview: form.overview.trim(),
        problem: form.problem.trim(), solution: form.solution.trim(), lesson: form.lesson.trim(),
        tags: form.tags,
        links: form.links.map(l => ({ label: (l.label || '').trim(), url: (l.url || '').trim() })).filter(l => l.url),
        dataPath: form.dataPath.trim(),
        keepImages, newFiles,
      });
      // 실제로 저장에 성공했을 때만 임시저장을 지움 — "저장 실패, 다시 시도" 토스트가 뜬 채로
      // 앱이 꺼지면, 재시도 버튼이 들고 있던 내용도 같이 사라지므로 임시저장이 마지막 안전망이 됨
      if (ok && draftKeyRef.current) { try { localStorage.removeItem(draftKeyRef.current); } catch (err) {} }
    } finally {
      setSaving(false); // onSave가 실패해도 다시 시도할 수 있게 풀어줌 (성공 시엔 모달이 닫히므로 어차피 무관)
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-0 sm:p-6 overflow-y-auto">
      <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm" onClick={attemptClose} />
      <form onSubmit={handleSubmit} className="wj-modal-pop relative w-full sm:max-w-xl bg-white dark:bg-slate-900 sm:rounded-xl border border-slate-200 dark:border-slate-700 shadow-2xl my-0 sm:my-8 max-h-[100vh] sm:max-h-[88vh] flex flex-col">
        <div className="flex items-center justify-between px-5 sm:px-6 py-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
          <h2 className="text-[15px] font-semibold text-slate-800 dark:text-slate-100">
            {initial ? '일지 수정' : prefillNote ? '빠른 기록에서 일지 작성' : '새 일지 작성'}
          </h2>
          <button type="button" onClick={attemptClose} className="p-2 rounded-md text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-transform"><X size={16} /></button>
        </div>

        {draftRestored && (
          <div className="mx-5 sm:mx-6 mt-3 px-3 py-2 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-[12px] text-emerald-700 dark:text-emerald-400 flex items-center gap-1.5">
            <RefreshCw size={12} /> 임시저장된 내용을 불러왔어요.
          </div>

        <div className="px-5 sm:px-6 py-5 space-y-4 overflow-y-auto">
          <div className="grid grid-cols-3 gap-3">

              <label className="block text-[11px] font-medium text-slate-500 dark:text-slate-400 mb-1.5">날짜</label>

function SummaryPanel({ entries, categories }) {
  const [range, setRange] = useState('week');
  const cats = categories || CATEGORIES;
  const stats = useMemo(() => {
    const now = new Date();
    let start, end;
    if (range === 'week') {
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      start = new Date(now); start.setDate(now.getDate() + diffToMonday); start.setHours(0, 0, 0, 0);
      end = new Date(start); end.setDate(start.getDate() + 7); // 다음 주 월요일 (이 날짜는 포함 안 함)
    } else {
      start = new Date(now.getFullYear(), now.getMonth(), 1);
      end = new Date(now.getFullYear(), now.getMonth() + 1, 1); // 다음 달 1일 (이 날짜는 포함 안 함)
    }
    const pad = n => String(n).padStart(2, '0');
    const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const startStr = toStr(start), endStr = toStr(end);
    // 시작일 이상 ~ 끝일 미만으로 범위를 확실히 제한 — 끝을 안 정해두면 미래 날짜로 적은 일지가
    // "이번 주"든 "이번 달"이든 항상 포함돼버려서 두 탭 결과가 구분이 안 되는 문제가 있었음
    const inRange = entries.filter(e => e.date && e.date >= startStr && e.date < endStr);
    const byCategory = {};
    cats.forEach(c => { byCategory[c.id] = 0; });
    inRange.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + 1; });
    return { total: inRange.length, byCategory };
  }, [entries, range, cats]);

  const maxCat = Math.max(1, ...Object.values(stats.byCategory));

  return (
    <div className="wj-enter rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="text-[13px] font-semibold text-slate-700 dark:text-slate-200">{range === 'week' ? '이번 주' : '이번 달'} 요약</div>
        <div className="flex items-center gap-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5">
          <button onClick={() => setRange('week')}
            className={`px-2.5 py-1 rounded-md text-[12px] font-medium transition-colors ${range === 'week' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm' : 'text-slate-400 dark:text-slate-500'}`}>주간</button>
          <button onClick={() => setRange('month')}
            className={`px-2.5 py-1 rounded-md text-[12px] font-medium transition-colors ${range === 'month' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm' : 'text-slate-400 dark:text-slate-500'}`}>월간</button>
        </div>
      </div>
      <div className="font-mono text-2xl font-semibold text-slate-800 dark:text-slate-100 mb-3">
        {stats.total}<span className="text-[12px] font-sans font-normal text-slate-400 dark:text-slate-500 ml-1">건 작성</span>
      </div>
      <div className="space-y-1.5">
        {cats.map(c => (
          <div key={c.id} className="flex items-center gap-2">
            <span className="text-[11px] w-16 shrink-0 text-slate-500 dark:text-slate-400">{c.label}</span>
            <div className="flex-1 h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
              <div className="h-full rounded-full transition-all" style={{ width: `${(stats.byCategory[c.id] / maxCat) * 100}%`, background: c.color }} />
            </div>
            <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500 w-4 text-right">{stats.byCategory[c.id]}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// 달력 한 칸 — 일지는 틸 점, 빠른 기록은 회색 점으로 그날 기록 유무만 표시
function MonthCalendar({ year, month, entriesByDay, notesByDay, selectedDay, onSelectDay }) {
  const weeks = useMemo(() => buildCalendarWeeks(year, month), [year, month]);
  const todayKey = todayStr();
  return (
    <div className="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3">
      <div className="grid grid-cols-7 mb-1.5">
        {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (
          <div key={d} className={`text-center text-[11px] font-medium py-1 ${i === 0 ? 'text-[#F0654A]/70' : i === 6 ? 'text-[#5B9DF9]/70' : 'text-slate-400 dark:text-slate-500'}`}>{d}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-y-1">
        {weeks.flat().map((cell, i) => {
          const key = dateKeyFromDate(cell.date);
          const dayEntries = entriesByDay[key] || [];
          const dayNotes = notesByDay[key] || [];
          const hasAny = dayEntries.length > 0 || dayNotes.length > 0;
          const isToday = key === todayKey;
          const isSelected = key === selectedDay;
          return (
            <button key={i} onClick={() => onSelectDay(key)}
              className={`aspect-square flex flex-col items-center justify-center gap-0.5 rounded-lg text-[12px] transition-all active:scale-90 ${
                !cell.inMonth ? 'text-slate-300 dark:text-slate-700' : 'text-slate-600 dark:text-slate-300'
              } ${isSelected ? 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 font-semibold' : isToday ? 'bg-slate-200 dark:bg-slate-700 font-semibold' : hasAny ? 'hover:bg-slate-100 dark:hover:bg-slate-800' : 'hover:bg-slate-50 dark:hover:bg-slate-800/50'}`}>
              <span>{cell.date.getDate()}</span>
              <span className="flex items-center gap-0.5 h-1.5">
                {dayEntries.length > 0 && <span className={`w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white dark:bg-slate-900' : 'bg-slate-400 dark:bg-slate-500'}`} />}
                {dayNotes.length > 0 && <span className={`w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-[#1a1206]/50' : 'bg-slate-400 dark:bg-slate-500'}`} />}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}
