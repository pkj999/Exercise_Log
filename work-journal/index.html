                    {dayNotes.map(note => {
                      const imgCfg = repoCfgFor(cfg, note._repo);
                      return (
                        <div key={note.id} className="rounded-lg border border-slate-200 dark:border-slate-800 p-3">
                          <div className="flex items-center justify-between gap-2 mb-1">
                            <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500">{fmtTime(note.createdAt)}</span>
                            {note.processed && <span className="text-[10px] text-emerald-500 flex items-center gap-0.5"><CircleCheckBig size={10} /> 정리됨</span>}
                          </div>
                          {note.text && <p className="text-[13px] text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-wrap break-words">{note.text}</p>}
                          {note.imageRefs && note.imageRefs.length > 0 && (
                            <div className="mt-2">
                              <PhotoReveal cfg={imgCfg} refs={note.imageRefs} limit={4} thumbClassName="w-10 h-10 rounded object-cover border border-slate-200 dark:border-slate-700" />
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

function EntriesTab({ cfg, entries, notes, categories, categoryMap, onOpenNew, onEdit, onDelete, onToggleFavorite, onRestore, onPermanentDelete, onViewSource, onPreviewEntry, hasArchives, archivesLoaded, archiveLoading, onLoadArchives }) {
  const [query, setQuery] = useState('');
  const [projectFilter, setProjectFilter] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [importanceFilter, setImportanceFilter] = useState('');
  const [tagFilter, setTagFilter] = useState('');
  const [favoriteOnly, setFavoriteOnly] = useState(false);
  const [monthFilter, setMonthFilter] = useState(false); // 상단 통계의 "이번 달" 클릭 시 켜지는 필터
  const [showSummary, setShowSummary] = useState(false);
  const [showFilterPanel, setShowFilterPanel] = useState(false);
  const [showTrash, setShowTrash] = useState(false);
  const [view, setView] = useState('list'); // 'list' | 'calendar' | 'project' | 'highlights'
  const [calDate, setCalDate] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [selectedDay, setSelectedDay] = useState(null); // 'YYYY-MM-DD' | null — 바텀시트에 표시 중인 날짜
  const [timelineProject, setTimelineProject] = useState(null);
  const [yearToggles, setYearToggles] = useState({}); // 프로젝트별 보기에서 연도 그룹을 펼쳤는지 여부 (직접 클릭해서 바꾼 것만 기록)
  const [highlightYear, setHighlightYear] = useState(() => new Date().getFullYear());

  // 휴지통(삭제된) 항목은 목록/달력/통계/필터/타임라인 등 모든 일반 화면에서 제외하고, 아래 휴지통 화면에서만 보여줌
  const activeEntries = useMemo(() => entries.filter(e => !e.deleted), [entries]);
  const trashedEntries = useMemo(() => entries.filter(e => e.deleted).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0)), [entries]);

  const entriesByDay = useMemo(() => {
    const map = {};
    activeEntries.forEach(e => { if (e.date) (map[e.date] = map[e.date] || []).push(e); });
    return map;
  }, [activeEntries]);
  const notesByDay = useMemo(() => {
    const map = {};
    (notes || []).forEach(n => {
      if (n.deleted || !n.createdAt) return;
      const key = dateKeyFromDate(new Date(n.createdAt));
      (map[key] = map[key] || []).push(n);
    });
    return map;
  }, [notes]);

  const goMonth = delta => setCalDate(({ y, m }) => {
    const d = new Date(y, m + delta, 1);
    return { y: d.getFullYear(), m: d.getMonth() };
  });
  const handlePreviewFromSheet = entry => { setSelectedDay(null); onPreviewEntry(entry); };

  const projects = useMemo(() => [...new Set(activeEntries.map(e => e.title).filter(Boolean))].sort(), [activeEntries]);
  const allTags = useMemo(() => [...new Set(activeEntries.flatMap(e => e.tags || []))].sort(), [activeEntries]);
  // "프로젝트별" 보기용 — 최근에 손댄 프로젝트가 먼저 오도록
  const projectsByRecency = useMemo(() => {
    const map = new Map();
    activeEntries.forEach(e => {
      if (!e.title) return;
      if (!map.has(e.title) || (e.date || '') > map.get(e.title)) map.set(e.title, e.date || '');
    });
    return [...map.entries()].sort((a, b) => b[1].localeCompare(a[1])).map(([t]) => t);
  }, [activeEntries]);
  useEffect(() => {
    if (view === 'project' && (!timelineProject || !projectsByRecency.includes(timelineProject))) {
      setTimelineProject(projectsByRecency[0] || null);
    }
  }, [view, projectsByRecency, timelineProject]);
  const timelineEntries = useMemo(() => {
    if (!timelineProject) return [];
    return activeEntries.filter(e => e.title === timelineProject)
      .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || 0) - (b.createdAt || 0));
  }, [activeEntries, timelineProject]);

  // "프로젝트별" 보기 — 프로젝트가 많아질 걸 대비해 연도별로 묶어서, 최근 연도만 기본으로 펼쳐둠
  const projectsByYear = useMemo(() => {
    const map = new Map();
    activeEntries.forEach(e => {
      if (!e.title) return;
      if (!map.has(e.title) || (e.date || '') > map.get(e.title)) map.set(e.title, e.date || '');
    });
    const sorted = [...map.entries()].sort((a, b) => b[1].localeCompare(a[1]));
    const groups = [];
    const byYear = new Map();
    sorted.forEach(([title, date]) => {
      const year = date ? date.slice(0, 4) : '날짜 없음';
      if (!byYear.has(year)) { const g = { year, projects: [] }; byYear.set(year, g); groups.push(g); }
      byYear.get(year).projects.push(title);

    return groups;
  }, [activeEntries]);
  const isYearOpen = (year, idx) => (yearToggles[year] !== undefined ? yearToggles[year] : idx === 0);
  const toggleYear = (year, idx) => setYearToggles(prev => ({ ...prev, [year]: !isYearOpen(year, idx) }));

  // "하이라이트" 보기 — 즐겨찾기 또는 중요도 "상"만 골라 연도 단위로 보여줌 (이력서·연말 회고용)
  const highlightEntries = useMemo(() => {
    const y = String(highlightYear);
    return activeEntries.filter(e => (e.favorite || e.importance === '상') && (e.date || '').startsWith(y))
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  }, [activeEntries, highlightYear]);

    const q = query.trim().toLowerCase();
    return activeEntries
      .filter(e => !projectFilter || e.title === projectFilter)
      .filter(e => !categoryFilter || e.category === categoryFilter)
      .filter(e => !importanceFilter || e.importance === importanceFilter)
      .filter(e => !tagFilter || (e.tags || []).includes(tagFilter))
      .filter(e => !favoriteOnly || e.favorite)
      .filter(e => !monthFilter || (e.date || '').startsWith(currentMonthKey))
      .filter(e => {
        if (!q) return true;
        const hay = [e.title, e.problem, e.solution, e.lesson, ...(e.bullets || []), ...(e.tags || [])].join(' ').toLowerCase();
        return hay.includes(q);
      })
      .sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  }, [activeEntries, query, projectFilter, categoryFilter, importanceFilter, tagFilter, favoriteOnly, monthFilter, currentMonthKey]);

  // "필터" 버튼에 표시할 개수 — 검색어는 별도로 항상 보이는 칸이라 여기 안 셈
  const pillFilterCount = [projectFilter, categoryFilter, importanceFilter, tagFilter].filter(Boolean).length + (favoriteOnly ? 1 : 0) + (monthFilter ? 1 : 0);
  // 상단 통계(전체 기록/이번 달/중요도별) 클릭 시 — 다른 필터는 다 지우고 그 조건 하나만 적용해서 목록 보기로 바로 이동
  const jumpToStat = setup => { resetFilters(); setup(); setView('list'); setShowTrash(false); };

  return (
    <div className="flex flex-col gap-4">
      <StatsStrip entries={activeEntries} hasFilters={hasFilters} monthFilter={monthFilter} importanceFilter={importanceFilter}
        onSelectAll={() => jumpToStat(() => {})}
        onSelectMonth={() => jumpToStat(() => setMonthFilter(true))}
        onSelectImportance={level => jumpToStat(() => setImportanceFilter(level))} />

      {hasArchives && !archivesLoaded && (
        <button onClick={onLoadArchives} disabled={archiveLoading}
          className="flex items-center justify-center gap-1.5 text-[12px] font-medium px-3 py-2 rounded-lg border border-dashed border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 disabled:opacity-50 transition-all">
          {archiveLoading ? <LoaderCircle size={13} className="wj-spin" /> : <DatabaseIcon size={13} />}
          {archiveLoading ? '보관된 레포 불러오는 중…' : '보관된 레포의 지난 기록도 함께 보기'}
        </button>
      )}

      {(activeEntries.length > 0 || trashedEntries.length > 0 || showTrash) && (
        <div className="flex items-center justify-between px-0.5">

            {showTrash ? `휴지통 ${trashedEntries.length}건` : `${activeEntries.length}건`}

            {showTrash ? <ArrowLeft size={11} /> : <TrashIcon size={11} />} {showTrash ? '목록으로' : `휴지통${trashedEntries.length > 0 ? ` (${trashedEntries.length})` : ''}`}
          </button>

          {highlightEntries.length === 0 ? (
            <div className="text-center py-14 text-slate-400 dark:text-slate-500 text-[13px]">
              {highlightYear}년에는 즐겨찾기하거나 중요도 "상"으로 표시한 일지가 없어요.
            </div>

            <div className="space-y-3">
              {highlightEntries.map(entry => <EntryCard key={entry.id} cfg={cfg} entry={entry} query="" onEdit={onEdit} onDelete={onDelete} onToggleFavorite={onToggleFavorite} onViewSource={onViewSource} categoryMap={categoryMap} />)}
            </div>

        </React.Fragment>
      ) : (
      <React.Fragment>
      {activeEntries.length > 0 && (
        <div className="flex items-center justify-between px-0.5 -mt-1">
          <span className="text-[12px] text-slate-400 dark:text-slate-500 font-mono">{filtered.length}건 표시 중 {hasFilters && `(전체 ${activeEntries.length}건)`}</span>
          {hasFilters && <button onClick={resetFilters} className="text-[12px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center gap-1 active:scale-95 transition-transform"><X size={11} /> 필터 초기화</button>}
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="wj-enter flex flex-col items-center justify-center text-center py-16 px-6">
          <Inbox size={22} className="text-slate-300 dark:text-slate-600 mb-3" />
          <p className="text-sm text-slate-600 dark:text-slate-300 font-medium">{hasFilters ? '조건에 맞는 일지가 없습니다' : '아직 작성된 업무일지가 없습니다'}</p>
          {hasFilters && hasArchives && !archivesLoaded && (
            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5">보관된 저장소는 아직 안 불러왔어요 — 거기 있는 기록일 수도 있어요.</p>
          )}
          {hasFilters ? (
            <div className="flex items-center gap-2 mt-4">
              <button onClick={resetFilters} className="text-xs font-medium px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-transform">필터 초기화</button>
              {hasArchives && !archivesLoaded && (
                <button onClick={onLoadArchives} disabled={archiveLoading}
                  className="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-md bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-700 dark:hover:bg-slate-300 disabled:opacity-50 active:scale-95 transition-all">
                  {archiveLoading ? <LoaderCircle size={12} className="wj-spin" /> : <DatabaseIcon size={12} />} 보관 저장소도 검색하기
                </button>
              )}
            </div>
          ) : (
            <button onClick={onOpenNew} className="mt-4 inline-flex items-center gap-1.5 text-xs font-medium px-3.5 py-1.5 rounded-md bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-700 dark:hover:bg-slate-300 active:scale-[0.97] whitespace-nowrap transition-all"><Plus size={14} strokeWidth={2.5} /> 첫 일지 작성하기</button>
          )}
        </div>
      ) : (
        <div className="space-y-3">
          {filtered.map(entry => <EntryCard key={entry.id} cfg={cfg} entry={entry} query={query} onEdit={onEdit} onDelete={onDelete} onToggleFavorite={onToggleFavorite} onViewSource={onViewSource} categoryMap={categoryMap} />)}
        </div>
      )}
      </React.Fragment>
      )}
      </React.Fragment>
      )}

      <DayDetailSheet
        open={!!selectedDay}
        dateKey={selectedDay}
        cfg={cfg}
        categoryMap={categoryMap}
        dayEntries={selectedDay ? (entriesByDay[selectedDay] || []) : []}
        dayNotes={selectedDay ? (notesByDay[selectedDay] || []) : []}
        onClose={() => setSelectedDay(null)}
        onEditEntry={handlePreviewFromSheet}
      />
    </div>
  );
}

/* ===========================================================
   App 루트
=========================================================== */
/* ===========================================================
   저장 직후 "아직 반영 지연" 방지용 캐시
   — GitHub Contents API는 커밋 자체는 바로 끝나도, 그 직후 다시 읽었을 때
     몇 초~몇 분 정도 예전 내용을 돌려주는 지연(읽기 일관성 지연)이 있을 수 있음.
     그래서 "방금 내가 저장에 성공한 항목"은 짧은 시간 동안 로컬에도 따로 기억해뒀다가,
     새로고침해서 받아온 데이터에 아직 안 보이면 계속 화면에 붙여서 보여줌
     (실제로 GitHub에 반영되면 자연스럽게 정상 데이터로 교체됨).
=========================================================== */
const PENDING_KEY_PREFIX = 'workjournal.pending.';
const PENDING_GRACE_MS = 5 * 60 * 1000; // 5분 지나면 포기하고 정상 데이터만 믿음

function pendingKeyFor(cfg) { return `${PENDING_KEY_PREFIX}${cfg.owner}/${cfg.repo}`; }
function readPending(cfg) {
  try {
    const raw = localStorage.getItem(pendingKeyFor(cfg));
    const parsed = raw ? JSON.parse(raw) : null;
    return { entries: (parsed && parsed.entries) || [], notes: (parsed && parsed.notes) || [] };
  } catch (_) { return { entries: [], notes: [] }; }
}
function writePending(cfg, pending) {
  try { localStorage.setItem(pendingKeyFor(cfg), JSON.stringify(pending)); } catch (_) { /* 저장 공간 문제는 무시 */ }
}
// 쓰기가 성공한 직후 호출 — 이 항목을 "아직 반영 안 됐을 수도 있는 것" 목록에 등록
function markPending(cfg, kind, item) {
  const pending = readPending(cfg);
  const now = Date.now();
  const list = kind === 'entries' ? pending.entries : pending.notes;
  const kept = list.filter(p => now - p.addedAt < PENDING_GRACE_MS);
  kept.push({ id: item.id, item, addedAt: now });
  pending[kind] = kept;
  writePending(cfg, pending);
}
// loadAll에서 방금 새로 받아온 데이터와 대조해서, 아직 안 보이는 대기 항목을 앞쪽에 이어붙임 (+ 정리)
function reconcilePending(cfg, kind, freshData) {
  const pending = readPending(cfg);
  const now = Date.now();
  const freshIds = new Set(freshData.map(x => x.id));
  const list = pending[kind] || [];
  const stillWaiting = list.filter(p => now - p.addedAt < PENDING_GRACE_MS && !freshIds.has(p.id));
  pending[kind] = stillWaiting; // 이미 반영됐거나 유예시간 지난 건 정리
  writePending(cfg, pending);
  return stillWaiting.length ? [...stillWaiting.map(p => p.item), ...freshData] : freshData;
}

function App() {
  // App 컴포넌트 구조 안내 (수정할 때 참고용 목차)
  //  1. 상태(state) 선언
  //  2. 토스트 알림
  //  3. 테마 적용
  //  4. 데이터 로딩 — loadAll(활성 레포) / loadArchives(보관 레포, 지연 로딩)
  //  5. 당겨서 새로고침(pull-to-refresh)
  //  6. 전체 데이터 백업(JSON 내보내기)
  //  7. 설정 저장 / 레포 전환(로테이션)
  //  8. 쓰기 헬퍼 — writeActiveX(활성 레포 저장), mutateX/removeX(활성+보관 레포 공용 수정/삭제)
  //  9. 빠른 기록(퀵노트) 핸들러
  // 10. 문구 템플릿 핸들러
  // 11. 일지(entry) 핸들러 — 즐겨찾기 / 작성·수정 / 삭제
  // 12. 할 일(todo) 핸들러
  // 13. 렌더링 (설정 안 된 경우 / 메인 화면)

  /* ---------- 1. 상태 선언 ---------- */
  const [cfg, setCfg] = useState(() => {
    try { const raw = localStorage.getItem(CONFIG_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  });
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'dark');
  const [tab, setTab] = useState('quick');

  // 일지 / 빠른 기록 — 활성 레포분
  const [entries, setEntries] = useState([]);
  const [entriesSha, setEntriesSha] = useState(null);
  const [quickNotes, setQuickNotes] = useState([]);
  const [quickSha, setQuickSha] = useState(null);

  // 일지 / 빠른 기록 — 보관(archive) 레포분. "지난 기록 보기"를 눌러야 채워짐 (지연 로딩)
  const [archiveEntries, setArchiveEntries] = useState([]);
  const [archiveNotes, setArchiveNotes] = useState([]);
  const [archivesLoaded, setArchivesLoaded] = useState(false);
  const [archiveLoading, setArchiveLoading] = useState(false);
  const archiveShaRef = useRef({}); // { "owner/repo": { entriesSha, notesSha } } — 보관 레포별 파일 sha 캐시

  const [todos, setTodos] = useState([]);
  const [todosSha, setTodosSha] = useState(null);
  const [phrases, setPhrases] = useState([]);
  const [phrasesSha, setPhrasesSha] = useState(null);
  const [customCategories, setCustomCategories] = useState([]);
  const [customCategoriesSha, setCustomCategoriesSha] = useState(null);

  // entries.json/quick-notes.json/todos.json에 대한 쓰기 요청을 한 번에 하나씩만 실행되도록 줄 세우는 큐
  const entriesQueueRef = useRef(createSerialQueue());
  const quickNotesQueueRef = useRef(createSerialQueue());
  const todosQueueRef = useRef(createSerialQueue());

  // 동기화 상태
  const [loading, setLoading] = useState(false);
  const [syncError, setSyncError] = useState('');
  const [lastSynced, setLastSynced] = useState(null);
  const [offline, setOffline] = useState(false);       // 네트워크 실패 → 로컬 캐시로 대체 표시 중인지
  const [offlineCachedAt, setOfflineCachedAt] = useState(null);

  const [toast, setToast] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [importing, setImporting] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [savingNoteEdit, setSavingNoteEdit] = useState(false);

  // 일지 작성/수정 모달
  const [modalOpen, setModalOpen] = useState(false);
  // 삭제 "실행취소" — 삭제 누르면 화면에서 바로 감추고, 몇 초 안에 되돌리지 않으면 그때 실제로 지움
  const [pendingDeleteTodoIds, setPendingDeleteTodoIds] = useState(() => new Set());
  const pendingDeleteTimersRef = useRef({}); // id -> timeoutId
  const [editingEntry, setEditingEntry] = useState(null);
  const [prefillNote, setPrefillNote] = useState(null); // 빠른 기록에서 "일지로 정리하기"로 열었을 때만 값이 있음
  const [editingNote, setEditingNote] = useState(null); // 빠른 기록 수정 모달 — 업무일지 카드에서 "원본 보기"로도 열 수 있어서 App에서 관리
  const [previewEntryId, setPreviewEntryId] = useState(null); // 업무일지 "확인 먼저" 팝업 — 달력 클릭, 빠른기록의 "일지 보기"에서 사용
  const [previewNoteId, setPreviewNoteId] = useState(null); // 빠른 기록 "확인 먼저" 팝업 — 업무일지의 "원본 보기"에서 사용

  const notifiedRef = useRef(false);
  const toastIdRef = useRef(0);

  /* ---------- 2. 토스트 알림 ---------- */
  // action은 함수(기존처럼 "다시 시도"로 취급)이거나, { label, icon, onClick, duration } 객체(예: 실행취소)
  const showToast = useCallback((msg, action) => {
    const id = ++toastIdRef.current;
    let actionObj = null;
    if (typeof action === 'function') actionObj = { label: '다시 시도', icon: RefreshCw, onClick: action };
    else if (action && typeof action === 'object') actionObj = action;
    setToast({ id, msg, action: actionObj });
    setTimeout(() => { setToast(t => (t && t.id === id ? null : t)); }, actionObj ? (actionObj.duration || 6000) : 2400);
  }, []);

  /* ---------- 3. 테마 적용 ---------- */
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.documentElement.classList.toggle('light', theme !== 'dark');
    document.body.style.background = theme === 'dark' ? '#0B0E13' : '#F7F7F9';
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  /* ---------- 4. 데이터 로딩 ---------- */
  const loadAll = useCallback(async () => {
    if (!cfg) return;
    setLoading(true); setSyncError('');
    const cacheKey = `workjournal.cache.v1.${cfg.owner}/${cfg.repo}`;
    try {
      const [e, q, t, p, cat] = await Promise.all([ghGetJSON(cfg, PATH_ENTRIES), ghGetJSON(cfg, PATH_QUICK_NOTES), ghGetJSON(cfg, PATH_TODOS), ghGetJSON(cfg, PATH_PHRASES), ghGetJSON(cfg, PATH_CATEGORIES)]);
      const activeTag = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch || 'main' };
      // 방금 저장에 성공했는데 GitHub 쪽에서 아직 안 보여주는 항목이 있으면 여기서 다시 붙여줌
      const reconciledEntries = reconcilePending(cfg, 'entries', e.data);
      const reconciledNotes = reconcilePending(cfg, 'notes', q.data);
      // 활성 레포만 불러옴 — 보관 레포는 사용자가 "지난 기록 보기"를 눌렀을 때만 따로 불러온다 (loadArchives)
      setEntries(reconciledEntries.map(x => ({ ...x, _repo: activeTag, _readonly: false }))); setEntriesSha(e.sha);
      setQuickNotes(reconciledNotes.map(x => ({ ...x, _repo: activeTag, _readonly: false }))); setQuickSha(q.sha);
      setTodos(t.data); setTodosSha(t.sha);
      setPhrases(p.data); setPhrasesSha(p.sha);
      setCustomCategories(cat.data); setCustomCategoriesSha(cat.sha);
      setLastSynced(Date.now());
      setOffline(false); setOfflineCachedAt(null);
      // 다음에 오프라인일 때 보여줄 수 있게, 성공한 결과를 이 기기에 그대로 캐시해둠
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ entries: e.data, quickNotes: q.data, todos: t.data, phrases: p.data, categories: cat.data, cachedAt: Date.now() }));
      } catch (_) { /* 저장 공간 부족 등은 무시 — 캐시는 있으면 좋은 것일 뿐 */ }
    } catch (err) {
      // 네트워크 문제로 보이면, 이 기기에 마지막으로 저장해둔 내용이라도 보여줌 (읽기 전용은 아니지만 새로 쓰기는 어차피 네트워크가 있어야 됨)
      let usedCache = false;
      try {
        const raw = localStorage.getItem(cacheKey);
        if (raw) {
          const cached = JSON.parse(raw);
          const activeTag = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch || 'main' };
          setEntries((cached.entries || []).map(x => ({ ...x, _repo: activeTag, _readonly: false })));
          setQuickNotes((cached.quickNotes || []).map(x => ({ ...x, _repo: activeTag, _readonly: false })));
          setTodos(cached.todos || []);
          setPhrases(cached.phrases || []);
          setCustomCategories(cached.categories || []);
          setOffline(true);
          setOfflineCachedAt(cached.cachedAt || null);
          usedCache = true;
        }
      } catch (_) { /* 캐시 파싱 실패 시 그냥 원래 에러를 보여줌 */ }
      setSyncError(usedCache ? '' : (err.message || '동기화에 실패했습니다.'));
      if (!usedCache) setOffline(false);
    } finally {
      setLoading(false);
    }
  }, [cfg]);

  useEffect(() => { loadAll(); }, [loadAll]);

  /* ---------- 5. 당겨서 새로고침 ---------- */
  // 당겨서 새로고침 — 스크롤 맨 위에서 아래로 당기면 loadAll() 실행
  const [pullY, setPullY] = useState(0);
  const pullStartRef = useRef(null);
  const pullTriggeredRef = useRef(false);
  const scrollRef = useRef(null);
  const PULL_THRESHOLD = 64;

  const onPullTouchStart = e => {
    const el = scrollRef.current;
    if (!el || el.scrollTop > 0) { pullStartRef.current = null; return; }
    pullStartRef.current = e.touches[0].clientY;
  };
  const onPullTouchMove = e => {
    if (pullStartRef.current == null) return;
    const dy = e.touches[0].clientY - pullStartRef.current;
    if (dy <= 0) { setPullY(0); return; }
    setPullY(Math.min(dy * 0.5, 90));
  };
  const onPullTouchEnd = () => {
    if (pullStartRef.current == null) return;
    if (pullY >= PULL_THRESHOLD && !loading) {
      pullTriggeredRef.current = true;
      setPullY(48);
      loadAll();
    } else {
      setPullY(0);
    }
    pullStartRef.current = null;
  };
  useEffect(() => {
    if (!loading && pullTriggeredRef.current) {
      pullTriggeredRef.current = false;
      setPullY(0);
    }
  }, [loading]);

  // 레포가 전환될 때마다 보관 데이터 로딩 상태 초기화 (새 cfg 기준으로 다시 눌러야 불러옴)
  useEffect(() => {
    setArchivesLoaded(false);
    setArchiveEntries([]);
    setArchiveNotes([]);
    archiveShaRef.current = {};
  }, [cfg]);

  // "지난 기록 보기"를 눌렀을 때만 실행 — 보관 레포들의 entries/quick-notes를 읽기 전용으로 불러와 합침
  const loadArchives = useCallback(async () => {
    if (!cfg || archivesLoaded || archiveLoading) return;
    const archives = cfg.archives || [];
    if (!archives.length) { setArchivesLoaded(true); return; }
    setArchiveLoading(true);
    try {
      const results = await Promise.all(archives.map(async a => {
        const aCfg = repoCfgFor(cfg, a);
        const tag = { owner: a.owner, repo: a.repo, branch: a.branch || 'main' };
        const key = repoKeyOf(tag);
        const [ae, aq] = await Promise.all([
          ghGetJSON(aCfg, PATH_ENTRIES).catch(() => ({ data: [], sha: null })),
          ghGetJSON(aCfg, PATH_QUICK_NOTES).catch(() => ({ data: [], sha: null })),
        ]);
        archiveShaRef.current[key] = { entriesSha: ae.sha, notesSha: aq.sha };
        return {
          entries: ae.data.map(x => ({ ...x, _repo: tag, _readonly: true, _repoLabel: a.label })),
          notes: aq.data.map(x => ({ ...x, _repo: tag, _readonly: true, _repoLabel: a.label })),
        };
      }));
      let ents = [], notes = [];
      results.forEach(r => { ents = ents.concat(r.entries); notes = notes.concat(r.notes); });
      setArchiveEntries(ents);
      setArchiveNotes(notes);
      setArchivesLoaded(true);
    } catch (err) {
      showToast('보관 레포를 불러오지 못했습니다: ' + err.message);
    } finally {
      setArchiveLoading(false);
    }
  }, [cfg, archivesLoaded, archiveLoading, showToast]);

  // 화면에 실제로 뿌려줄 목록 — 보관 레포를 아직 안 불러왔으면 활성 레포 것만, 불러왔으면 합쳐서 보여줌.
  // 휴지통에 있는(삭제된) 항목도 여기엔 그대로 포함됨 — 사진이 아직 쓰이는 중인지 판단(collectImagePaths)할 때 필요하고,
  // 실제 화면에 안 보이게 거르는 건 EntriesTab 안에서 함 (빠른 기록과 동일한 방식).
  const displayEntries = useMemo(
    () => (archivesLoaded ? entries.concat(archiveEntries) : entries),
    [entries, archiveEntries, archivesLoaded]
  );
  const displayNotes = useMemo(() => (archivesLoaded ? quickNotes.concat(archiveNotes) : quickNotes), [quickNotes, archiveNotes, archivesLoaded]);
  // 미리보기 팝업은 id만 들고 있고 내용은 매번 최신 목록에서 찾아옴 — 즐겨찾기 토글 등으로 데이터가 바뀌어도 팝업이 옛 상태를 보여주지 않게 하기 위함
  const previewEntry = useMemo(() => (previewEntryId ? displayEntries.find(e => e.id === previewEntryId) || null : null), [previewEntryId, displayEntries]);
  const previewNote = useMemo(() => (previewNoteId ? displayNotes.find(n => n.id === previewNoteId) || null : null), [previewNoteId, displayNotes]);
  const visibleTodos = useMemo(() => todos.filter(t => !pendingDeleteTodoIds.has(t.id)), [todos, pendingDeleteTodoIds]);
  const hasArchives = !!(cfg && cfg.archives && cfg.archives.length);
  // 일지 작성 폼의 "프로젝트명 자동완성" 후보 — 지금까지 썼던 모든 프로젝트명(활성+보관), 최근 것이 먼저 오게
  const existingProjects = useMemo(() => {
    const seen = new Map(); // title -> 가장 최근 updatedAt
    displayEntries.forEach(e => {
      if (!e.title) return;
      const ts = e.updatedAt || e.createdAt || 0;
      if (!seen.has(e.title) || seen.get(e.title) < ts) seen.set(e.title, ts);
    });
    return [...seen.entries()].sort((a, b) => b[1] - a[1]).map(([title]) => title);
  }, [displayEntries]);
  const existingTags = useMemo(() => [...new Set(displayEntries.flatMap(e => e.tags || []))].sort(), [displayEntries]);

  /* ---------- 6. 전체 데이터 백업 ---------- */
  // 설정 화면의 "전체 데이터 백업" — 활성 레포 + 보관 레포까지 전부 새로 불러와서 JSON 파일로 내보냄.
  // (화면에 이미 떠 있는 상태가 아니라 매번 최신으로 다시 받아와서, 보관 레포를 아직 안 열어봤어도 통째로 백업된다)
  // JSON/엑셀 내보내기가 공통으로 쓰는 부분 — 활성 레포 + 보관 레포까지 전부 최신으로 새로 받아옴
  const gatherFullExportData = async () => {
    const archives = cfg.archives || [];
    const archiveResults = archives.length ? await Promise.all(archives.map(async a => {
      const aCfg = repoCfgFor(cfg, a);
      const [ae, aq] = await Promise.all([
        ghGetJSON(aCfg, PATH_ENTRIES).catch(() => ({ data: [] })),
        ghGetJSON(aCfg, PATH_QUICK_NOTES).catch(() => ({ data: [] })),
      ]);
      return { repo: { owner: a.owner, repo: a.repo, branch: a.branch || 'main', label: a.label }, entries: ae.data, quickNotes: aq.data };
    })) : [];
    return {
      activeRepo: activeTag,
      entries: entries.map(stripMeta),
      quickNotes: quickNotes.map(stripMeta),
      todos,
      phrases,
      archives: archiveResults,
    };
  };

  const handleExportData = async () => {
    if (!cfg) return;
    setExporting(true);
    try {
      const data = await gatherFullExportData();
      const payload = { app: '업무일지 (work-journal)', exportedAt: new Date().toISOString(), ...data };
      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `worklog-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('백업 파일을 내보냈습니다.');
    } catch (err) {
      showToast('내보내기 실패: ' + err.message, () => handleExportData());
    } finally {
      setExporting(false);
    }
  };

  const handleExportExcel = async () => {
    if (!cfg) return;
    if (typeof XLSX === 'undefined') {
      showToast('엑셀 기능을 불러오지 못했어요. 네트워크 확인 후 새로고침해주세요.');
      return;
    }
    setExporting(true);
    try {
      const data = await gatherFullExportData();
      const repoLabelOf = repo => (repo && repo.label) ? repo.label : '';

      // 일지 시트 — 사람이 보기 편하게 열 순서·한글 헤더로 정리
      const entryRows = [];
      const pushEntryRows = (arr, repoLabel) => {
        arr.forEach(e => entryRows.push({
          날짜: e.date || '', 프로젝트: e.title || '', 카테고리: e.category || '', 중요도: e.importance || '',
          개요: e.overview || '', 발생문제: e.problem || '', 해결과정: e.solution || '', 배운점: e.lesson || '',
          주요성과: (e.bullets || []).filter(Boolean).join(' / '), 태그: (e.tags || []).join(', '),
          즐겨찾기: e.favorite ? 'Y' : '', 휴지통: e.deleted ? 'Y' : '', 저장소: repoLabel,
        }));
      };
      pushEntryRows(data.entries, '');
      data.archives.forEach(a => pushEntryRows(a.entries, repoLabelOf(a.repo)));
      entryRows.sort((a, b) => (b.날짜 || '').localeCompare(a.날짜 || ''));

      // 빠른 기록 시트
      const noteRows = [];
      const pushNoteRows = (arr, repoLabel) => {
        arr.forEach(n => {
          const d = n.createdAt ? new Date(n.createdAt) : null;
          noteRows.push({
            날짜: d ? dateKeyFromDate(d) : '', 시간: d ? fmtTime(n.createdAt) : '',
            내용: n.text || '', 정리됨: n.processed ? 'Y' : '', 휴지통: n.deleted ? 'Y' : '', 저장소: repoLabel,
          });
        });
      };
      pushNoteRows(data.quickNotes, '');
      data.archives.forEach(a => pushNoteRows(a.quickNotes, repoLabelOf(a.repo)));
      noteRows.sort((a, b) => (b.날짜 || '').localeCompare(a.날짜 || '') || (b.시간 || '').localeCompare(a.시간 || ''));

      // 할 일 시트
      const todoRows = data.todos.map(t => ({
        완료: t.done ? 'Y' : '', 할일: t.text || '', 기한: t.due || '',
      }));

      const wb = XLSX.utils.book_new();
      const addSheet = (rows, name, widths) => {
        const ws = XLSX.utils.json_to_sheet(rows);
        if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws, name);
      };
      addSheet(entryRows, '업무일지', [11, 24, 10, 6, 30, 30, 24, 30, 16, 6, 14]);
      addSheet(noteRows, '빠른기록', [11, 8, 40, 6, 6, 14]);
      addSheet(todoRows, '할일', [6, 30, 11]);

      XLSX.writeFile(wb, `worklog-${todayStr()}.xlsx`);
      showToast('엑셀 파일을 내보냈습니다.');
    } catch (err) {
      showToast('내보내기 실패: ' + err.message, () => handleExportExcel());
    } finally {
      setExporting(false);
    }
  };

  // 엑셀 다시 불러오기 — 항상 "새 행만 추가", 기존 기록은 절대 수정/삭제하지 않음.
  // 1) 이미 앱에 있는 것과 내용이 완전히 같은 행은 자동으로 건너뜀(중복 방지)
  // 2) "저장소" 칸에 값이 있는 행(=보관 저장소에서 나온 것)은 건너뜀 — 이미 그 저장소에 안전하게 있으므로
  const handleImportExcel = async file => {
    if (!cfg || !file) return;
    if (typeof XLSX === 'undefined') {
      showToast('엑셀 기능을 불러오지 못했어요. 네트워크 확인 후 새로고침해주세요.');
      return;
    }
    setImporting(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const readSheet = name => {
        const ws = wb.Sheets[name];
        return ws ? XLSX.utils.sheet_to_json(ws, { defval: '' }) : [];
      };
      const S = v => String(v == null ? '' : v).trim();

      // 일지
      const existingEntryFp = new Set(entries.map(e => `${e.date}|${e.title}|${e.problem || ''}|${e.solution || ''}`));
      const newEntries = [];
      readSheet('업무일지').forEach(row => {
        if (S(row['저장소'])) return; // 보관 저장소에서 나온 행은 건너뜀
        const date = S(row['날짜']), title = S(row['프로젝트']);
        if (!date || !title) return; // 필수값 없는 행은 건너뜀
        const problem = S(row['발생문제']), solution = S(row['해결과정']);
        const fp = `${date}|${title}|${problem}|${solution}`;
        if (existingEntryFp.has(fp)) return; // 이미 있는 것과 완전히 같으면 건너뜀
        existingEntryFp.add(fp);
        const category = S(row['카테고리']);
        const importance = S(row['중요도']);
        const now = Date.now();
        newEntries.push({
          id: uid(), date, title,
          category: allCategories.some(c => c.id === category) ? category : '기타',
          importance: IMPORTANCE_LEVELS.some(l => l.id === importance) ? importance : '중',
          problem, solution, lesson: S(row['배운점']),
          overview: S(row['개요']),
          bullets: S(row['주요성과']).split(' / ').map(s => s.trim()).filter(Boolean),
          tags: S(row['태그']).split(',').map(s => s.trim()).filter(Boolean),
          favorite: S(row['즐겨찾기']).toUpperCase() === 'Y',
          deleted: S(row['휴지통']).toUpperCase() === 'Y', deletedAt: null,
          images: [], sourceNoteIds: [],
          createdAt: now, updatedAt: now, _repo: activeTag, _readonly: false,
        });
      });

      // 빠른 기록
      const existingNoteFp = new Set(quickNotes.map(n => `${dateKeyFromDate(new Date(n.createdAt || 0))}|${fmtTime(n.createdAt)}|${n.text || ''}`));
      const newNotes = [];
      readSheet('빠른기록').forEach(row => {
        if (S(row['저장소'])) return;
        const text = S(row['내용']);
        if (!text) return;
        const fp = `${S(row['날짜'])}|${S(row['시간'])}|${text}`;
        if (existingNoteFp.has(fp)) return;
        existingNoteFp.add(fp);
        const now = Date.now();
        newNotes.push({
          id: uid(), text, imageRefs: [],
          processed: S(row['정리됨']).toUpperCase() === 'Y', linkedEntryId: null,
          deleted: S(row['휴지통']).toUpperCase() === 'Y', deletedAt: null,
          createdAt: now, _repo: activeTag, _readonly: false,
        });
      });

      // 할 일
      const existingTodoFp = new Set(todos.map(t => `${t.text || ''}|${t.due || ''}`));
      const newTodos = [];
      readSheet('할일').forEach(row => {
        const text = S(row['할일']);
        if (!text) return;
        const due = S(row['기한']) || null;
        const fp = `${text}|${due || ''}`;
        if (existingTodoFp.has(fp)) return;
        existingTodoFp.add(fp);
        const now = Date.now();
        newTodos.push({ id: uid(), text, due, done: S(row['완료']).toUpperCase() === 'Y', createdAt: now, updatedAt: now });
      });

      const total = newEntries.length + newNotes.length + newTodos.length;
      if (total === 0) {
        showToast('새로 추가할 항목이 없어요 (이미 있거나, 보관 레포 항목이거나, 형식이 안 맞아요).');
        return;
      }
      if (!window.confirm(`업무일지 ${newEntries.length}건, 빠른 기록 ${newNotes.length}건, 할 일 ${newTodos.length}건을 새로 추가할까요?\n기존 기록은 전혀 바뀌지 않아요.`)) return;

      if (newEntries.length) {
        const merged = await writeActiveEntries(current => [...newEntries, ...current], '엑셀에서 일지 가져오기');
        newEntries.forEach(e => markPending(cfg, 'entries', e));
        setEntries(merged);
      }
      if (newNotes.length) {
        const merged = await writeActiveNotes(current => [...newNotes, ...current], '엑셀에서 빠른 기록 가져오기');
        newNotes.forEach(n => markPending(cfg, 'notes', n));
        setQuickNotes(merged);
      }
      if (newTodos.length) {
        const merged = await writeTodos(current => [...newTodos, ...current], '엑셀에서 할 일 가져오기');
        setTodos(merged);
      }
      showToast(`가져왔습니다 (일지 ${newEntries.length}건 · 빠른 기록 ${newNotes.length}건 · 할 일 ${newTodos.length}건).`);
    } catch (err) {
      showToast('가져오기 실패: ' + err.message);
    } finally {
      setImporting(false);
    }
  };

  // JSON 백업 파일에서 가져오기(복원) — 엑셀 가져오기와 같은 원칙(항상 새 항목만 추가, 기존 기록은 절대 안 바꿈)을
  // 따르되, JSON은 이 앱이 만든 원본 그대로라 id·즐겨찾기·사진 경로·연결된 빠른 기록/일지 관계까지 전부 살아있음.
  // 그래서 텍스트만 복원되는 엑셀 가져오기와 달리, 같은 저장소로 복원하는 경우엔 사진도 그대로 보임.
  // (다른 저장소로 복원하는 거라면, 사진 파일 자체는 옛 저장소에 있으니 경로만 살아있고 화면엔 안 보일 수 있음)
  const handleImportJson = async file => {
    if (!cfg || !file) return;
    setImporting(true);
    try {
      let data;
      try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('JSON 파일을 읽지 못했어요. 이 앱에서 내보낸 백업 파일이 맞는지 확인해주세요.'); }
      if (!data || typeof data !== 'object' || !(Array.isArray(data.entries) || Array.isArray(data.quickNotes) || Array.isArray(data.todos))) {
        throw new Error('이 앱에서 내보낸 백업 파일 형식이 아니에요.');
      }

      // id가 기존 항목과 겹치지 않으면 원래 id를 그대로 쓰고(연결 관계 보존), 겹치면 새로 발급
      const reuseId = (wanted, existingIds) => {
        const id = (wanted && !existingIds.has(wanted)) ? wanted : uid();
        existingIds.add(id);
        return id;
      };

      // 일지 — 보관 저장소 몫(data.archives)은 다른 저장소 것이라 건너뛰고, 활성 저장소 몫만 가져옴
      const existingEntryFp = new Set(entries.map(e => `${e.date}|${e.title}|${e.problem || ''}|${e.solution || ''}`));
      const existingEntryIds = new Set(entries.map(e => e.id));
      const newEntries = [];
      (data.entries || []).forEach(e => {
        if (!e || !e.date || !e.title) return;
        const fp = `${e.date}|${e.title}|${e.problem || ''}|${e.solution || ''}`;
        if (existingEntryFp.has(fp)) return; // 이미 있는 것과 완전히 같으면 건너뜀
        existingEntryFp.add(fp);
        newEntries.push({
          ...e,
          id: reuseId(e.id, existingEntryIds),
          category: allCategories.some(c => c.id === e.category) ? e.category : '기타',
          importance: IMPORTANCE_LEVELS.some(l => l.id === e.importance) ? e.importance : '중',
          _repo: activeTag, _readonly: false,
        });
      });

      // 빠른 기록
      const existingNoteFp = new Set(quickNotes.map(n => `${dateKeyFromDate(new Date(n.createdAt || 0))}|${fmtTime(n.createdAt)}|${n.text || ''}`));
      const existingNoteIds = new Set(quickNotes.map(n => n.id));
      const newNotes = [];
      (data.quickNotes || []).forEach(n => {
        if (!n || !n.text) return;
        const fp = `${dateKeyFromDate(new Date(n.createdAt || 0))}|${fmtTime(n.createdAt)}|${n.text}`;
        if (existingNoteFp.has(fp)) return;
        existingNoteFp.add(fp);
        newNotes.push({ ...n, id: reuseId(n.id, existingNoteIds), _repo: activeTag, _readonly: false });
      });

      // 할 일
      const existingTodoFp = new Set(todos.map(t => `${t.text || ''}|${t.due || ''}`));
      const existingTodoIds = new Set(todos.map(t => t.id));
      const newTodos = [];
      (data.todos || []).forEach(t => {
        if (!t || !t.text) return;
        const fp = `${t.text}|${t.due || ''}`;
        if (existingTodoFp.has(fp)) return;
        existingTodoFp.add(fp);
        newTodos.push({ ...t, id: reuseId(t.id, existingTodoIds) });
      });

      const total = newEntries.length + newNotes.length + newTodos.length;
      if (total === 0) {
        showToast('새로 추가할 항목이 없어요 (이미 다 있는 내용이에요).');
        return;
      }
      if (!window.confirm(`업무일지 ${newEntries.length}건, 빠른 기록 ${newNotes.length}건, 할 일 ${newTodos.length}건을 새로 추가할까요?\n기존 기록은 전혀 바뀌지 않아요.`)) return;

      if (newEntries.length) {
        const merged = await writeActiveEntries(current => [...newEntries, ...current], 'JSON 백업에서 일지 가져오기');
        newEntries.forEach(e => markPending(cfg, 'entries', e));
        setEntries(merged);
      }
      if (newNotes.length) {
        const merged = await writeActiveNotes(current => [...newNotes, ...current], 'JSON 백업에서 빠른 기록 가져오기');
        newNotes.forEach(n => markPending(cfg, 'notes', n));
        setQuickNotes(merged);
      }
      if (newTodos.length) {
        const merged = await writeTodos(current => [...newTodos, ...current], 'JSON 백업에서 할 일 가져오기');
        setTodos(merged);
      }
      showToast(`가져왔습니다 (일지 ${newEntries.length}건 · 빠른 기록 ${newNotes.length}건 · 할 일 ${newTodos.length}건).`);
    } catch (err) {
      showToast('가져오기 실패: ' + err.message);
    } finally {
      setImporting(false);
    }
  };

  useEffect(() => {
    if (notifiedRef.current || loading || !todos.length) return;
    const due = todos.filter(t => !t.done && t.due && daysUntil(t.due) <= 0);
    if (due.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
      new Notification('업무일지', { body: `오늘 마감·지난 할 일 ${due.length}건이 있어요.` });
    }
    notifiedRef.current = true;
  }, [todos, loading]);

  /* ---------- 7. 설정 저장 / 레포 전환(로테이션) ---------- */
  const handleSaveConfig = newCfg => {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(newCfg));
    setCfg(newCfg);
  };
  const handleRotateRepo = nextCfg => {
    handleSaveConfig(nextCfg);
    showToast('새 레포로 전환했어요. 이전 레포는 보관되어 계속 조회할 수 있어요.');
  };
  const handleDisconnect = () => {
    if (!window.confirm('이 기기에서 연결 설정을 삭제할까요? GitHub의 데이터는 그대로 남습니다.')) return;
    localStorage.removeItem(CONFIG_KEY);
    setCfg(null);
    setEntries([]); setQuickNotes([]); setTodos([]);
  };

  /* ---------- 8. 쓰기 헬퍼 ----------
     writeActiveNotes / writeActiveEntries : 활성 레포 파일에 저장. transform 함수를 받아서
       "현재 상태"에 적용해 저장하고, 다른 기기/탭이 먼저 저장해서 충돌(409)이 나면
       최신 데이터를 다시 받아와 같은 transform을 한 번 더 적용해 자동으로 재시도한다.
       (내 변경사항은 유지하면서 상대방 변경사항도 같이 살아남음 — 임의로 덮어쓰지 않음)
       반환값은 실제로 저장된 최종 배열(_repo 태그 포함) — 호출부는 이걸로 setEntries/setQuickNotes 하면 됨.
     mutateNote / removeNote / mutateEntry / removeEntry :
       항목이 활성 레포 것이면 활성 레포에, 보관 레포 것이면 "그 항목이 속한 보관 레포"에만 정확히 다시 씀
       (다른 보관 레포는 절대 건드리지 않음 — repoKeyOf로 구분) */
  const activeTag = useMemo(() => (cfg ? { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch || 'main' } : null), [cfg]);
  const writeActiveNotes = (transformFn, message) => quickNotesQueueRef.current(async () => {
    const attempt = async (base, sha) => {
      const merged = transformFn(base);
      const newSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, merged.map(stripMeta), sha, message);
      return { merged, newSha };
    };
    try {
      const { merged, newSha } = await attempt(quickNotes, quickSha);
      setQuickSha(newSha);
      return merged;
    } catch (err) {
      if (err.status !== 409) throw err;
      const fresh = await ghGetJSON(cfg, PATH_QUICK_NOTES);
      const freshTagged = fresh.data.map(x => ({ ...x, _repo: activeTag, _readonly: false }));
      const { merged, newSha } = await attempt(freshTagged, fresh.sha);
      setQuickSha(newSha);
      return merged;
    }
  });
  const writeActiveEntries = (transformFn, message) => entriesQueueRef.current(async () => {
    const attempt = async (base, sha) => {
      const merged = transformFn(base);
      const newSha = await ghPutJSON(cfg, PATH_ENTRIES, merged.map(stripMeta), sha, message);
      return { merged, newSha };
    };
    try {
      const { merged, newSha } = await attempt(entries, entriesSha);
      setEntriesSha(newSha);
      return merged;
    } catch (err) {
      if (err.status !== 409) throw err;
      const fresh = await ghGetJSON(cfg, PATH_ENTRIES);
      const freshTagged = fresh.data.map(x => ({ ...x, _repo: activeTag, _readonly: false }));
      const { merged, newSha } = await attempt(freshTagged, fresh.sha);
      setEntriesSha(newSha);
      return merged;
    }
  });

  // 보관(archive) 레포 항목도 "예외적으로" 수정할 수 있도록 하는 범용 헬퍼들.
  // 활성 레포와 달리, 그 항목이 속한 레포의 파일에만 정확히 다시 씀 (다른 보관 레포는 절대 건드리지 않음).
  const mutateNote = async (note, mutateFn, message) => {
    if (note._readonly) {
      const key = repoKeyOf(note._repo);
      const writeCfg = repoCfgFor(cfg, note._repo);
      const sha = archiveShaRef.current[key] && archiveShaRef.current[key].notesSha;
      const repoNotes = archiveNotes.filter(n => repoKeyOf(n._repo) === key);
      const updated = repoNotes.map(n => (n.id === note.id ? mutateFn(n) : n));
      const newSha = await ghPutJSON(writeCfg, PATH_QUICK_NOTES, updated.map(stripMeta), sha, message + ' (보관 레포)');
      archiveShaRef.current[key] = { ...archiveShaRef.current[key], notesSha: newSha };
      setArchiveNotes(prev => prev.map(n => (n.id === note.id ? mutateFn(n) : n)));
    } else {
      const merged = await writeActiveNotes(current => current.map(n => (n.id === note.id ? mutateFn(n) : n)), message);
      setQuickNotes(merged);
    }
  };
  const removeNote = async (note, message) => {
    if (note._readonly) {
      const key = repoKeyOf(note._repo);
      const writeCfg = repoCfgFor(cfg, note._repo);
      const sha = archiveShaRef.current[key] && archiveShaRef.current[key].notesSha;
      const repoNotes = archiveNotes.filter(n => repoKeyOf(n._repo) === key && n.id !== note.id);
      const newSha = await ghPutJSON(writeCfg, PATH_QUICK_NOTES, repoNotes.map(stripMeta), sha, message + ' (보관 레포)');
      archiveShaRef.current[key] = { ...archiveShaRef.current[key], notesSha: newSha };
      setArchiveNotes(prev => prev.filter(n => n.id !== note.id));
    } else {
      const merged = await writeActiveNotes(current => current.filter(n => n.id !== note.id), message);
      setQuickNotes(merged);
    }
  };
  const mutateEntry = async (entry, mutateFn, message) => {
    if (entry._readonly) {
      const key = repoKeyOf(entry._repo);
      const writeCfg = repoCfgFor(cfg, entry._repo);
      const sha = archiveShaRef.current[key] && archiveShaRef.current[key].entriesSha;
      const repoEntries = archiveEntries.filter(e => repoKeyOf(e._repo) === key);
      const updated = repoEntries.map(e => (e.id === entry.id ? mutateFn(e) : e));
      const newSha = await ghPutJSON(writeCfg, PATH_ENTRIES, updated.map(stripMeta), sha, message + ' (보관 레포)');
      archiveShaRef.current[key] = { ...archiveShaRef.current[key], entriesSha: newSha };
      setArchiveEntries(prev => prev.map(e => (e.id === entry.id ? mutateFn(e) : e)));
    } else {
      const merged = await writeActiveEntries(current => current.map(e => (e.id === entry.id ? mutateFn(e) : e)), message);
      setEntries(merged);
    }
  };
  const removeEntry = async (entry, message) => {
    if (entry._readonly) {
      const key = repoKeyOf(entry._repo);
      const writeCfg = repoCfgFor(cfg, entry._repo);
      const sha = archiveShaRef.current[key] && archiveShaRef.current[key].entriesSha;
      const repoEntries = archiveEntries.filter(e => repoKeyOf(e._repo) === key && e.id !== entry.id);
      const newSha = await ghPutJSON(writeCfg, PATH_ENTRIES, repoEntries.map(stripMeta), sha, message + ' (보관 레포)');
      archiveShaRef.current[key] = { ...archiveShaRef.current[key], entriesSha: newSha };
      setArchiveEntries(prev => prev.filter(e => e.id !== entry.id));
    } else {
      const merged = await writeActiveEntries(current => current.filter(e => e.id !== entry.id), message);
      setEntries(merged);
    }
  };

  /* ---------- 9. 빠른 기록(퀵노트) 핸들러 ---------- */
  const handleAddNote = async (text, files) => {
    setUploading(true);
    try {
      const imageRefs = await uploadNewImages(cfg, files, '빠른 기록 사진 추가');
      const newNote = { id: uid(), text, imageRefs, processed: false, linkedEntryId: null, createdAt: Date.now(), _repo: activeTag, _readonly: false };
      const merged = await writeActiveNotes(current => [newNote, ...current], '빠른 기록 추가');
      markPending(cfg, 'notes', newNote); // GitHub 읽기 반영 지연 대비 — 새로고침해도 잠깐 안 사라지게
      setQuickNotes(merged);
      vibrate(20);
      showToast('기록했습니다.');
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleAddNote(text, files));
    } finally {
      setUploading(false);
    }
  };

  const handleDeleteNote = async note => {
    try {
      await mutateNote(note, n => ({ ...n, deleted: true, deletedAt: Date.now() }), '빠른 기록 휴지통으로 이동');
      showToast('휴지통으로 이동했습니다.');
    } catch (err) {
      showToast('삭제 실패: ' + err.message, () => handleDeleteNote(note));
    }
  };
  // 미리보기 팝업에서 삭제할 때도 QuickCaptureTab 목록과 동일한 규칙 적용 — 이미 일지로 정리된 기록만 한 번 더 확인
  const handleDeleteNoteFromPreview = note => {
    if (note.processed && !window.confirm('이 빠른 기록은 이미 업무일지로 작성됐어요. 그래도 휴지통으로 옮길까요?')) return;
    handleDeleteNote(note);
  };

  const handleRestoreNote = async note => {
    try {
      await mutateNote(note, n => ({ ...n, deleted: false, deletedAt: null }), '빠른 기록 복원');
      showToast('복원했습니다.');
    } catch (err) {
      showToast('복원 실패: ' + err.message, () => handleRestoreNote(note));
    }
  };

  const handlePermanentDeleteNote = async note => {
    if (!window.confirm(note._readonly ? '완전히 삭제할까요? (보관 레포) 첨부된 사진도 함께 삭제되며, 이 작업은 되돌릴 수 없습니다.' : '완전히 삭제할까요? 첨부된 사진도 함께 삭제되며, 이 작업은 되돌릴 수 없습니다.')) return;
    try {
      const writeCfg = repoCfgFor(cfg, note._repo);
      const inUse = collectImagePaths(displayEntries, displayNotes, { excludeNoteId: note.id });
      await deleteOrphanedImages(writeCfg, note.imageRefs, inUse, '빠른 기록 영구 삭제');
      await removeNote(note, '빠른 기록 영구 삭제');
      showToast('영구 삭제했습니다.');
    } catch (err) {
      showToast('삭제 실패: ' + err.message, () => handlePermanentDeleteNote(note));
    }
  };

  const handleEditNoteSave = async (note, newText, keepImages, newFiles) => {
    setSavingNoteEdit(true);
    try {
      const writeCfg = repoCfgFor(cfg, note._repo);
      const uploadedRefs = await uploadNewImages(writeCfg, newFiles, '빠른 기록 사진 추가');
      // 편집 중 사용자가 빼버린 기존 사진은 다른 곳에서 안 쓰고 있으면 레포에서도 삭제
      const keepSet = new Set(keepImages.map(k => imgPaths(k).thumb));
      const removedRefs = (note.imageRefs || []).filter(old => !keepSet.has(imgPaths(old).thumb));
      if (removedRefs.length) {
        const inUse = collectImagePaths(displayEntries, displayNotes, { excludeNoteId: note.id });
        await deleteOrphanedImages(writeCfg, removedRefs, inUse, '빠른 기록 사진 제거');
      }
      await mutateNote(note, n => ({ ...n, text: newText, imageRefs: [...keepImages, ...uploadedRefs], updatedAt: Date.now() }), '빠른 기록 수정');
      vibrate(20);
      showToast(note._readonly ? '보관 레포에 저장했습니다.' : '수정했습니다.');
    } catch (err) {
      showToast('수정 실패: ' + err.message, () => handleEditNoteSave(note, newText, keepImages, newFiles));
    } finally {
      setSavingNoteEdit(false);
    }
  };

  const handlePromote = note => {
    setPrefillNote(note);
    setEditingEntry(null);
    setModalOpen(true);
    setTab('entries');
  };

  /* ---------- 10. 문구 템플릿 핸들러 ---------- */
  const handleAddPhrase = async text => {
    try {
      const newPhrases = [...phrases, { id: uid(), text }];
      const newSha = await ghPutJSON(cfg, PATH_PHRASES, newPhrases, phrasesSha, '문구 템플릿 추가');
      setPhrases(newPhrases); setPhrasesSha(newSha);
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleAddPhrase(text));
    }
  };

  const handleDeletePhrase = async phrase => {
    try {
      const newPhrases = phrases.filter(p => p.id !== phrase.id);
      const newSha = await ghPutJSON(cfg, PATH_PHRASES, newPhrases, phrasesSha, '문구 템플릿 삭제');
      setPhrases(newPhrases); setPhrasesSha(newSha);
    } catch (err) {
      showToast('삭제 실패: ' + err.message, () => handleDeletePhrase(phrase));
    }
  };

  // 커스텀 카테고리 — 기본 5개 + 사용자가 추가한 것. id는 라벨 그대로 사용(기존 카테고리 관례랑 통일).
  const allCategories = useMemo(() => [
    ...CATEGORIES,
    ...customCategories.map(c => ({ id: c.label, label: c.label, color: c.color, Icon: TagIcon })),
  ], [customCategories]);
  const allCategoryMap = useMemo(() => Object.fromEntries(allCategories.map(c => [c.id, c])), [allCategories]);

  const handleAddCategory = async (label, color) => {
    const trimmed = label.trim();
    if (!trimmed) return;
    if (allCategories.some(c => c.id === trimmed)) {
      showToast('이미 있는 카테고리예요.');
      return;
    }
    try {
      const newCats = [...customCategories, { label: trimmed, color }];
      const newSha = await ghPutJSON(cfg, PATH_CATEGORIES, newCats, customCategoriesSha, '카테고리 추가');
      setCustomCategories(newCats); setCustomCategoriesSha(newSha);
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleAddCategory(label, color));
    }
  };
  const handleDeleteCategory = async category => {
    // 이미 이 카테고리를 쓰고 있는 일지가 있으면, 지워도 그 일지들은 그대로 옛날 값(고아 카테고리)을 들고 있게 됨 — 확인만 받음
    const inUseCount = displayEntries.filter(e => e.category === category.label).length;
    if (inUseCount > 0 && !window.confirm(`이 카테고리를 쓰고 있는 일지가 ${inUseCount}건 있어요. 카테고리만 삭제하고, 그 일지들의 카테고리 표시는 그대로 둘까요?`)) return;
    try {
      const newCats = customCategories.filter(c => c.label !== category.label);
      const newSha = await ghPutJSON(cfg, PATH_CATEGORIES, newCats, customCategoriesSha, '카테고리 삭제');
      setCustomCategories(newCats); setCustomCategoriesSha(newSha);
    } catch (err) {
      showToast('삭제 실패: ' + err.message, () => handleDeleteCategory(category));
    }
  };

  /* ---------- 11. 일지 즐겨찾기 ---------- */
  const handleToggleFavorite = async entry => {
    try {
      await mutateEntry(entry, e => ({ ...e, favorite: !e.favorite, updatedAt: Date.now() }), entry.favorite ? '즐겨찾기 해제' : '즐겨찾기 추가');
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleToggleFavorite(entry));
    }
  };

  /* ---------- 12. 할 일(todo) 핸들러 ---------- */
  // 할 일도 entries/notes와 같은 방식으로 — 충돌(409)이면 최신 데이터에 같은 변경을 다시 적용해 자동 재시도
  const writeTodos = (transformFn, message) => todosQueueRef.current(async () => {
    const attempt = async (base, sha) => {
      const merged = transformFn(base);
      const newSha = await ghPutJSON(cfg, PATH_TODOS, merged, sha, message);
      return { merged, newSha };
    };
    try {
      const { merged, newSha } = await attempt(todos, todosSha);
      setTodosSha(newSha);
      return merged;
    } catch (err) {
      if (err.status !== 409) throw err;
      const fresh = await ghGetJSON(cfg, PATH_TODOS);
      const { merged, newSha } = await attempt(fresh.data, fresh.sha);
      setTodosSha(newSha);
      return merged;
    }
  });

  const handleAddTodo = async ({ text, due }) => {
    try {
      const newTodo = { id: uid(), text, due, done: false, createdAt: Date.now(), updatedAt: Date.now() };
      const merged = await writeTodos(current => [newTodo, ...current], '할 일 추가');
      setTodos(merged);
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleAddTodo({ text, due }));
    }
  };
  const handleToggleTodo = async todo => {
    try {
      const now = Date.now();
      const merged = await writeTodos(current => current.map(t => t.id === todo.id ? { ...t, done: !t.done, completedAt: !t.done ? now : null, updatedAt: now } : t), '할 일 상태 변경');
      setTodos(merged);
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleToggleTodo(todo));
    }
  };
  const handleDeleteTodo = todo => {
    vibrate(20);
    setPendingDeleteTodoIds(prev => new Set(prev).add(todo.id));
    const commit = async () => {
      delete pendingDeleteTimersRef.current[todo.id];
      try {
        const merged = await writeTodos(current => current.filter(t => t.id !== todo.id), '할 일 삭제');
        setTodos(merged);
      } catch (err) {
        showToast('삭제 실패: ' + err.message, () => handleDeleteTodo(todo));
      } finally {
        setPendingDeleteTodoIds(prev => { const n = new Set(prev); n.delete(todo.id); return n; });
      }
    };
    pendingDeleteTimersRef.current[todo.id] = setTimeout(commit, 4500);
    showToast('할 일을 삭제했어요.', {
      label: '실행취소', icon: Undo2, duration: 4500,
      onClick: () => {
        clearTimeout(pendingDeleteTimersRef.current[todo.id]);
        delete pendingDeleteTimersRef.current[todo.id];
        setPendingDeleteTodoIds(prev => { const n = new Set(prev); n.delete(todo.id); return n; });
      },
    });
  };
  const handleEditTodo = async (todo, changes) => {
    try {
      const merged = await writeTodos(current => current.map(t => t.id === todo.id ? { ...t, ...changes, updatedAt: Date.now() } : t), '할 일 수정');
      setTodos(merged);
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleEditTodo(todo, changes));
    }
  };
  const handleClearDoneTodos = async () => {
    const doneCount = todos.filter(t => t.done).length;
    if (!doneCount) return;
    if (!window.confirm(`완료된 할 일 ${doneCount}건을 전부 삭제할까요? 되돌릴 수 없어요.`)) return;
    try {
      const merged = await writeTodos(current => current.filter(t => !t.done), '완료된 할 일 일괄 삭제');
      setTodos(merged);
    } catch (err) {
      showToast('삭제 실패: ' + err.message, () => handleClearDoneTodos());
    }
  };

  /* ---------- 13. 일지 작성 / 수정 / 삭제 (+ 모달 열고 닫기) ---------- */
  const openNewEntry = () => { setEditingEntry(null); setPrefillNote(null); setModalOpen(true); };
  const openEditEntry = entry => {
    if (entry._readonly && !window.confirm('이 일지는 보관된 레포에 있어요. 수정하면 그 레포에 바로 저장돼요. 계속할까요?')) return;
    setEditingEntry(entry); setPrefillNote(null); setModalOpen(true);
  };
  const closeModal = () => { setModalOpen(false); setEditingEntry(null); setPrefillNote(null); };

  // 빠른 기록 카드에서 "일지 보기" — 연결된 일지를 찾아 업무일지 탭으로 이동 후 수정 모달을 엶
  const handleViewLinkedEntry = note => {
    const entry = displayEntries.find(e => e.id === note.linkedEntryId);
    if (!entry) { showToast('연결된 일지를 찾을 수 없어요. 삭제되었거나, 아직 안 불러온 보관 레포에 있을 수 있어요.'); return; }
    setTab('entries');
    setPreviewEntryId(entry.id); // 바로 수정 화면으로 가지 않고, 먼저 내용만 확인할 수 있게 팝업으로 보여줌
  };
  // 업무일지 카드에서 "원본 빠른 기록 보기" — 정리하기 전 원본 기록을 찾아 빠른 기록 탭으로 이동 후 보여줌
  const handleViewSourceNote = entry => {
    const noteId = entry.sourceNoteIds && entry.sourceNoteIds[0];
    const note = noteId ? displayNotes.find(n => n.id === noteId) : null;
    if (!note) { showToast('원본 빠른 기록을 찾을 수 없어요. 삭제되었거나, 아직 안 불러온 보관 레포에 있을 수 있어요.'); return; }
    setTab('quick');
    setPreviewNoteId(note.id); // 바로 수정 화면으로 가지 않고, 먼저 내용만 확인할 수 있게 팝업으로 보여줌
  };

  const handleSaveEntry = async data => {
    const { keepImages, newFiles, ...fields } = data;
    try {
      if (editingEntry) {
        const writeCfg = repoCfgFor(cfg, editingEntry._repo);
        const uploadedRefs = await uploadNewImages(writeCfg, newFiles, '업무일지 사진 추가');
        // 수정 중 사용자가 빼버린 기존 사진은 다른 곳에서 안 쓰고 있으면 레포에서도 삭제
        const keepSet = new Set(keepImages.map(k => imgPaths(k).thumb));
        const removedRefs = (editingEntry.images || []).filter(old => !keepSet.has(imgPaths(old).thumb));
        if (removedRefs.length) {
          const inUse = collectImagePaths(displayEntries, displayNotes, { excludeEntryId: editingEntry.id });
          await deleteOrphanedImages(writeCfg, removedRefs, inUse, '일지 사진 제거');
        }
        await mutateEntry(editingEntry, e => ({ ...e, ...fields, images: [...keepImages, ...uploadedRefs], updatedAt: Date.now() }), '일지 수정');
        closeModal();
        showToast(editingEntry._readonly ? '보관 레포에 저장했습니다.' : '저장했습니다.');
        return true;
      }
      // 새 일지 작성 — 빠른 기록에서 정리하는 거라면 그 기록이 속한 레포에 그대로 작성 (기존 사진이 그 레포에 있으므로), 아니면 활성 레포에 작성
      const now = Date.now();
      const targetRepo = (prefillNote && prefillNote._readonly) ? prefillNote._repo : activeTag;
      const writeCfg = repoCfgFor(cfg, targetRepo);
      const uploadedRefs = await uploadNewImages(writeCfg, newFiles, '업무일지 사진 추가');
      const newEntry = {
        id: uid(), ...fields, images: [...keepImages, ...uploadedRefs], sourceNoteIds: prefillNote ? [prefillNote.id] : [],
        createdAt: now, updatedAt: now, _repo: targetRepo, _readonly: !!(prefillNote && prefillNote._readonly),
      };

      if (newEntry._readonly) {
        const key = repoKeyOf(targetRepo);
        const sha = archiveShaRef.current[key] && archiveShaRef.current[key].entriesSha;
        const repoEntries = archiveEntries.filter(e => repoKeyOf(e._repo) === key);
        const updated = [newEntry, ...repoEntries];
        const newSha = await ghPutJSON(writeCfg, PATH_ENTRIES, updated.map(stripMeta), sha, '빠른 기록에서 일지 작성 (보관 레포)');
        archiveShaRef.current[key] = { ...archiveShaRef.current[key], entriesSha: newSha };
        setArchiveEntries(prev => [newEntry, ...prev]);
      } else {
        const merged = await writeActiveEntries(current => [newEntry, ...current], prefillNote ? '빠른 기록에서 일지 작성' : '새 일지 작성');
        markPending(cfg, 'entries', newEntry); // GitHub 읽기 반영 지연 대비
        setEntries(merged);
      }

      if (prefillNote) {
        await mutateNote(prefillNote, n => ({ ...n, processed: true, linkedEntryId: newEntry.id }), '빠른 기록 정리 완료 처리');
      }
      closeModal();
      vibrate(20);
      showToast('저장했습니다.');
      return true;
    } catch (err) {
      showToast('저장 실패: ' + err.message, () => handleSaveEntry(data));
      return false;
    }
  };

  const handleDeleteEntry = entry => {
    if (!window.confirm(`"${entry.title || '(제목 없음)'}" 일지를 휴지통으로 이동할까요?`)) return;
    vibrate(20);
    (async () => {
      try {
        await mutateEntry(entry, e => ({ ...e, deleted: true, deletedAt: Date.now() }), '일지 휴지통으로 이동');
        showToast(entry._readonly ? '보관 레포 휴지통으로 이동했습니다.' : '휴지통으로 이동했습니다.');
      } catch (err) {
        showToast('삭제 실패: ' + err.message, () => handleDeleteEntry(entry));
      }
    })();
  };
  const handleRestoreEntry = async entry => {
    try {
      await mutateEntry(entry, e => ({ ...e, deleted: false, deletedAt: null }), '일지 복원');
      showToast('복원했습니다.');
    } catch (err) {
      showToast('복원 실패: ' + err.message, () => handleRestoreEntry(entry));
    }
  };
  const handlePermanentDeleteEntry = async entry => {
    if (!window.confirm(entry._readonly ? '완전히 삭제할까요? (보관 레포) 첨부된 사진도 함께 삭제되며, 이 작업은 되돌릴 수 없습니다.' : '완전히 삭제할까요? 첨부된 사진도 함께 삭제되며, 이 작업은 되돌릴 수 없습니다.')) return;
    try {
      const writeCfg = repoCfgFor(cfg, entry._repo);
      const inUse = collectImagePaths(displayEntries, displayNotes, { excludeEntryId: entry.id });
      await deleteOrphanedImages(writeCfg, entry.images, inUse, '일지 영구 삭제');
      await removeEntry(entry, '일지 영구 삭제');
      showToast('영구 삭제했습니다.');
    } catch (err) {
      showToast('삭제 실패: ' + err.message, () => handlePermanentDeleteEntry(entry));
    }
  };

  const requestNotifPermission = () => {
    if ('Notification' in window) Notification.requestPermission();
  };

  /* ---------- 13. 렌더링 ---------- */
  // 아직 GitHub 연결(owner/repo/token) 설정이 안 됐으면 연결 화면만 보여줌
  if (!cfg) {
    return (
      <div className="dark">
        <SettingsPanel onSave={handleSaveConfig} />
      </div>
    );
  }

  const overdueTodoCount = todos.filter(t => !t.done && t.due && daysUntil(t.due) <= 0).length;
  const unprocessedNoteCount = quickNotes.filter(n => !n.processed && !n.deleted).length;

  return (
    <div className="h-[100dvh] flex flex-col bg-[#F7F7F9] dark:bg-[#0B0E13] transition-colors overflow-hidden">
      <div ref={scrollRef} onTouchStart={onPullTouchStart} onTouchMove={onPullTouchMove} onTouchEnd={onPullTouchEnd}
        className="flex-1 overflow-y-auto overflow-x-hidden" style={{ paddingTop: 'env(safe-area-inset-top, 0px)', scrollbarGutter: 'stable' }}>
        <div className="flex items-center justify-center overflow-hidden transition-[height] duration-200 ease-out" style={{ height: pullY }}>
          <RefreshCw size={16} className={pullTriggeredRef.current || loading ? 'wj-spin text-slate-600 dark:text-slate-300' : 'text-slate-400 dark:text-slate-600'}
            style={pullTriggeredRef.current || loading ? undefined : { transform: `rotate(${Math.min(pullY / PULL_THRESHOLD, 1) * 360}deg)` }} />
        </div>
        <div className="max-w-2xl lg:max-w-3xl xl:max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-6">
          <header className="flex items-center justify-between mb-4">
            <Logo />
            <div className="flex items-center gap-1.5">
              <button onClick={loadAll} disabled={loading} title="새로고침"
                className="p-2.5 rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all disabled:opacity-50">
                <RefreshCw size={17} className={loading ? 'wj-spin' : ''} />
              </button>
              <button onClick={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))}
                className="p-2.5 rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all">
                {theme === 'dark' ? <Sun size={17} /> : <Moon size={17} />}
              </button>
            </div>
          </header>

          {syncError && (
            <div className="mb-4 flex items-center justify-between gap-2 rounded-lg border border-red-500/25 bg-red-500/10 px-3 py-2.5 text-[12px] text-red-400">
              <span className="break-words">{syncError}</span>
              <button onClick={loadAll} className="shrink-0 underline active:scale-90 transition-transform">재시도</button>
            </div>
          )}
          {offline && (
            <div className="mb-4 flex items-center justify-between gap-2 rounded-lg border border-amber-500/25 bg-amber-500/10 px-3 py-2.5 text-[12px] text-amber-500">
              <span className="break-words">
                오프라인이에요{offlineCachedAt ? ` · ${fmtDateShort(dateKeyFromDate(new Date(offlineCachedAt)))} ${fmtTime(offlineCachedAt)} 기준 저장된 내용을 보여주고 있어요` : ''}. 이 상태에서 한 변경사항은 저장되지 않을 수 있어요.
              </span>
              <button onClick={loadAll} className="shrink-0 underline whitespace-nowrap active:scale-90 transition-transform">다시 연결</button>
            </div>
          )}
          {!syncError && !offline && lastSynced && (
            <div className="mb-4 text-[11px] text-slate-400 dark:text-slate-600"
              title="다른 기기에서 저장한 내용은 이 화면을 새로고침해야 반영돼요">
              {fmtTime(lastSynced)} 동기화
            </div>
          )}

          {loading && !lastSynced ? (
            <div className="space-y-2.5">
              {[0, 1, 2].map(i => (
                <div key={i} className="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4 overflow-hidden relative">
                  <div className="h-3 w-24 rounded bg-slate-100 dark:bg-slate-800 animate-pulse mb-3" />
                  <div className="h-3.5 w-2/3 rounded bg-slate-100 dark:bg-slate-800 animate-pulse mb-2" />
                  <div className="h-3 w-full rounded bg-slate-100 dark:bg-slate-800 animate-pulse" />
                </div>
              ))}
            </div>
          ) : (
          <React.Fragment>
          {tab === 'quick' && <QuickCaptureTab cfg={cfg} notes={displayNotes} phrases={phrases} editingNote={editingNote} onEditNote={setEditingNote} onAdd={handleAddNote} onDelete={handleDeleteNote} onRestore={handleRestoreNote} onPermanentDelete={handlePermanentDeleteNote} onEditSave={handleEditNoteSave} onPromote={handlePromote} onViewEntry={handleViewLinkedEntry} uploading={uploading} savingEdit={savingNoteEdit} hasArchives={hasArchives} archivesLoaded={archivesLoaded} archiveLoading={archiveLoading} onLoadArchives={loadArchives} />}
          {tab === 'todos' && <TodoTab todos={visibleTodos} onAdd={handleAddTodo} onToggle={handleToggleTodo} onDelete={handleDeleteTodo} onEdit={handleEditTodo} onClearDone={handleClearDoneTodos} />}
          {tab === 'entries' && <EntriesTab cfg={cfg} entries={displayEntries} notes={displayNotes} categories={allCategories} categoryMap={allCategoryMap} onOpenNew={openNewEntry} onEdit={openEditEntry} onDelete={handleDeleteEntry} onToggleFavorite={handleToggleFavorite} onRestore={handleRestoreEntry} onPermanentDelete={handlePermanentDeleteEntry} onViewSource={handleViewSourceNote} onPreviewEntry={entry => setPreviewEntryId(entry.id)} hasArchives={hasArchives} archivesLoaded={archivesLoaded} archiveLoading={archiveLoading} onLoadArchives={loadArchives} />}
          {tab === 'settings' && (
            <div className="space-y-6">
              <div className="space-y-2.5">
                <SettingsSectionHeader icon={Key} label="계정 연결" />
                <SettingsPanel embedded initial={cfg} onSave={handleSaveConfig} onDisconnect={handleDisconnect} />
              </div>

              <div className="space-y-2.5">
                <SettingsSectionHeader icon={DatabaseIcon} label="데이터 관리" />
                <DataExportPanel onExport={handleExportData} onExportExcel={handleExportExcel} onImportExcel={handleImportExcel} onImportJson={handleImportJson} exporting={exporting} importing={importing} />
                <RepoUsagePanel cfg={cfg} />
                <RepoArchivePanel cfg={cfg} onRotate={handleRotateRepo} />
              </div>

              <div className="space-y-2.5">
                <SettingsSectionHeader icon={TagIcon} label="커스터마이즈" />
                <CategoryManager customCategories={customCategories} onAdd={handleAddCategory} onDelete={handleDeleteCategory} />
                <PhraseManager phrases={phrases} onAdd={handleAddPhrase} onDelete={handleDeletePhrase} />
              </div>

              <div className="space-y-2.5">
                <SettingsSectionHeader icon={SettingsIcon} label="기타" />
                <div className="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-[13px] text-slate-600 dark:text-slate-300"><BellIcon size={14} /> 할 일 알림</div>
                    <button onClick={requestNotifPermission} className="text-[12px] font-medium px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-transform">권한 요청</button>
                  </div>
                  <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5 leading-relaxed">
                    이 앱을 열어뒀을 때만 뜨는 알림이에요. 폰이 잠겨있거나 앱을 닫았을 때 울리는 진짜 알람은 아닙니다.
                  </p>
                </div>
                <p className="text-center text-[11px] font-mono text-slate-300 dark:text-slate-700 pt-1">업무일지 {APP_VERSION}</p>
              </div>
            </div>
          )}
          </React.Fragment>
          )}
        </div>
      </div>

      <div className="shrink-0 px-3 pt-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 0.5rem)' }}>
        <div className="max-w-2xl lg:max-w-3xl xl:max-w-4xl mx-auto flex items-stretch rounded-xl border border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/90 backdrop-blur-md shadow-[0_10px_30px_-6px_rgba(15,23,42,0.18)] dark:shadow-[0_10px_30px_-6px_rgba(0,0,0,0.5)] px-1 py-1">
          <TabButton active={tab === 'quick'} onClick={() => setTab('quick')} icon={Inbox} label="빠른 기록" badge={unprocessedNoteCount} />
          <TabButton active={tab === 'todos'} onClick={() => setTab('todos')} icon={ListChecks} label="할 일" badge={overdueTodoCount} />
          <TabButton active={tab === 'entries'} onClick={() => setTab('entries')} icon={FolderKanban} label="업무일지" badge={0} />
          <TabButton active={tab === 'settings'} onClick={() => setTab('settings')} icon={SettingsIcon} label="설정" badge={0} />
        </div>
      </div>

      <EntryFormModal open={modalOpen} initial={editingEntry} prefillNote={prefillNote} cfg={cfg} existingProjects={existingProjects} existingTags={existingTags} categories={allCategories} onClose={closeModal} onSave={handleSaveEntry} />
      <EntryPreviewModal open={!!previewEntry} entry={previewEntry} cfg={cfg} categoryMap={allCategoryMap} onClose={() => setPreviewEntryId(null)} onEdit={openEditEntry} onDelete={handleDeleteEntry} onToggleFavorite={handleToggleFavorite} onViewSource={handleViewSourceNote} />
      <NotePreviewModal open={!!previewNote} note={previewNote} cfg={cfg} onClose={() => setPreviewNoteId(null)} onEdit={setEditingNote} onDelete={handleDeleteNoteFromPreview} onPromote={handlePromote} onViewEntry={handleViewLinkedEntry} />
      <Toast toast={toast} onAction={() => { if (toast && toast.action) toast.action.onClick(); }} />
      <GlobalLightbox />
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // 앱을 열 때마다 새 sw.js가 있는지 한 번 더 적극적으로 확인 (브라우저 자체 체크는 느릴 수 있음)
        reg.update().catch(() => {});
        // 이미 새 버전이 설치돼서 대기 중이면 바로 활성화 요청
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.addEventListener('updatefound', () => {
          const installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', () => {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              installing.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      }).catch(() => {});

      // 새 서비스워커가 실제로 이 페이지의 주인이 되는 순간(구버전 → 신버전 전환) 딱 한 번 자동 새로고침
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
